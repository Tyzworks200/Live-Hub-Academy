const e=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const I=(n,x)=>`<span class="msy"${x?" "+x:""}>${n}</span>`;
const REDUCE=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- search index ---------- */
const STOP=new Set("a an the my our is are was to it of and or i in on at not no does do doesnt dont cant cannot can after when with for why how what why be this that from get gets got any all".split(" "));
const SYN=[["silence","silent","nothing","quiet","no audio","no sound","mute","hear nothing","dead air"],["slow","delay","latency","lag","wait","pause","takes long","long time"],["hang up","hangs up","end","ends","drop","drops","disconnect","disconnects","cut off","cuts off","terminated"],["transfer","forward","handoff","hand off","human","person","live agent","front desk"],["route","routing","rule","no route","routes"],["number","phone number","did","e164","e.164"],["understand","misunderstand","mishear","mishears","recognition","stt","asr","transcribe","transcription","hear"],["voice","tts","robotic","sound","speech"],["interrupt","interrupts","barge","barge-in","talks over","overlap","cut me off"],["language","translate","translation","translator","hebrew","spanish","french","arabic"],["document","documents","faq","knowledge","rag","hallucination","invents"],["cost","price","expensive","tokens","bill"],["teams","microsoft teams"],["sip","trunk","pbx","carrier","sip connection"],["digits","id","identity","numbers wrong"],["welcome","greeting","hello","first message"],["repeat","repeats","loop","twice","again"],["record","recording"],["assist","agent assist","siprec"],["bot","agent","assistant","ai agent","bot connection"],["call","calls","calling","phone call"]];
const SYNMAP={};SYN.forEach(g=>g.forEach(w=>{SYNMAP[w]=g;}));
const norm=s=>String(s||"").toLowerCase().replace(/[“”"'’]/g,"").replace(/[^a-z0-9+*.\s-]/g," ").replace(/\s+/g," ").trim();
let INDEX=null;
function buildIndex(){
  if(INDEX) return INDEX;
  INDEX=[];
  AG_ISSUES.forEach(x=>INDEX.push({kind:"issue",id:x.id,title:x.title,area:x.area,snip:x.why,t:norm(x.title),s:norm(x.says.join(" | ")),b:norm(x.why+" "+x.tryit.join(" ")+" "+x.area)}));
  const ts=(window.DATA&&DATA.troubleshooting)||[];
  ts.forEach(x=>INDEX.push({kind:"result",id:"ts-"+x.id,title:x.title,area:x.section||"Calls",snip:x.meaning||"",t:norm(x.title),s:norm((x.status||[]).join(" | ")),b:norm([x.meaning,(x.causes||[]).join(" "),(x.actions||[]).join(" "),x.type,x.section].join(" ")),raw:x}));
  Object.keys(AG_HINTS).forEach(k=>{const h=AG_HINTS[k];INDEX.push({kind:"hint",id:k,title:h.title,area:"Good to know",snip:h.big,t:norm(h.title),s:norm(h.big),b:norm(h.body.join(" "))});});
  ((window.DATA&&DATA.tracks)||[]).forEach(t=>INDEX.push({kind:"path",id:t.id,title:t.title,area:t.eyebrow||"Learning path",snip:t.outcome||t.description||"",t:norm(t.title),s:norm(t.eyebrow||""),b:norm([t.description,t.outcome].join(" "))}));
  AG_STEPS.forEach((s,i)=>INDEX.push({kind:"step",id:String(i+1),title:"Step "+(i+1)+": "+s.title,area:"Build an agent",snip:s.lead,t:norm(s.title),s:norm(s.todo.map(t=>t[0]).join(" ")),b:norm(s.lead+" "+s.todo.map(t=>t[1]).join(" "))}));
  return INDEX;
}
function expand(tok){const set=new Set([tok]);Object.keys(SYNMAP).forEach(w=>{if(w===tok||(tok.length>3&&w.startsWith(tok)))SYNMAP[w].forEach(x=>set.add(x));});return [...set];}
function has(field,term){if(!field)return false;if(term.includes(" "))return field.includes(term);const re=new RegExp("(^|[\\s|(/-])"+term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));return re.test(field);}
function search(q,limit){
  const idx=buildIndex(),nq=norm(q);if(!nq)return[];
  let toks=nq.split(" ").filter(t=>t.length>1&&!STOP.has(t));
  const phrase=nq.length>3?nq:null;
  if(!toks.length) toks=nq.split(" ").filter(Boolean);
  const out=[];
  idx.forEach(it=>{
    let score=0,hit=0;
    toks.forEach(tok=>{let best=0;expand(tok).forEach((term,ti)=>{const w=ti===0?1:.7;
      if(has(it.t,term))best=Math.max(best,6*w);else if(has(it.s,term))best=Math.max(best,4*w);else if(has(it.b,term))best=Math.max(best,1.2*w);});
      if(best){score+=best;hit++;}});
    if(phrase&&(it.t.includes(phrase)||it.s.includes(phrase)))score+=8;
    if(!hit)return;
    if(hit===toks.length)score*=1.6;
    if(it.kind==="issue")score*=1.15;
    if(it.kind==="path")score*=1.4;
    out.push([score,it]);
  });
  out.sort((a,b)=>b[0]-a[0]);
  return out.slice(0,limit||8).map(x=>x[1]);
}

}

function issueCard(id){
  if(id.indexOf("ts-")===0){const x=((window.DATA&&DATA.troubleshooting)||[]).find(t=>"ts-"+t.id===id);if(!x)return "";
    return `<article class="ag-issue" id="i-${e(id)}"><span class="ag-area">${e(x.section||"Calls")} · ${e(x.type||"Call result")}</span><h2>${e(x.title)}</h2><p class="ag-big">${e(x.meaning||"")}</p>${(x.causes||[]).length?`<h4>Common causes</h4><ul>${x.causes.map(c=>`<li>${e(c)}</li>`).join("")}</ul>`:""}${(x.actions||[]).length?`<h4>Try this</h4><ol>${x.actions.map(c=>`<li>${e(c)}</li>`).join("")}</ol>`:""}${x.escalate?`<div class="ag-esc">${I("support_agent")}<span><b>When to contact support.</b> ${e(x.escalate)}${(x.evidence||[]).length?` Send: ${e(x.evidence.join(", "))}.`:""}</span></div>`:""}</article>`;}
  const x=AG_ISSUES.find(i=>i.id===id);if(!x)return "";
  return `<article class="ag-issue" id="i-${e(id)}"><span class="ag-area">${e(x.area)}</span><h2>${e(x.title)}</h2><p class="ag-big">${e(x.why)}</p><h4>Try this</h4><ol>${x.tryit.map(t=>`<li>${e(t)}</li>`).join("")}</ol>`+
   (x.esc?`<div class="ag-esc">${I("support_agent")}<span><b>Still stuck? Contact support</b> with 2–3 Call IDs from Calls › Call History, the time and time zone, the calling and called number, and what each side heard.</span></div>`:"")+
   `<div class="ag-issue-foot">${x.step?`<button class="ag-btn ghost small" data-go="#/agents/build/${x.step}">${I("flag")}Open Step ${x.step}: ${e(AG_STEPS[x.step-1].title)}</button>`:""}${(x.hints||[]).map(k=>`<button class="ag-hintchip" data-hint="${k}">${I("lightbulb")}${e(AG_HINTS[k].title)}</button>`).join("")}${x.link?`<a class="ag-doclink" href="${x.link[1]}" target="_blank" rel="noopener">${I("open_in_new")}${e(x.link[0])}</a>`:""}</div></article>`;
}
function solve(id){
  document.title="Solve an issue · Live Hub Academy";
  const areas=[...new Set(AG_ISSUES.map(i=>i.area))];
  const ts=(window.DATA&&DATA.troubleshooting)||[];
  app.innerHTML=`<div class="ag">${strip("Solve an issue",true)}<div class="ag-main">
   <div class="ag-welcome left"><span class="ag-kick">Solve an issue</span><h1>What's going wrong?</h1><p>Describe it the way a caller would. ${AG_ISSUES.length} AI Agent and call issues, plus ${ts.length} Live Hub call results.</p></div>
   ${searchBox("ag-s-solve",true,"e.g. “caller hears silence after transfer”, “408”, “bot is slow”")}
   <div id="ag-open">${id?issueCard(id):""}</div>
   <div class="ag-areas">${areas.map(a=>`<section><h3>${e(a)}</h3><div class="ag-ilist">${AG_ISSUES.filter(i=>i.area===a).map(i=>`<button class="ag-iline${i.id===id?" on":""}" data-go="#/agents/solve/${i.id}">${e(i.title)}${I("chevron_right")}</button>`).join("")}</div></section>`).join("")}
   ${ts.length?`<section><h3>Live Hub call results and SIP codes</h3><p class="ag-sub" style="margin:0 0 8px">${ts.length} entries from the Academy's troubleshooting library. Search above, or open the full list.</p><button class="ag-btn ghost small" onclick="go('#/troubleshoot')">${I("list")}Open the full troubleshooting library</button></section>`:""}</div>
  </div></div>`;
  wireCommon(app);
  const sb=wireSearch(app,"ag-s-solve",false);
  if(id){const o=document.getElementById("ag-open");if(o&&o.firstChild)setTimeout(()=>o.scrollIntoView({behavior:REDUCE?"auto":"smooth",block:"start"}),30);}
  else if(sb)sb.inp.focus({preventScroll:true});
}

window.renderAgents=function(parts){
  ensureOverlays();closeOverlays();
  const p1=parts[1],p2=parts[2];
  if(p1==="build"&&/^[1-5]$/.test(p2||"")) step(+p2-1);
  else if(p1==="live") live();
  else if(p1==="solve") solve(p2?decodeURIComponent(p2):null);
  else hub();
};
window.agOpenHint=openHint;
window.agWireSearch=(root,id)=>{ensureOverlays();wireSearch(root,id,false);};
})();

function sceneHtml(){

   <div class="hm-col src">${SRC.map((x,i)=>`<span class="hm-n" data-s="${i}">${I(x[0])}${e(x[1])}</span>`).join("")}</div>
   <div class="hm-core"><div class="hm-orb" id="hm-orb"><span class="hm-orb-ring"></span><b>Live Hub</b><small id="hm-svc">Routing</small></div></div>
   <div class="hm-col dst">${DST.map((x,i)=>`<span class="hm-n" data-d="${i}">${I(x[0])}${e(x[1])}</span>`).join("")}</div></div>`;

let curScene=0,autoT=null;
function drawWires(){
  const box=document.getElementById("hm-scene"),svg=document.getElementById("hm-wires");if(!box||!svg)return;
  const sc=SCEN[curScene],R=box.getBoundingClientRect(),orb=document.getElementById("hm-orb").getBoundingClientRect();
  const ox=orb.left-R.left+orb.width/2,oy=orb.top-R.top+orb.height/2,orx=orb.width/2;
  svg.setAttribute("viewBox",`0 0 ${R.width} ${R.height}`);
  let h="";
  const mk=(d,on,delay)=>`<path d="${d}" class="hm-w${on?" on":""}"/>`+(on&&!REDUCE?`<circle r="5" class="hm-dot"><animateMotion dur="1.8s" begin="${delay}s" repeatCount="indefinite" path="${d}"/></circle>`:"");
  box.querySelectorAll("[data-s]").forEach(n=>{const r=n.getBoundingClientRect(),x=r.right-R.left,y=r.top-R.top+r.height/2,on=sc.src.includes(+n.dataset.s);n.classList.toggle("on",on);
    const d=`M${x} ${y} C${x+60} ${y} ${ox-orx-60} ${oy} ${ox-orx} ${oy}`;h+=mk(d,on,0);});
  box.querySelectorAll("[data-d]").forEach(n=>{const r=n.getBoundingClientRect(),x=r.left-R.left,y=r.top-R.top+r.height/2,on=sc.dst.includes(+n.dataset.d);n.classList.toggle("on",on);
    const d=`M${ox+orx} ${oy} C${ox+orx+60} ${oy} ${x-60} ${y} ${x} ${y}`;h+=mk(d,on,.9);});
  svg.innerHTML=h;

}
function setScene(i,user){

}
