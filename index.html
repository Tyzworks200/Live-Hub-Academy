<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Live Hub Academy V22 — Learn, build, share</title>
<meta name="description" content="Hands-on Live Hub paths that turn real customer goals into working Voice AI and telephony outcomes."/>
<meta name="theme-color" content="#051126"/>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link rel="alternate icon" href="favicon.ico"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<style>@import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Rajdhani:wght@600;700&display=swap");
@import url("https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0");

:root{
  --ink:#050b18; --navy:#124680; --blue:#005cff; --cyan:#00bcff; --bcyan:#00ffff;
  --violet:#ba4cf6; --pink:#e64ca6; --green:#12b888; --amber:#f4b93e; --red:#e0503f;
  --paper:#f3f8fc; --line:#d7e3ee; --muted:#5a6b7f; --card:#ffffff;
  --radius:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Poppins",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:"Rajdhani",sans-serif;font-weight:700}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
.msy{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;font-size:20px;line-height:1;display:inline-block;vertical-align:middle;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#c7d8e4;border-radius:99px}

/* ===== layout shell ===== */
#topbar{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;align-items:center;justify-content:space-between;
  height:64px;padding:0 22px;background:rgba(5,17,38,.92);backdrop-filter:blur(10px);color:#fff;
  border-bottom:1px solid rgba(255,255,255,.08)}
.brand{display:flex;align-items:center;gap:10px;font:700 17px/1 "Rajdhani",sans-serif;letter-spacing:.01em}
.brand-mark{display:flex;height:22px;align-items:center;gap:2.5px}
.brand-mark span{width:3.5px;border-radius:99px;background:linear-gradient(#45e5ff,#1481ff)}
.brand-mark span:nth-child(1){height:10px}.brand-mark span:nth-child(2){height:20px}
.brand-mark span:nth-child(3){height:15px}.brand-mark span:nth-child(4){height:8px}
#topnav{display:flex;align-items:center;gap:4px}
#topnav button{padding:8px 14px;border-radius:99px;font-size:13.5px;font-weight:600;color:#b7c8dd}
#topnav button:hover{background:rgba(255,255,255,.08);color:#fff}
#topnav button.on{background:linear-gradient(135deg,#0a6dfb,#00bceb);color:#fff}
#topright{display:flex;align-items:center;gap:10px}
.pill-stat{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;background:rgba(255,255,255,.08);font-size:12.5px;font-weight:700;color:#fff;white-space:nowrap}
.pill-stat .msy{font-size:16px}
.pill-stat.xp{background:linear-gradient(135deg,rgba(0,188,235,.25),rgba(186,76,246,.2));border:1px solid rgba(0,188,235,.35)}
.pill-stat.streak .msy{color:#ffb54b}
#soundbtn{width:34px;height:34px;border-radius:99px;display:grid;place-items:center;background:rgba(255,255,255,.08);color:#fff}
#soundbtn:hover{background:rgba(255,255,255,.16)}
#burger{display:none;width:34px;height:34px;border-radius:99px;place-items:center;background:rgba(255,255,255,.08);color:#fff}

#app{padding-top:64px;min-height:100vh}
.page{max-width:1180px;margin:0 auto;padding:28px 24px 90px}
.kicker{display:inline-flex;align-items:center;gap:6px;font:700 11.5px/1 "Rajdhani",sans-serif;letter-spacing:.14em;color:var(--blue)}
.back-btn{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-weight:600;font-size:13px;margin-bottom:14px}
.back-btn:hover{color:var(--blue)}

/* ===== home hero ===== */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:clamp(34px,6vw,64px);margin-bottom:30px;color:#fff;
  background:radial-gradient(circle at 15% 0%,rgba(0,188,235,.35),transparent 40%),radial-gradient(circle at 90% 100%,rgba(186,76,246,.3),transparent 45%),linear-gradient(150deg,#050b18,#0a1f3d 55%,#0a2a52)}
.hero::after{content:"";position:absolute;inset:auto -100px -120px auto;width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,255,255,.1),transparent 70%)}
.hero-grid{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(34px,4.6vw,54px);line-height:1.04;margin:14px 0 16px;letter-spacing:-.01em}
.hero p.lead{max-width:520px;color:#b9cbe0;font-size:16px;line-height:1.65;margin:0 0 26px}
.hero-ctas{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:99px;font-weight:700;font-size:14.5px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#0a6dfb,#00d2ff);color:#00182f;box-shadow:0 14px 30px rgba(0,120,255,.35)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.18)}
.btn-ghost:hover{background:rgba(255,255,255,.15)}
.btn-dark{background:#0d1b30;color:#fff}
.btn-dark:hover{background:#132849}

/* mini build preview inside hero */
.hero-preview{position:relative;border-radius:20px;background:rgba(6,16,34,.55);border:1px solid rgba(255,255,255,.12);padding:20px}
.hero-preview small{font:700 10.5px/1 "Rajdhani",sans-serif;letter-spacing:.12em;color:#7fd8ff}
.hero-preview h3{margin:6px 0 14px;font-size:19px;color:#fff}
.hp-chain{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;position:relative}
.hp-rail{position:absolute;top:16px;left:7%;right:7%;height:2px;background:rgba(255,255,255,.14);border-radius:99px;z-index:0}
.hp-rail>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#0a6dfb,#00e5ff);transition:width .5s ease}
.hp-node{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:5px}
.hp-node .dot{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.08);color:#5f7b9c;border:1px solid rgba(255,255,255,.14);transition:all .4s}
.hp-node .dot .msy{font-size:16px}
.hp-node small{font-size:8.5px;font-weight:700;color:#5f7b9c;text-align:center}
.hp-node.on .dot{background:linear-gradient(145deg,#6bf0c6,#12b888);color:#003b2d;border-color:transparent;box-shadow:0 4px 12px rgba(18,184,136,.4)}
.hp-node.on small{color:#8bf0cf}

/* ===== continue card ===== */
.continue-card{display:flex;align-items:center;gap:18px;padding:18px 22px;border-radius:18px;margin-bottom:26px;
  background:#fff;border:1px solid var(--line);box-shadow:0 10px 26px rgba(5,43,81,.05)}
.continue-card .ring{flex:0 0 auto}
.continue-card h3{margin:0 0 3px;font-size:18px}
.continue-card p{margin:0;color:var(--muted);font-size:13px}
.continue-card .btn{margin-left:auto}

/* ===== stat strip ===== */
.stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:30px}
.stat-box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.stat-box strong{display:block;font:700 26px/1 "Rajdhani",sans-serif;color:var(--ink)}
.stat-box span{font-size:12px;color:var(--muted);font-weight:600}

/* ===== gallery ===== */
.gallery-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:8px 0 16px;flex-wrap:wrap}
.gallery-head h2{margin:0;font-size:24px}
.search-wrap{position:relative;width:260px}
.search-wrap .msy{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:18px}
.search-wrap input{width:100%;padding:10px 12px 10px 36px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:13.5px}
.search-wrap input:focus{outline:2px solid #b9d9ff}
.chip-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px}
.chip{padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:var(--muted)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.track-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:14px}
.track-card{position:relative;display:flex;flex-direction:column;gap:10px;background:#fff;border:1px solid var(--line);
  border-radius:18px;padding:18px;box-shadow:0 8px 22px rgba(5,43,81,.04);transition:transform .18s,box-shadow .18s}
.track-card:hover{transform:translateY(-3px);box-shadow:0 16px 30px rgba(5,43,81,.1)}
.tc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.tc-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:0 0 auto}
.tc-icon .msy{font-size:21px}
.tc-eyebrow{font:700 10px/1 "Rajdhani",sans-serif;letter-spacing:.1em;color:var(--muted);margin:2px 0 4px;display:block}
.tc-title{font-size:16.5px;font-weight:700;line-height:1.25;margin:0 0 4px;color:var(--ink)}
.tc-desc{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0;flex:1}
.tc-meta{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--muted);font-weight:600}
.tc-meta span{display:flex;align-items:center;gap:3px}
.tc-meta .msy{font-size:14px}
.tc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
.tc-reward{font-size:11px;font-weight:700;color:var(--navy)}
.ring{position:relative;width:38px;height:38px}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:#e6eef4}
.ring .fg{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring .rlabel{position:absolute;inset:0;display:grid;place-items:center;font-size:9.5px;font-weight:800;color:var(--ink)}
.badge-earned .ring .fg{stroke:var(--amber)}

/* color ramps for track icon tiles, by track.color */
.ct-cyan{background:linear-gradient(135deg,#7df2ff,#00bceb);color:#032d53}
.ct-blue{background:linear-gradient(135deg,#9fc4ff,#005cff);color:#00193c}
.ct-violet{background:linear-gradient(135deg,#e3b9ff,#ba4cf6);color:#320a54}
.ct-pink{background:linear-gradient(135deg,#ffc2df,#e64ca6);color:#4d0c2c}
.ct-green{background:linear-gradient(135deg,#a9f2d1,#12b888);color:#03301f}
.ct-amber{background:linear-gradient(135deg,#ffe2a1,#f4b93e);color:#3f2500}

/* ===== track map (path page) ===== */
.track-head{display:grid;grid-template-columns:1.3fr .9fr;gap:20px;margin-bottom:26px;align-items:stretch}
.track-head-main h1{font-size:clamp(26px,3.4vw,36px);margin:8px 0 10px;line-height:1.08}
.track-head-main p{color:var(--muted);font-size:14.5px;line-height:1.6;max-width:560px}
.stake-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.stake-card small{font:700 10.5px/1 "Rajdhani",sans-serif;letter-spacing:.1em;color:var(--muted)}
.stake-row{display:flex;gap:10px;margin-top:12px;align-items:flex-start}
.stake-row .msy{color:var(--blue);margin-top:1px;flex:0 0 auto}
.stake-row p{margin:0;font-size:13px;line-height:1.55;color:var(--ink)}

.map-wrap{position:relative;padding:10px 0 30px}
.map-track{position:relative;max-width:720px;margin:0 auto}
.map-track::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:4px;margin-left:-2px;
  background:repeating-linear-gradient(180deg,#d7e3ee 0 10px,transparent 10px 20px);border-radius:99px;z-index:0}
.map-fill{position:absolute;top:0;left:50%;width:4px;margin-left:-2px;border-radius:99px;z-index:0;
  background:linear-gradient(180deg,var(--blue),var(--cyan));transition:height .6s ease}
.map-node-row{position:relative;z-index:1;display:flex;margin:0 0 8px;min-height:112px}
.map-node-row.L{justify-content:flex-start}
.map-node-row.R{justify-content:flex-end}
.map-node{width:calc(50% - 34px);display:flex;align-items:center;gap:14px}
.map-node-row.R .map-node{flex-direction:row-reverse;text-align:right}
.node-dot{position:relative;width:52px;height:52px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:#fff;border:3px solid #dfe9f1;color:#9aabbd;font:700 17px "Rajdhani",sans-serif;box-shadow:0 4px 12px rgba(5,43,81,.06)}
.node-dot .msy{font-size:21px}
.map-node.done .node-dot{background:linear-gradient(145deg,#6bf0c6,#12b888);border-color:#0fb888;color:#003b2d}
.map-node.current .node-dot{border-color:var(--blue);color:var(--blue);animation:nodepulse 1.8s ease-in-out infinite}
.map-node.locked{opacity:.55}
.map-node.locked .node-dot{color:#b7c3cf}
@keyframes nodepulse{0%,100%{box-shadow:0 0 0 0 rgba(0,92,255,.28)}50%{box-shadow:0 0 0 9px rgba(0,92,255,0)}}
.node-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px 15px;flex:1;min-width:0}
.map-node.locked .node-card{background:#f8fbfd}
.node-card strong{display:block;font-size:14px;line-height:1.3;color:var(--ink);margin-bottom:2px}
.node-card small{font-size:11.5px;color:var(--muted);font-weight:600}
.map-node:not(.locked) .node-card{cursor:pointer}
.map-node:not(.locked) .node-card:hover{border-color:var(--blue)}

.path-complete-banner{max-width:720px;margin:20px auto 0;text-align:center;padding:26px;border-radius:20px;color:#fff;
  background:radial-gradient(circle at 50% 0,rgba(0,207,255,.3),transparent 45%),linear-gradient(140deg,#020b18,#083a5a 60%,#075845)}
.path-complete-banner .msy{font-size:34px;color:#ffd76b}
.path-complete-banner h3{margin:8px 0 4px;font-size:24px}
.path-complete-banner p{margin:0;color:#b9d9e8;font-size:13.5px}

/* ===== agent build board (flagship only) ===== */
.abb{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:20px;padding:20px 22px 18px;background:#fff;margin-bottom:8px}
.abb::before{content:"";position:absolute;inset:auto -70px -90px auto;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(0,188,255,.1),transparent 70%)}
.abb-head{position:relative;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.abb-title{display:flex;align-items:center;gap:13px}
.abb-avatar{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#7df2ff,#00bceb);color:#032d53;flex:0 0 auto}
.abb-title small{font:700 10px/1.2 "Rajdhani",sans-serif;letter-spacing:.1em;color:#0070ca}
.abb-title h2{margin:3px 0 2px;font-size:22px;color:#092a45}
.abb-title p{margin:0;font-size:12.5px;color:#698093}
.abb-pct{text-align:right;line-height:1;color:#092a45}
.abb-pct strong{font:700 26px/1 "Rajdhani",sans-serif}
.abb-chain{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:20px}
.abb-rail{position:absolute;top:19px;left:7.14%;right:7.14%;height:3px;border-radius:99px;background:#dfe9f1;z-index:0}
.abb-rail>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .7s cubic-bezier(.2,.8,.25,1)}
.abb-node{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.abb-icon{position:relative;display:grid;width:38px;height:38px;place-items:center;border-radius:12px;border:1px solid #d7e3ee;color:#9aabbd;background:#f3f8fc;transition:all .35s}
.abb-icon .msy{font-size:17px}
.abb-node small{color:#8296a9;font:700 10px/1.2 "Rajdhani",sans-serif}
.abb-node.done .abb-icon{border-color:transparent;color:#003b2d;background:linear-gradient(145deg,#6bf0c6,#12b888);box-shadow:0 5px 12px rgba(18,184,136,.28)}
.abb-node.done small{color:#0c7a56}
.abb-node.next .abb-icon{border-color:rgba(0,92,255,.35);color:var(--blue);background:#eaf2ff;animation:nodepulse 1.8s ease-in-out infinite}
.abb-node.next small{color:var(--blue)}
.abb-node.justdone .abb-icon{animation:pop .55s cubic-bezier(.3,1.4,.4,1) both}
.abb-spark{position:absolute;inset:-9px;display:grid;place-items:center;color:#ffca4b;animation:spark 1.1s ease-out both}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes spark{0%{opacity:0;transform:scale(.5)}35%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1.5)}}
.abb-summary{display:flex;align-items:center;gap:7px;margin:16px 0 0;padding-top:12px;border-top:1px dashed #dfe9f1;color:#45607a;font-size:12.5px}
.abb-summary strong{color:#092a45}

/* ===== mission workspace ===== */
.mission-topbar{position:sticky;top:64px;z-index:20;background:rgba(243,248,252,.92);backdrop-filter:blur(8px);
  padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:22px}
.mission-topbar .inner{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:14px}
.mission-topbar strong{font-size:12.5px;white-space:nowrap}
.bar-track{flex:1;height:6px;border-radius:99px;background:#e2ecf3;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:99px;transition:width .4s}
.mission-body{max-width:820px;margin:0 auto}
.stake-panel{display:flex;gap:12px;background:#fff2e0;border:1px solid #ffdca6;border-radius:16px;padding:16px 18px;margin-bottom:18px}
.stake-panel .msy{color:#c9791b;flex:0 0 auto}
.stake-panel small{font:700 10.5px/1 "Rajdhani",sans-serif;letter-spacing:.1em;color:#a8630f}
.stake-panel p{margin:6px 0 0;font-size:13.5px;line-height:1.55;color:#5a3c0e}
.stake-panel .trythis{margin-top:10px;padding-top:10px;border-top:1px solid #ffe3b5;font-size:13px;color:#5a3c0e}
.mission-title{font-size:clamp(24px,3vw,32px);margin:4px 0 10px;line-height:1.12}
.mission-obj{color:var(--muted);font-size:14.5px;line-height:1.6;max-width:640px;margin:0 0 22px}
.before-box{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.before-box span{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--navy);
  background:#eaf2ff;border:1px solid #cfe1ff;border-radius:99px;padding:6px 12px}
.before-box span .msy{font-size:14px}
.section-h{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.section-h .msy{color:var(--blue)}
.section-h h3{margin:0;font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink)}
.action-list{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.action-row{display:flex;gap:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px 17px;position:relative;overflow:hidden}
.action-row::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:linear-gradient(180deg,var(--blue),var(--cyan))}
.action-num{width:26px;height:26px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;font:700 12px "Rajdhani",sans-serif;
  background:linear-gradient(145deg,#7df2ff,#b5f7ff);color:#00162d}
.action-row h4{margin:0 0 4px;font-size:14.5px}
.action-row p{margin:0;font-size:13.2px;color:var(--muted);line-height:1.55}
.action-note{margin-top:8px;padding:9px 11px;border-radius:10px;background:#fff7e0;color:#8a5f06;font-size:12px;display:flex;gap:6px}
.action-res{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:8px 13px;border-radius:99px;
  background:#eaf2ff;color:var(--blue);font-size:12.5px;font-weight:700}
.action-res:hover{background:#dbeaff}
.mistake-box{display:flex;gap:12px;background:#fdeceb;border:1px solid #f4c2be;border-radius:16px;padding:15px 17px;margin-bottom:22px}
.mistake-box .msy{color:#c23b2e;flex:0 0 auto}
.mistake-box strong{display:block;font-size:13px;margin-bottom:3px}
.mistake-box p{margin:0;font-size:12.8px;color:#7a2c24;line-height:1.5}
.success-box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:18px}
.success-item{display:flex;align-items:center;gap:11px;padding:9px 0;font-size:13.5px;border-bottom:1px dashed #eaf0f5}
.success-item:last-of-type{border-bottom:none}
.success-item .box{width:20px;height:20px;border-radius:6px;border:2px solid #c7d5e0;display:grid;place-items:center;flex:0 0 auto}
.success-item.checked .box{background:var(--green);border-color:var(--green);color:#fff}
.success-item.checked span.txt{color:var(--ink);font-weight:600}
.complete-btn-wrap{margin-top:14px;text-align:right}
.complete-btn{padding:13px 24px;border-radius:99px;font-weight:700;font-size:14px;background:linear-gradient(135deg,#0a6dfb,#00d2ff);color:#00182f}
.complete-btn:disabled{background:#e2ecf3;color:#9fb0bf;cursor:not-allowed}

.capability-card{display:flex;align-items:center;gap:16px;border-radius:18px;padding:24px 26px;color:#fff;margin-bottom:22px;
  background:radial-gradient(circle at 90% 0,rgba(76,255,204,.24),transparent 32%),linear-gradient(120deg,#062e2a,#075845);
  animation:cardin .5s cubic-bezier(.25,.9,.3,1.15) both}
@keyframes cardin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.capability-card .ic{width:50px;height:50px;border-radius:16px;background:#58e6b9;color:#003b2d;display:grid;place-items:center;flex:0 0 auto;
  animation:iconpulse 1.7s ease-out .1s 1}
@keyframes iconpulse{0%{box-shadow:0 0 0 0 rgba(88,230,185,.55)}70%{box-shadow:0 0 0 18px rgba(88,230,185,0)}100%{box-shadow:0 0 0 0 rgba(88,230,185,0)}}
.capability-card small{font:700 10.5px/1 "Rajdhani",sans-serif;letter-spacing:.1em;color:#68f2c3}
.capability-card h3{margin:5px 0 0;font-size:20px}
.capability-card .btn{margin-left:auto;flex:0 0 auto}

.troubleshoot-block{background:#fff;border:1px solid var(--line);border-radius:16px;padding:4px 6px;margin-bottom:30px}
.ts-item summary{list-style:none;cursor:pointer;padding:12px 14px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.ts-item summary::-webkit-details-marker{display:none}
.ts-item summary .msy{color:var(--amber)}
.ts-item p{margin:0 12px 12px 34px;font-size:13px;color:var(--muted);line-height:1.55}

/* ===== quiz ===== */
.quiz-wrap{max-width:660px;margin:0 auto}
.quiz-progress{display:flex;gap:5px;margin-bottom:22px}
.quiz-progress span{flex:1;height:5px;border-radius:99px;background:#e2ecf3}
.quiz-progress span.done{background:var(--green)}
.quiz-progress span.cur{background:var(--blue)}
.quiz-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px}
.quiz-q{font-size:19px;margin:0 0 18px;line-height:1.4}
.quiz-opt{display:block;width:100%;text-align:left;padding:13px 16px;border-radius:13px;border:1.5px solid var(--line);
  margin-bottom:9px;font-size:14px;background:#fff;transition:all .15s}
.quiz-opt:hover{border-color:var(--blue)}
.quiz-opt.correct{background:#e9fbf3;border-color:var(--green);color:#0c6b4c;font-weight:700}
.quiz-opt.wrong{background:#fdeceb;border-color:#e0503f;color:#a3291b;font-weight:700}
.quiz-opt:disabled{cursor:default}
.quiz-explain{margin-top:16px;padding:14px 16px;border-radius:13px;background:#f3f8fc;font-size:13px;line-height:1.6;color:#3a5266}
.quiz-explain a{color:var(--blue);font-weight:700}
.quiz-foot{display:flex;justify-content:flex-end;margin-top:18px}
.quiz-result{text-align:center;padding:40px 20px}
.quiz-result .msy{font-size:54px;color:var(--amber)}
.quiz-result h2{font-size:32px;margin:10px 0}

/* ===== troubleshooting ===== */
.ts-search{position:relative;margin-bottom:16px}
.ts-search .msy{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.ts-search input{width:100%;padding:13px 16px 13px 42px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:14.5px}
.ts-count{font-size:12.5px;color:var(--muted);font-weight:600;margin:0 0 14px}
.ts-card{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.ts-card summary{list-style:none;cursor:pointer;padding:15px 18px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.ts-card summary::-webkit-details-marker{display:none}
.ts-card .lft{display:flex;align-items:center;gap:10px;min-width:0}
.ts-card .sec{font-size:10px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:99px;background:#eaf2ff;color:var(--blue);flex:0 0 auto}
.ts-card strong{font-size:14px}
.ts-card .msy.chev{transition:transform .2s;color:var(--muted)}
.ts-card[open] .msy.chev{transform:rotate(90deg)}
.ts-body{padding:0 18px 18px}
.ts-row{margin-top:10px}

/* ===== badges ===== */
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.badge-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center}

.badge-card.earned .medal{background:linear-gradient(145deg,#fff0a5,#f4b93e);color:#3f2500;box-shadow:0 10px 20px rgba(244,185,62,.35)}
.badge-card:not(.earned) .medal{background:#eef2f5;color:#b7c3cf}
.badge-card strong{display:block;font-size:14px;margin-bottom:3px}
.badge-card span{font-size:11.5px;color:var(--muted)}

/* ===== toast / confetti ===== */
#toast-wrap{position:fixed;top:78px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;align-items:center;gap:10px;background:#0d1b30;color:#fff;padding:12px 16px;border-radius:14px;
  font-size:13px;font-weight:700;box-shadow:0 14px 30px rgba(0,0,0,.25);animation:toastin .3s ease both}
.toast .msy{color:#ffd76b}
@keyframes toastin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
#confetti-canvas{position:fixed;inset:0;z-index:150;pointer-events:none}

@media (max-width:860px){
  .hero-grid,.track-head{grid-template-columns:1fr}
  #topnav{display:none}
  #burger{display:grid}

  .hp-chain,.abb-chain{grid-template-columns:repeat(4,1fr);row-gap:14px}

/* ===== Academy guide ===== */
.guide-panel{display:grid;grid-template-columns:minmax(0,.8fr) minmax(360px,1.2fr);gap:24px;align-items:center;margin:0 0 28px;padding:24px 26px;border:1px solid #c9dbee;border-radius:20px;background:linear-gradient(135deg,#fff,#edf6ff);box-shadow:0 12px 30px rgba(5,43,81,.06)}
.guide-copy{display:flex;align-items:flex-start;gap:15px}.guide-orb{width:48px;height:48px;flex:0 0 auto;display:grid;place-items:center;border-radius:16px;color:#002f55;background:linear-gradient(145deg,#80f2ff,#00bceb);box-shadow:0 10px 22px rgba(0,188,235,.22)}
.guide-copy small{font:700 10.5px/1 "Rajdhani",sans-serif;letter-spacing:.12em;color:var(--blue)}.guide-copy h2{margin:6px 0 5px;font-size:22px}.guide-copy p{margin:0;max-width:500px;color:var(--muted);font-size:13.5px;line-height:1.55}

.guide-form button{display:inline-flex;align-items:center;gap:6px;padding:0 18px;border-radius:13px;color:#fff;background:#0d1b30;font-size:13.5px;font-weight:700}.guide-form button:hover{background:#142c4f}
.guide-prompts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.guide-prompts button{padding:6px 9px;border:1px solid #d2dfeb;border-radius:99px;color:#4f6479;background:rgba(255,255,255,.8);font-size:11px;font-weight:600}.guide-prompts button:hover{color:var(--blue);border-color:#9fc4ff}
.guide-result{display:none;margin-top:11px;padding:12px 14px;border:1px solid #bad9fb;border-radius:13px;background:#fff}.guide-result.show{display:flex;align-items:center;gap:12px}.guide-result .msy{color:var(--blue)}.guide-result div{min-width:0;flex:1}.guide-result small{display:block;font:700 10px/1 "Rajdhani",sans-serif;letter-spacing:.1em;color:var(--blue)}.guide-result strong{display:block;margin-top:4px;font-size:14px}.guide-result span{display:block;color:var(--muted);font-size:12px}.guide-result button{padding:8px 12px;border-radius:99px;color:#fff;background:var(--blue);font-size:12px;font-weight:700}


/* ===== V20 smart community experience ===== */
.role-carousel-shell{position:relative;margin:0 0 24px}.role-carousel{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,26%);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px;scrollbar-width:none}.role-carousel::-webkit-scrollbar{display:none}.role-card{scroll-snap-align:start;min-height:128px;text-align:left;border:1px solid var(--line);border-radius:18px;background:#fff;padding:17px;cursor:pointer;transition:.2s;box-shadow:0 8px 22px rgba(5,43,81,.04)}.role-card:hover{transform:translateY(-2px);box-shadow:0 15px 28px rgba(5,43,81,.1)}.role-card.on{border-color:#78aef8;box-shadow:0 0 0 2px rgba(0,92,255,.12),0 15px 30px rgba(0,92,255,.1)}.role-card .role-icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#edf6ff;color:var(--blue);margin-bottom:12px}.role-card strong{display:block;font-size:14px;margin-bottom:4px}.role-card span{display:block;color:var(--muted);font-size:11.5px;line-height:1.45}.role-card small{display:block;margin-top:9px;color:var(--blue);font:700 10px/1 Rajdhani,sans-serif;letter-spacing:.08em}.role-arrows{display:flex;gap:7px}.role-arrow{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--navy)}

.proof-box{margin-top:18px;padding:18px;border:1px solid #b8d9ff;border-radius:16px;background:linear-gradient(145deg,#f8fcff,#eef7ff)}.proof-head{display:flex;gap:11px;align-items:flex-start}.proof-head>.msy{color:var(--blue);font-size:22px}.proof-head small{display:block;font:700 10px/1 Rajdhani,sans-serif;letter-spacing:.1em;color:var(--blue);margin-bottom:4px}.proof-head strong{font-size:14px}.proof-head p{margin:5px 0 0;color:var(--muted);font-size:12.5px;line-height:1.5}.proof-btn{width:100%;margin-top:14px;padding:12px 16px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}.proof-btn:disabled{background:#9fb5c9}.proof-btn.done{background:var(--green)}.proof-hints{margin:12px 0 0;padding:0;list-style:none}.proof-hints li{display:flex;gap:7px;margin:5px 0;color:#607488;font-size:11.5px}.proof-hints .msy{font-size:14px;color:var(--green)}

/* ===== Focused mission additions ===== */
.mission-coachbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:-4px 0 18px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff}.mission-coachbar>span{display:flex;align-items:center;gap:8px;color:#566b82;font-size:12.5px;font-weight:600}.mission-coachbar>span .msy{color:var(--blue)}.coach-actions{display:flex;gap:7px}.coach-actions button{display:inline-flex;align-items:center;gap:6px;padding:8px 11px;border:1px solid #cad9e8;border-radius:99px;background:#f8fbfe;color:#294965;font-size:12px;font-weight:700}.coach-actions button:hover{border-color:#8fbbf1;color:var(--blue)}
.click-path{display:flex;align-items:flex-start;gap:12px;margin:0 0 16px;padding:13px 15px;border-radius:14px;color:#26445f;background:#eaf3fd}.click-path>strong{flex:0 0 auto;font:700 10.5px/1.5 "Rajdhani",sans-serif;letter-spacing:.1em;color:var(--blue)}.click-path>div{display:flex;flex-wrap:wrap;gap:6px 3px;align-items:center;font-size:12.5px;font-weight:650}.click-path .msy{font-size:14px;color:#8ca5bc}
.mission-prep{margin:0 0 20px;border:1px solid var(--line);border-radius:14px;background:#fff}.mission-prep summary{display:flex;align-items:center;gap:9px;padding:12px 14px;list-style:none;cursor:pointer;font-size:13px;font-weight:700}.mission-prep summary::-webkit-details-marker{display:none}.mission-prep summary .msy{color:var(--blue)}.mission-prep-body{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 14px 14px}.prep-column{padding:12px;border-radius:12px;background:#f5f9fc}.prep-column.warn{background:#fff8e9}.prep-column strong{display:block;margin-bottom:8px;font-size:12px}.prep-column span{display:flex;align-items:flex-start;gap:6px;margin-top:6px;color:#4d6175;font-size:12px;line-height:1.45}.prep-column span .msy{margin-top:2px;font-size:13px;color:var(--green)}.prep-column.warn span .msy{color:#d39117}
.visual-help{margin:0 0 22px;border:1px solid #cbdceb;border-radius:16px;background:#fff}.visual-help>summary{display:flex;align-items:center;gap:10px;padding:14px 16px;list-style:none;cursor:pointer}.visual-help>summary::-webkit-details-marker{display:none}.visual-help>summary .msy{color:var(--blue)}.visual-help>summary span{display:flex;flex-direction:column}.visual-help>summary strong{font-size:13.5px}.visual-help>summary small{margin-top:2px;color:var(--muted);font-size:11.5px}.visual-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 16px 16px}.visual-grid figure{margin:0;overflow:hidden;border:1px solid var(--line);border-radius:13px;background:#f5f8fb}.visual-grid img{display:block;width:100%;max-height:340px;object-fit:contain;background:#fff}.visual-grid figcaption{padding:10px 12px;color:#53687c;font-size:11.5px;line-height:1.45}.official-link{display:inline-flex;align-items:center;gap:6px;margin:0 0 22px;padding:8px 11px;border-radius:99px;color:var(--blue);background:#eaf2ff;font-size:12px;font-weight:700}.official-link:hover{background:#dceaff}

/* Keep the path map as the only progress system on a path page. */
.abb{padding:16px 18px}.abb-pct,.abb-chain{display:none}.abb-summary{margin:12px 0 0}.abb-title h2{font-size:20px}

/* ===== Narrated mission walkthrough ===== */
.walkthrough{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(2,9,22,.78);backdrop-filter:blur(8px)}.walkthrough.open{display:flex}.walkthrough-card{width:min(900px,100%);max-height:90vh;overflow:auto;border:1px solid rgba(255,255,255,.13);border-radius:24px;color:#fff;background:linear-gradient(145deg,#07152d,#0a2a51);box-shadow:0 30px 80px rgba(0,0,0,.42)}
.walkthrough-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.1)}.walkthrough-head small{display:block;font:700 10.5px/1 "Rajdhani",sans-serif;letter-spacing:.11em;color:#61dfff}.walkthrough-head strong{display:block;margin-top:5px;font-size:16px}.walkthrough-close{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:#fff;background:rgba(255,255,255,.08)}
.walkthrough-stage{min-height:440px;display:grid;place-items:center;padding:28px}.walkthrough-slide{width:100%;text-align:center}.walkthrough-slide img{display:block;width:100%;max-height:440px;object-fit:contain;border-radius:16px;background:#fff}.walkthrough-slide .slide-icon{width:58px;height:58px;display:grid;place-items:center;margin:0 auto 17px;border-radius:18px;color:#002e4c;background:linear-gradient(145deg,#85f3ff,#00bceb)}.walkthrough-slide h2{max-width:660px;margin:0 auto 10px;font-size:clamp(25px,4vw,40px)}.walkthrough-slide p{max-width:680px;margin:0 auto;color:#bed0e4;font-size:15px;line-height:1.65}.walkthrough-slide figcaption{margin-top:12px;color:#a7c1d8;font-size:12.5px}.walkthrough-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-top:1px solid rgba(255,255,255,.1)}.walkthrough-dots{display:flex;gap:5px}.walkthrough-dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.18)}.walkthrough-dots span.on{background:#3be0ff}.walkthrough-nav{display:flex;gap:7px}.walkthrough-nav button{display:inline-flex;align-items:center;gap:4px;padding:8px 12px;border-radius:99px;color:#fff;background:rgba(255,255,255,.08);font-size:12px;font-weight:700}.walkthrough-nav button:hover{background:rgba(255,255,255,.15)}

button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid rgba(0,188,255,.48);outline-offset:3px}
@media (max-width:860px){.guide-panel{grid-template-columns:1fr}.guide-form{flex-wrap:wrap}.guide-form button{min-height:44px}.mission-coachbar{align-items:flex-start;flex-direction:column}.visual-grid{grid-template-columns:1fr}.mission-prep-body{grid-template-columns:1fr}.walkthrough-stage{min-height:350px;padding:18px}}
@media (max-width:560px){.guide-panel{padding:19px}.guide-form input,.guide-form button{width:100%}.mission-topbar strong{font-size:11px}.pill-stat.streak{display:none}.coach-actions{width:100%}.coach-actions button{flex:1;justify-content:center}.click-path{flex-direction:column}.walkthrough{padding:10px}.walkthrough-card{border-radius:18px}.walkthrough-stage{min-height:330px}}

/* ===== v19 home intelligence — exact reference shell, less chrome ===== */

instruction":"Tell the agent to use short spoken answers, ask one question at a time, never invent clinic facts or medical advice, and offer a callback when it cannot safely help.","note":"Do not paste the clinic hours into the instructions. The next Mission deliberately shows why trusted knowledge belongs in a document."},{"title":"Select a model and save","instruction":"Choose an available model, create the agent, then reopen it from the Agents list. Do not add voice, tools, documents, or telephony yet."}],"success":["Bright Smile Receptionist appears in the Agents list","The welcome message and four operating rules are saved","The agent has no document, tool, phone number, or route yet"],"troubleshooting":[{"problem":"The agent does not appear after Save","fix":"Confirm Current account, refresh AI Agents → Agents, and save again before changing any other setting."},{"problem":"You are unsure whether to use a Flow","fix":"Stay with an Agent for this path. The conversation order may vary; only the safety boundaries are fixed."}],"commonMistake":"Building the production design on day one. This first Mission creates only the object every later Mission will improve.","skipForNow":["Documents","Tools","Post-call analysis","Speech and Telephony","Phone numbers","Routing","Transfers"],"opening":{"label":"THE STAKE","problem":"Bright Smile misses calls while staff are helping patients. Today, a caller asking a simple question may wait, hang up, or receive no answer at all."},"capabilityGained":"A saved Bright Smile Receptionist with one clear job and safe first-run rules.","docUrl":"https://techdocs.audiocodes.com/livehub/#AI-Agents/Add%20an%20AI%20Agent.htm?TocPath=AI%2520Agents%257CAgents%257C_____1"},{"id":"bright-smile-ground","title":"Stop it guessing about clinic hours","objective":"Let the agent fail once, then ground the same agent with the clinic FAQ and prove the answer changed.","duration":"9 min","path":["AI Agents","Documents","Add document","Agents","Bright Smile Receptionist"],"requires":["bright-smile-create"],"before":["Bright Smile Receptionist is saved","The Academy sample FAQ is downloaded","The exact before-and-after question: What time are you open on Friday?"],"actions":[{"title":"Watch the ungrounded answer first","instruction":"Open the agent's chat test and ask: “What time are you open on Friday?” Copy the answer. A confident guess is a failure; “I don't know” is safer, but still not useful."},{"title":"Download one focused source","instruction":"Download the fictional Bright Smile FAQ supplied with this Academy. Read it once so you know the exact Friday and weekend hours before the agent sees it.","resource":{"label":"Download the Bright Smile FAQ","href":"data:text/plain;charset=utf-8,BRIGHT%20SMILE%20DENTAL%20CLINIC%20%E2%80%94%20ACADEMY%20SAMPLE%20FAQ%0A%0AThis%20is%20fictional%20training%20content%20for%20the%20Live%20Hub%20Academy%20exercise.%0AIt%20contains%20no%20real%20patient%20or%20business%20data.%0A%0AOPENING%20HOURS%0A-%20Monday%20to%20Thursday%3A%208%3A00%20AM%E2%80%935%3A00%20PM%0A-%20Friday%3A%208%3A00%20AM%E2%80%932%3A00%20PM%0A-%20Saturday%20and%20Sunday%3A%20Closed%0A%0AAPPOINTMENT%20REQUESTS%0A-%20The%20AI%20receptionist%20may%20explain%20available%20appointment%20times%20returned%20by%20the%20approved%20availability%20tool.%0A-%20The%20AI%20receptionist%20must%20not%20claim%20an%20appointment%20is%20booked%20unless%20a%20booking%20system%20returns%20an%20explicit%20confirmation.%0A-%20When%20a%20caller%20chooses%20an%20available%20time%20during%20this%20exercise%2C%20say%20that%20a%20staff%20member%20will%20call%20back%20to%20confirm%20it.%0A%0AURGENT%20OR%20MEDICAL%20QUESTIONS%0A-%20The%20AI%20receptionist%20must%20not%20diagnose%20symptoms%20or%20give%20medical%20advice.%0A-%20For%20urgent%20pain%2C%20swelling%2C%20bleeding%2C%20or%20injury%2C%20collect%20only%20the%20caller's%20name%20and%20callback%20number%20when%20permitted%2C%20then%20say%20that%20a%20clinic%20team%20member%20will%20call%20back.%0A-%20If%20the%20situation%20may%20be%20an%20emergency%2C%20advise%20the%20caller%20to%20contact%20the%20appropriate%20local%20emergency%20service.%0A%0AVOICE%20STYLE%0A-%20Use%20short%20sentences.%0A-%20Ask%20one%20question%20at%20a%20time.%0A-%20If%20a%20clinic%20fact%20is%20not%20in%20this%20FAQ%2C%20say%20you%20do%20not%20have%20that%20information%20and%20offer%20a%20staff%20callback.%0A","download":true}},{"title":"Create the document","instruction":"Open AI Agents → Documents → Add document, upload the FAQ, and wait until processing is complete. Use a name you will recognise: Bright Smile FAQ."},{"title":"Attach it to the same agent","instruction":"Edit Bright Smile Receptionist and attach Bright Smile FAQ in its knowledge configuration. Add one rule: answer clinic facts only from this source; if the answer is absent, offer a callback instead of guessing."},{"title":"Repeat the exact question","instruction":"Ask “What time are you open on Friday?” again. Then ask “Are you open on Sunday?” and “Can you diagnose my tooth pain?” Compare the results with the FAQ and the safety rule."}],"success":["Friday hours match the sample FAQ exactly","The agent says the clinic is closed on Sunday","The agent does not diagnose pain and offers the defined callback path"],"troubleshooting":[{"problem":"The old answer does not change","fix":"Confirm document processing completed, the FAQ is attached to Bright Smile Receptionist, and the instructions tell this agent when to use it."},{"problem":"The agent invents a medical answer","fix":"Make the medical boundary explicit, save, and repeat the exact same question. Do not try to solve this with more documents."}],"commonMistake":"Uploading a large document library before one small FAQ works with three repeatable questions.","skipForNow":["Website crawling","Multiple collections","Tool calls","Voice","Phone numbers","Routing"],"opening":{"label":"SEE THE GAP FIRST","problem":"The new agent knows its role, but it does not know Bright Smile's actual hours. If it guesses, callers receive confident misinformation.","tryThis":"Ask: “What time are you open on Friday?” before attaching any document.","expectedGap":"You should see either a guess or an unhelpful refusal. Save that answer—the Mission succeeds only when the same question produces a grounded result."},"capabilityGained":"Bright Smile Receptionist now answers clinic hours from one trusted FAQ and refuses unsafe medical advice.","docUrl":"https://techdocs.audiocodes.com/livehub/#AI-Agents/Add%20an%20AI%20Agent.htm?TocPath=AI%2520Agents%257CAgents%257C_____1"},{"id":"bright-smile-availability","title":"Let it check an appointment slot","objective":"Add one read-only availability tool to the same agent and prove the tool result appears in the answer and logs.","duration":"11 min","path":["AI Agents","Tools","Add tool","Test","Agents","Bright Smile Receptionist"],"requires":["bright-smile-ground"],"before":["The grounded Friday-hours test passes","The public Academy mock endpoint opens and returns fictional slots","The test request: Do you have a hygiene appointment on Tuesday morning?"],"actions":[{"title":"Expose the missing live data","instruction":"Ask the agent: “Do you have a hygiene appointment on Tuesday morning?” The FAQ cannot know changing availability, so the agent should decline or offer a callback—not invent a time."},{"title":"Open the read-only mock endpoint","instruction":"Use the Academy endpoint for this exercise. It contains fictional appointment slots and performs no booking or write action.","resource":{"label":"Open the mock availability data","href":"https://tyzworks200.github.io/Live-Hub-Academy/bright-smile-availability.json"}},{"title":"Create one focused lookup tool","instruction":"In AI Agents → Tools → Add tool, create Bright Smile Availability. Configure a read-only GET request to https://tyzworks200.github.io/Live-Hub-Academy/bright-smile-availability.json. Describe it as a lookup used only when a caller asks for available appointment times."},{"title":"Test the tool before attaching it","instruction":"Run the built-in tool test. Confirm the response contains the Tuesday 10:00 hygiene slot. If the request fails, fix the URL or response handling here—not in the agent prompt."},{"title":"Attach it and define its boundary","instruction":"Attach Bright Smile Availability to Bright Smile Receptionist. Tell the agent to read available slots, never claim a booking is confirmed, and offer staff follow-up after the caller chooses a slot."},{"title":"Repeat the exact request and inspect the log","instruction":"Ask for a Tuesday-morning hygiene appointment again. Confirm the answer offers 10:00, then open AI Agents logs and find the tool request, response, and final answer."}],"success":["The built-in tool test returns the fictional availability data","The agent offers Tuesday at 10:00 without claiming it is booked","AI Agents logs show the tool request, response, and final answer"],"troubleshooting":[{"problem":"The tool returns 4xx, 5xx, or no data","fix":"Open the endpoint directly, verify the exact GET URL, then rerun the built-in test before touching the agent."},{"problem":"The agent answers from memory instead of calling the tool","fix":"Make the tool description specific to appointment availability and state when it must be used."}],"commonMistake":"Attaching an untested endpoint, then changing the prompt when the real fault is the request or response.","skipForNow":["Real scheduling systems","Write or booking actions","Production authentication","Multiple tools","Transfers"],"opening":{"label":"SEE THE GAP FIRST","problem":"The FAQ can answer stable facts, but appointment availability changes. Without a tool, the agent must either guess or send every caller to staff.","tryThis":"Ask: “Do you have a hygiene appointment on Tuesday morning?” before adding the tool.","expectedGap":"A safe agent cannot answer from the FAQ. The tool is the missing bridge between conversation and changing business data."},"capabilityGained":"Bright Smile Receptionist can read a safe availability source and offer a real slot without pretending to book it.","docUrl":"https://techdocs.audiocodes.com/livehub/#AI-Agents/Tools.htm?TocPath=AI%2520Agents%257CTools%257C_____0"},{"id":"bright-smile-voice","title":"Rehearse the patient call by voice","objective":"Give the same agent speech, then complete one realistic patient conversation in the browser before telephony is involved.","duration":"10 min","path":["AI Agents","Agents","Bright Smile Receptionist","Speech and Telephony"],"requires":["bright-smile-availability"],"before":["FAQ and availability tests pass in chat","A target language and matching voice are selected","Browser microphone and speaker permission are available"],"actions":[{"title":"Enable the correct audio path","instruction":"Edit Bright Smile Receptionist → Speech and Telephony and enable voice. Use STT and TTS for a standard model; use voice streaming only with a compatible real-time audio model."},{"title":"Choose matching speech settings","instruction":"Select provider, model, language, and a TTS voice for the same locale. Save the agent and confirm the associated Bot connection exists."},{"title":"Open the direct browser call","instruction":"Go to Bot connections, find the connection created for Bright Smile Receptionist, select its phone icon, and choose the correct microphone and speaker."},{"title":"Play Maya's complete scenario","instruction":"Say: “What time are you open on Friday?” Then ask: “Do you have a hygiene appointment Tuesday morning?” Choose the offered slot and ask what happens next."},{"title":"Test one natural interruption","instruction":"Interrupt one long answer. The agent should stop, listen, and continue naturally. Record what it heard and whether the call ended normally."}],"success":["You hear the Bright Smile greeting in the browser call","The Friday answer matches the FAQ and the Tuesday slot comes from the tool","The agent handles one interruption and the call ends normally"],"troubleshooting":[{"problem":"You hear nothing","fix":"Check browser media permission and the selected microphone/speaker before editing Live Hub."},{"problem":"The words are wrong but chat was correct","fix":"Inspect recognized text and the STT locale. This is now a speech problem, not a grounding problem."}],"commonMistake":"Adding a phone number and route before the exact conversation passes in a direct browser call.","skipForNow":["Phone numbers","Routing","Recording","DTMF","Background music","Voice tuning beyond one locale"],"opening":{"label":"THE STAKE","problem":"A correct chat answer is not yet a good phone experience. Speech recognition, voice locale, turn-taking, and silence can break an otherwise good agent."},"capabilityGained":"Bright Smile Receptionist can complete the clinic-hours and availability scenario in a direct browser voice call.","docUrl":"https://techdocs.audiocodes.com/livehub/#AI-Agents/Add%20an%20AI%20Agent.htm?TocPath=AI%2520Agents%257CAgents%257C_____1"},{"id":"bright-smile-outcomes","title":"Make every call leave a useful outcome","objective":"Extract three business results from the conversation so staff can tell what happened without replaying the call.","duration":"8 min","path":["AI Agents","Post Call Analysis","Add new post call analysis"],"requires":["bright-smile-voice"],"before":["The browser voice scenario completed once","Three outcome values: booked, needs_callback, escalated","A definition for each value that staff would understand"],"actions":[{"title":"Create one post-call analysis","instruction":"Open AI Agents → Post Call Analysis → Add new post call analysis. Name it Bright Smile Outcome, choose Extract variables, and leave WebHook URL empty for this first local proof."},{"title":"Define the outcome and summary","instruction":"Add appointment_outcome with three allowed meanings: booked, needs_callback, and escalated. In the extract prompt, also request a compact summary of what the caller wanted, which slot was offered, and the next action. Unknown information must stay empty."},{"title":"Attach it to the same agent","instruction":"Save the analysis. Edit Bright Smile Receptionist, open its Post Call Analysis tab, add Bright Smile Outcome, and update the agent."},{"title":"Repeat Maya's browser call","instruction":"Run the same hours-and-availability conversation. Choose Tuesday at 10:00, but remember the mock tool cannot confirm a booking, so the expected outcome is needs_callback."},{"title":"Inspect the evidence","instruction":"Open AI Agents logs, find the completed call, and compare appointment_outcome and the summary with what was actually said."}],"success":["Bright Smile Outcome is attached to Bright Smile Receptionist","appointment_outcome is needs_callback for the mock availability call","The summary contains the caller's request, offered slot, and next action","No confirmation or patient detail is invented"],"troubleshooting":[{"problem":"The outcome changes between identical calls","fix":"Tighten the field definition and allowed meanings, then repeat the exact conversation before adding more fields."},{"problem":"The summary claims the appointment is booked","fix":"State explicitly that the availability tool is read-only and that only a real booking confirmation may produce booked."}],"commonMistake":"Extracting dozens of fields before proving the three results that drive a real staff action.","skipForNow":["Webhooks","CRM updates","Sentiment","Large extraction schemas","Production patient data"],"opening":{"label":"THE STAKE","problem":"The call can now help a patient, but staff still need to know whether anything was booked, requires a callback, or was escalated."},"capabilityGained":"Bright Smile Receptionist now produces a reliable outcome and summary after a useful voice conversation.","docUrl":"https://techdocs.audiocodes.com/livehub/#AI-Agents/Add%20an%20AI%20Agent.htm?TocPath=AI%2520Agents%257CAgents%257C_____1"},{"id":"bright-smile-number","title":"Request the clinic's public number","objective":"Submit one US or UK phone-number request and wait for provisioning without pretending that purchase is instant.","duration":"7 min + provisioning","path":["Voice channels","Phone numbers","Add new phone number"],"requires":["bright-smile-outcomes"],"before":["United States or United Kingdom selected for this Academy run","The billing owner knows the displayed monthly fee","Required business information and documents are ready","The target Live Hub region matches the Bright Smile agent connection"],"actions":[{"title":"Open the number request","instruction":"Go to Voice channels → Phone numbers → Add new phone number. For this first run, choose only United States or United Kingdom."},{"title":"Choose the number and region","instruction":"Review the monthly fee. For a US number, select state and city when available, then choose the Live Hub region used by the agent connection."},{"title":"Complete the request form","instruction":"Provide every business field and document requested. Submit the form, then record the request status."},{"title":"Pause for real provisioning","instruction":"Return to Phone numbers until the number is provisioned and visible for use. Record its exact E.164 form and region. Do not create a route around a pending number."}],"success":["The request form and required documents were submitted","The number is provisioned and visible in Phone numbers","Its exact E.164 number and region are recorded"],"troubleshooting":[{"problem":"The country you need is not offered","fix":"Stop this Academy run and contact support for that country. Do not substitute a random country just to continue."},{"problem":"The request remains pending","fix":"Resolve missing form information or wait for review. A routing rule cannot make a pending number callable."}],"commonMistake":"Treating Add new phone number as instant self-service. The form, documents, and provisioning delay are part of the real process.","skipForNow":["Countries outside the US and UK","Several numbers","Number patterns","Production capacity","Advanced number formatting"],"opening":{"label":"THE STAKE","problem":"The agent works in a controlled browser test. A real patient still has no public number to call, and number provisioning may require review."},"capabilityGained":"Bright Smile now has one provisioned public number, in the correct region, ready to become the call origin.","docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Purchasing%20Phone%20Numbers.htm"},{"id":"bright-smile-route-proof","title":"Route the number and call it from your phone","objective":"Connect the provisioned number to Bright Smile Receptionist, complete the whole patient story, and prove the result in Calls and AI Agents logs.","duration":"10 min","path":["Routing","Routing Rules","Add new routing rule"],"requires":["bright-smile-number"],"before":["The Bright Smile number is provisioned","The Bright Smile Bot connection passes the browser voice test","The number, Bot connection, and route use the same Live Hub region","A mobile phone is available for the final call"],"actions":[{"title":"Create one exact inbound route","instruction":"Set Type to Call. Select the Bright Smile Live Hub number as Call origin, then select the Bot connection created for Bright Smile Receptionist under Route To."},{"title":"Keep the baseline clean","instruction":"Use the exact called number. Leave recording, translation, Agent Assist, number customization, and broad patterns off until the baseline works. Save the rule."},{"title":"Call as Maya from a real phone","instruction":"Call the provisioned number. Ask Friday hours, ask for a Tuesday-morning hygiene slot, choose 10:00, confirm that staff will call back, then hang up normally."},{"title":"Prove the telephony path","instruction":"Open Calls and find the newest Call ID. Confirm completion status, the selected routing rule, destination, duration, and transcript where enabled."},{"title":"Prove the agent behavior","instruction":"Open AI Agents logs for the same interaction. Confirm the document answer, availability tool call, final response, summary, and appointment_outcome = needs_callback."},{"title":"Say what you built","instruction":"Use the completion statement on the next screen. If any clause is not proven by evidence, reopen that Mission instead of marking this Path complete."}],"success":["A mobile call reaches Bright Smile Receptionist through the intended routing rule","Calls contains the matching Call ID and successful route evidence","AI Agents logs show grounded hours, the tool result, and needs_callback","You can repeat the call and explain every layer using evidence"],"troubleshooting":[{"problem":"The call never appears in Calls","fix":"The failure occurred before Live Hub. Check the dialed number, provisioning state, carrier, and origin."},{"problem":"The call appears but misses the agent","fix":"Check the exact called number, rule order, region, and selected Bot connection."},{"problem":"Telephony works but the answer is wrong","fix":"The route is healthy. Use AI Agents logs to inspect document retrieval, the tool response, and the agent instructions."}],"commonMistake":"Changing routing, speech, and agent behavior together. Calls proves the path; AI Agents logs explains the behavior.","skipForNow":["Recording","Voice translation","Agent Assist","Transfers","Failover","Number customization","Broad wildcard rules"],"opening":{"label":"THE STAKE","problem":"Everything works in isolation. This final Mission proves that a real public call crosses the route, reaches the same agent, and leaves evidence a colleague can investigate."},"capabilityGained":"A real caller can reach Bright Smile Receptionist, receive grounded and tool-backed help, and leave a verifiable call outcome.","docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Defining%20Routing.htm"}],"agent-builder":[{"id":"ground-with-documents","title":"Ground answers with documents","objective":"Give the agent a small, trusted knowledge source and prove it uses the source instead of guessing.","duration":"7 min","path":["AI Agents","Documents","Add document","Agents","Attach document"],"architecture":["Trusted content","Document collection","AI agent","Grounded answer"],"before":["One focused file or approved web page","Two questions answered by the source","One question not answered by it"],"actions":[{"title":"Choose a focused source","instruction":"Start with a small product guide, FAQ, or approved page. Avoid a mixed archive for the first test."},{"title":"Create the document","instruction":"Add the file or configure the supported web crawler, then wait until processing is complete."},{"title":"Attach it to the agent","instruction":"Open the agent and select the new document or collection in its knowledge configuration."},{"title":"Test known answers","instruction":"Ask the two prepared questions and compare the answer with the source."},{"title":"Test the boundary","instruction":"Ask the unsupported question and confirm the agent says it does not know or follows your escalation rule."}],"success":["Both known answers match the source","The unsupported answer is not invented","The agent’s response is concise enough for voice"],"troubleshooting":[{"problem":"The document seems ignored","fix":"Confirm processing completed, the document is attached to this agent, and the prompt tells the agent when to consult it."}],"commonMistake":"Uploading a large mixed library before proving one document with three repeatable questions.","docUrl":"https://techdocs.audiocodes.com/livehub/#AI-Agents/Add%20an%20AI%20Agent.htm?TocPath=AI%2520Agents%257CAgents%257C_____1"},{"id":"add-a-tool","title":"Add and verify one tool","objective":"Let the agent perform one external action and prove the request and response in logs.","duration":"8 min","path":["AI Agents","Tools","Add tool","Test","Agents","Attach tool"],"architecture":["Agent intent","Tool request","External endpoint","Tool response","Agent reply"],"before":["One safe action","Endpoint and authentication details","A known test input and expected output"],"actions":[{"title":"Create one focused tool","instruction":"Define a single job such as look up an order or create a ticket. Keep the description explicit about when to use it."},{"title":"Configure the request","instruction":"Add method, URL, authentication, headers, parameters, and response mapping without exposing secrets in descriptions."},{"title":"Run the built-in test","instruction":"Use known input and confirm the tool returns the expected output before attaching it to an agent."},{"title":"Attach it to the agent","instruction":"Open the agent, add the tool, and tell the agent what information it must collect before calling it."},{"title":"Prove it in logs","instruction":"Run a conversation and inspect the tool request, returned data, elapsed time, and final response in AI Agents logs."}],"success":["The tool test succeeds","The agent calls it only when appropriate","The request contains correct values","The final answer reflects the response"],"troubleshooting":[{"problem":"4xx or 5xx response","fix":"Check request shape, authentication, endpoint behavior, and response mapping before changing the prompt."},{"problem":"Status 700 or timeout","fix":"Inspect endpoint reachability and latency, then simplify the call or increase the supported timeout."}],"commonMistake":"Attaching an untested tool and then blaming the prompt when the endpoint fails.","docUrl":"https://techdocs.audiocodes.com/livehub/#AI-Agents/Tools.htm?TocPath=AI%2520Agents%257CTools%257C_____0"},{"id":"post-call-analysis","title":"Capture post-call outcomes","objective":"Turn each completed conversation into consistent variables, summaries, and workflow-ready evidence.","duration":"7 min","path":["AI Agents","Agents","Edit agent","Post-call analysis"],"architecture":["Conversation","Post-call analysis","Variables + summary","Logs or webhook"],"before":["Two or three business fields to extract","A clear definition of success","A webhook endpoint only if downstream delivery is needed"],"actions":[{"title":"Define the outcome","instruction":"Choose a few useful fields such as intent, resolution, case number, sentiment, or handoff reason."},{"title":"Add extraction rules","instruction":"Describe the expected value and format for each variable so results are consistent."},{"title":"Add a short summary","instruction":"Request a compact wrap-up that states what the caller wanted, what happened, and the next action."},{"title":"Configure delivery if needed","instruction":"Add the supported webhook or downstream step and test it with non-sensitive data."},{"title":"Verify after a call","instruction":"Open AI Agents logs and compare extracted fields with what was actually said."}],"success":["Expected variables are present","The summary is accurate","Missing information stays empty instead of being invented","Webhook delivery succeeds when configured"],"troubleshooting":[{"problem":"Extracted values are inconsistent","fix":"Tighten the field definition and format, then repeat the same conversation. Check the log before changing any integration."}],"commonMistake":"Extracting dozens of fields before proving the two or three that drive a real business action.","docUrl":"https://techdocs.audiocodes.com/livehub/#AI-Agents/Add%20an%20AI%20Agent.htm?TocPath=AI%2520Agents%257CAgents%257C_____1"},{"id":"tests-and-logs","title":"Build a repeatable test suite","objective":"Replace one-off demos with scenarios that reveal regressions after every change.","duration":"7 min","path":["AI Agents","Tests","Create test","Run","Logs"],"architecture":["Fixed scenario","Agent run","Expected checks","Log evidence","Pass or fix"],"before":["A happy path","An unclear request","A refusal or handoff case","One tool or document case if used"],"actions":[{"title":"Create the scenarios","instruction":"Use realistic wording and one explicit expected outcome for each case."},{"title":"Run a baseline","instruction":"Execute the suite before changing the agent and save the result."},{"title":"Inspect every failure","instruction":"Use logs to decide whether the failure came from prompt, model, document retrieval, tool, variable, or test expectation."},{"title":"Change one layer","instruction":"Make one focused change, rerun the same suite, and compare the result with the baseline."},{"title":"Keep production gates","instruction":"Require all critical scenarios to pass before publishing or changing routing."}],"success":["Every critical behavior has a named scenario","Failures point to a layer","The same suite can be rerun after a change"],"troubleshooting":[{"problem":"A test passes but callers still fail","fix":"Add the real caller wording and conditions as a new regression scenario instead of weakening the existing expected result."}],"commonMistake":"Changing the agent until one demo works without preserving the scenario as a regression test.","docUrl":"https://techdocs.audiocodes.com/livehub/#AI-Agents/Add%20an%20AI%20Agent.htm?TocPath=AI%2520Agents%257CAgents%257C_____1"},{"id":"agent-or-flow","title":"Choose an agent or controlled flow","objective":"Use a flexible agent for judgment and a flow when the business path must be explicit.","duration":"8 min","path":["AI Agents","Agents or Flows"],"architecture":["Conversation start","Agent judgment or flow node","Tool / knowledge / transition","Outcome"],"before":["The conversation’s required checkpoints","Which decisions may be flexible","Which steps must never be skipped"],"actions":[{"title":"Choose an agent","instruction":"Use an agent when the job is conversational, the order can vary, and judgment matters more than a fixed sequence."},{"title":"Choose a flow","instruction":"Use a flow when required steps, approvals, data collection, or handoffs must be explicit and auditable."},{"title":"Set global behavior","instruction":"Keep tone, safety, language, and universal rules in the shared or global instructions."},{"title":"Design small nodes","instruction":"Give each flow node one goal and make transition conditions specific. Avoid loops with no exit condition."},{"title":"Test every exit","instruction":"Run the happy path, every branch, a missing-value case, and the handoff or failure path."}],"success":["The chosen structure matches the business constraint","Every flow node has one purpose","Every branch and exit has been tested"],"troubleshooting":[{"problem":"The flow repeats or gets stuck","fix":"Inspect transition conditions, variable updates, and exit paths. Make each condition mutually understandable and give loops a stop condition."}],"commonMistake":"Building a complex flow for a flexible conversation—or relying on a free-form agent where mandatory checkpoints exist.","docUrl":"https://techdocs.audiocodes.com/livehub/#AI-Agents/Add%20an%20AI%20Agent.htm?TocPath=AI%2520Agents%257CAgents%257C_____1"}],"sip-trunk":[{"id":"sip-choose-path","title":"Choose the correct SIP connection type","objective":"Select the matching provider profile or the correct generic connection family before touching technical fields.","duration":"4 min","path":["Voice channels","SIP Connections","Add new SIP connection"],"decision":{"question":"What are you connecting, and is its provider listed?","options":[{"title":"Yes — use the listed provider","chooseWhen":"Your carrier, PBX, or contact-center provider appears by name.","next":"Select its provider profile. Live Hub will show the settings that apply to that integration."},{"title":"No — use Generic SIP Trunk","chooseWhen":"A carrier, PBX, or custom SIP trunk is not listed by name.","next":"Set Provider type to SIP Trunk and Provider to Generic SIP Trunk, then follow the complete SIP path in this mission."},{"title":"No — use another Generic type","chooseWhen":"You are connecting an unlisted contact center or unified communications platform.","next":"Choose Contact Center or UC as the Provider type, then select its Generic provider option. Do not label every SIP connection as a SIP Trunk."}]},"architecture":["Your SIP provider","SIP connection","Routing rule","Live Hub destination"],"before":["Provider or platform name","Live Hub region","Whether calls are inbound, outbound, or both"],"actions":[{"title":"Open SIP Connections","instruction":"From Voice channels, open SIP Connections and select Add new SIP connection."},{"title":"Choose the provider type","instruction":"Use SIP Trunk for a carrier or PBX trunk, Contact Center for a contact-center platform, and UC for a unified communications platform. Do not choose Client Applications unless you are configuring a supported client channel such as WebRTC."},{"title":"Check the Provider list","instruction":"If your provider appears, select it. If it does not, choose the Generic option inside the correct provider type. Generic does not mean limited—it means you supply the standard SIP details yourself."},{"title":"Use a clear name and region","instruction":"Name the connection after the provider and environment, such as Provider-SIP-QA, and select the same region used by the services this trunk will reach."}],"skipForNow":["Routing rules","Transfer mode","Custom codecs","Number rewriting"],"success":["Provider type matches SIP Trunk, Contact Center, or UC","You selected exactly one listed or generic path","The connection name identifies provider and environment","The Live Hub region is correct"],"troubleshooting":[{"problem":"The provider is not listed","fix":"Choose Generic SIP Trunk and collect the hostname, addresses, protocols, authentication, and number format from the provider."},{"problem":"You are unsure whether it is SIP","fix":"Ask the provider whether it supports a standard SIP trunk and whether it supplies a hostname or signaling IP addresses."}],"commonMistake":"Mixing a listed-provider guide with Generic SIP fields. Choose one path and stay with it for the first connection.","docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/adding-generic-sip-connection.htm"},{"id":"sip-provider-checklist","title":"Collect the provider checklist","objective":"Get the seven answers that prevent most trial-and-error during SIP setup.","duration":"5 min","path":["Provider documentation or support","Connection worksheet"],"architecture":["Provider requirements","Live Hub fields","One agreed call format"],"before":["A technical contact at the provider","The countries and numbers you will test"],"actions":[{"title":"Get the destination","instruction":"Collect the provider hostname or signaling IP addresses, ports, and the supported transport: UDP, TCP, or TLS."},{"title":"Confirm authentication","instruction":"Ask whether the provider uses registration, username and password, source IP, Request-URI FQDN, incoming DIDs, or a combination."},{"title":"Confirm security","instruction":"Ask whether TLS is required and whether the provider must trust the Live Hub certificate. Also confirm which Live Hub signaling and media addresses they must allowlist."},{"title":"Confirm number format","instruction":"Agree whether calling and called numbers use E.164 with +, without +, 00, 0, or a national format."},{"title":"Confirm optional behavior","instruction":"Ask whether the provider supports SIP OPTIONS keep-alive, DTMF method, REFER or INVITE transfer, and any required codecs."}],"skipForNow":["Provider options that are not explicitly required","Production capacity increases","Advanced header manipulation"],"success":["Hostname or IP, port, and transport are known","Authentication method is known","Number format is agreed","Optional provider requirements are recorded"],"troubleshooting":[{"problem":"The provider only sent an IP address","fix":"Ask for port, transport, authentication method, number format, and whether they expect Live Hub IPs to be allowlisted."},{"problem":"The provider says ‘standard SIP’","fix":"Still confirm TLS versus TCP/UDP, inbound authentication, number format, OPTIONS support, and transfer method."}],"commonMistake":"Starting the wizard with only a hostname and guessing every other provider requirement.","docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/adding-generic-sip-connection.htm"},{"id":"sip-general-traffic","title":"Configure General, Incoming, and Outgoing","objective":"Create the smallest valid signaling path in both directions.","duration":"9 min","path":["SIP connection","General","Incoming","Outgoing"],"architecture":["Incoming authentication","Live Hub SIP connection","Outgoing destination"],"before":["The completed provider checklist","Registration credentials if required"],"actions":[{"title":"Set security correctly","instruction":"Enable Security only for TLS. If the provider uses TCP or UDP, disable Security; otherwise those protocols will not appear."},{"title":"Add registration only when required","instruction":"Under Registration and authentication, enable registration and enter the supplied credentials only if the provider expects REGISTER. Add Contact name only when the provider requires that value."},{"title":"Choose incoming authentication","instruction":"Use FQDN (Request-URI) when the provider can send calls to your unique Live Hub FQDN. Otherwise use Dialed Numbers (DIDs), then add Source IP Address or Credentials as required.","note":"The first incoming method must be FQDN or Dialed Numbers (DIDs)."},{"title":"Set the outgoing destination","instruction":"Add the provider hostname when supplied. Add signaling addresses with the correct port and protocol; use the provider's DNS method only when required."},{"title":"Confirm allowlisting","instruction":"Give the provider every signaling and media address shown by Live Hub, including the relevant ports. Partial allowlisting can create one-way audio or intermittent failures."}],"skipForNow":["Call transfer","DTMF","Codec changes","Contact hostname"],"success":["Security matches the transport","Incoming authentication has a valid first method","Outgoing hostname or addresses are complete","Required credentials are stored only in secure fields"],"troubleshooting":[{"problem":"Only TLS is available","fix":"Security is enabled. Disable it when the provider uses TCP or UDP."},{"problem":"Incoming calls are not recognized","fix":"Confirm the Request-URI uses the Live Hub FQDN, or add the correct incoming DIDs and the additional authentication method."}],"commonMistake":"Using Source IP as the only incoming method. Start with FQDN or DIDs, then add Source IP or Credentials.","docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/adding-generic-sip-connection.htm"},{"id":"sip-numbers-advanced","title":"Match numbers and add only required options","objective":"Align caller and destination formats, then configure only the advanced behavior your provider requires.","duration":"7 min","path":["SIP connection","Numbers","Advanced"],"architecture":["Live Hub number format","SIP headers","Provider number format"],"before":["The provider's exact calling and called number examples","Optional SIP requirements from the checklist"],"actions":[{"title":"Set E.164 format","instruction":"In Numbers, choose the provider's required format: with +, without +, starting with 0, or starting with 00."},{"title":"Add national format only when supported","instruction":"Configure national calling rules only when the provider expects local formats. Keep the first test on one known format."},{"title":"Enable keep-alive if supported","instruction":"In Advanced, enable SIP OPTIONS and set the interval. A 200 OK response keeps the connection status marked Connected."},{"title":"Match DTMF and transfer","instruction":"Choose the provider-supported DTMF method. For transfers, use INVITE or REFER according to the provider's interop requirements."},{"title":"Keep defaults unless required","instruction":"Change codecs, Contact hostname, maximum call duration, or other advanced fields only when there is a documented provider requirement."}],"skipForNow":["Multiple number rewrite patterns","Unrequested codecs","Transfer tuning before a basic call succeeds"],"success":["A test number has one agreed format","OPTIONS is enabled only when supported","DTMF and transfer match provider requirements","Unneeded advanced settings remain at their defaults"],"troubleshooting":[{"problem":"The provider rejects the number","fix":"Compare the actual called and calling number in the SIP Ladder with the provider's required format."},{"problem":"Keep-alive shows Disconnected","fix":"Open SIP Info and inspect the OPTIONS ladder. Confirm address, port, transport, firewall, and the provider response."}],"commonMistake":"Changing every Advanced setting because it exists. Defaults are safer unless the provider requires something different.","docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/adding-generic-sip-connection.htm"},{"id":"sip-info-test","title":"Use SIP Info and prove the trunk","objective":"Verify signaling and a direct test before connecting the trunk to a public number.","duration":"6 min","path":["SIP Connections","Edit","Info","Test your SIP connection"],"architecture":["REGISTER or OPTIONS","Direct test","Call History","SIP Ladder"],"before":["A saved SIP connection","A provider test destination","One known calling number"],"actions":[{"title":"Open SIP Info","instruction":"Record the unique Live Hub FQDN and SIP Connection ID. Download the certificate only when the TLS peer requires it."},{"title":"Check addresses and limits","instruction":"Confirm the provider allowlisted every displayed signaling and media address. Review call-establishment and concurrent-call limits before production."},{"title":"Run signaling tests","instruction":"When enabled, send REGISTER or OPTIONS from the Troubleshoot area and inspect the returned SIP Ladder."},{"title":"Place a direc
