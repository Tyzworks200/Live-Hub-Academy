m":"The provider says ‘standard SIP’","fix":"Still confirm TLS versus TCP/UDP, inbound authentication, number format, OPTIONS support, and transfer method."}],"commonMistake":"Starting the wizard with only a hostname and guessing every other provider requirement.","docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/adding-generic-sip-connection.htm"},{"id":"sip-general-traffic","title":"Configure General, Incoming, and Outgoing","objective":"Create the smallest valid signaling path in both directions.","duration":"9 min","path":["SIP connection","General","Incoming","Outgoing"],"architecture":["Incoming authentication","Live Hub SIP connection","Outgoing destination"],"before":["The completed provider checklist","Registration credentials if required"],"actions":[{"title":"Set security correctly","instruction":"Enable Security only for TLS. If the provider uses TCP or UDP, disable Security; otherwise those protocols will not appear."},{"title":"Add registration only when required","instruction":"Under Registration and authentication, enable registration and enter the supplied credentials only if the provider expects REGISTER. Add Contact name only when the provider requires that value."},{"title":"Choose incoming authentication","instruction":"Use FQDN (Request-URI) when the provider can send calls to your unique Live Hub FQDN. Otherwise use Dialed Numbers (DIDs), then add Source IP Address or Credentials as required.","note":"The first incoming method must be FQDN or Dialed Numbers (DIDs)."},{"title":"Set the outgoing destination","instruction":"Add the provider hostname when supplied. Add signaling addresses with the correct port and protocol; use the provider's DNS method only when required."},{"title":"Confirm allowlisting","instruction":"Give the provider every signaling and media address shown by Live Hub, including the relevant ports. Partial allowlisting can create one-way audio or intermittent failures."}],"skipForNow":["Call transfer","DTMF","Codec changes","Contact hostname"],"success":["Security matches the transport","Incoming authentication has a valid first method","Outgoing hostname or addresses are complete","Required credentials are stored only in secure fields"],"troubleshooting":[{"problem":"Only TLS is available","fix":"Security is enabled. Disable it when the provider uses TCP or UDP."},{"problem":"Incoming calls are not recognized","fix":"Confirm the Request-URI uses the Live Hub FQDN, or add the correct incoming DIDs and the additional authentication method."}],"commonMistake":"Using Source IP as the only incoming method. Start with FQDN or DIDs, then add Source IP or Credentials.","docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/adding-generic-sip-connection.htm"},{"id":"sip-numbers-advanced","title":"Match numbers and add only required options","objective":"Align caller and destination formats, then configure only the advanced behavior your provider requires.","duration":"7 min","path":["SIP connection","Numbers","Advanced"],"architecture":["Live Hub number format","SIP headers","Provider number format"],"before":["The provider's exact calling and called number examples","Optional SIP requirements from the checklist"],"actions":[{"title":"Set E.164 format","instruction":"In Numbers, choose the provider's required format: with +, without +, starting with 0, or starting with 00."},{"title":"Add national format only when supported","instruction":"Configure national calling rules only when the provider expects local formats. Keep the first test on one known format."},{"title":"Enable keep-alive if supported","instruction":"In Advanced, enable SIP OPTIONS and set the interval. A 200 OK response keeps the connection status marked Connected."},{"title":"Match DTMF and transfer","instruction":"Choose the provider-supported DTMF method. For transfers, use INVITE or REFER according to the provider's interop requirements."},{"title":"Keep defaults unless required","instruction":"Change codecs, Contact hostname, maximum call duration, or other advanced fields only when there is a documented provider requirement."}],"skipForNow":["Multiple number rewrite patterns","Unrequested codecs","Transfer tuning before a basic call succeeds"],"success":["A test number has one agreed format","OPTIONS is enabled only when supported","DTMF and transfer match provider requirements","Unneeded advanced settings remain at their defaults"],"troubleshooting":[{"problem":"The provider rejects the number","fix":"Compare the actual called and calling number in the SIP Ladder with the provider's required format."},{"problem":"Keep-alive shows Disconnected","fix":"Open SIP Info and inspect the OPTIONS ladder. Confirm address, port, transport, firewall, and the provider response."}],"commonMistake":"Changing every Advanced setting because it exists. Defaults are safer unless the provider requires something different.","docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/adding-generic-sip-connection.htm"},{"id":"sip-info-test","title":"Use SIP Info and prove the trunk","objective":"Verify signaling and a direct test before connecting the trunk to a public number.","duration":"6 min","path":["SIP Connections","Edit","Info","Test your SIP connection"],"architecture":["REGISTER or OPTIONS","Direct test","Call History","SIP Ladder"],"before":["A saved SIP connection","A provider test destination","One known calling number"],"actions":[{"title":"Open SIP Info","instruction":"Record the unique Live Hub FQDN and SIP Connection ID. Download the certificate only when the TLS peer requires it."},{"title":"Check addresses and limits","instruction":"Confirm the provider allowlisted every displayed signaling and media address. Review call-establishment and concurrent-call limits before production."},{"title":"Run signaling tests","instruction":"When enabled, send REGISTER or OPTIONS from the Troubleshoot area and inspect the returned SIP Ladder."},{"title":"Place a direct test","instruction":"Use Test your SIP connection or the phone icon with a known calling and called number."},{"title":"Prove it in Call History","instruction":"Open the exact test, read Completion status, and inspect the SIP Ladder to confirm which side accepted or rejected each stage."}],"success":["REGISTER or OPTIONS succeeds when used","A direct test appears in Call History","You can identify the provider and Live Hub sides in the SIP Ladder"],"troubleshooting":[{"problem":"The test call disconnects immediately","fix":"Open Call History and read Completion status and the SIP Ladder before changing the trunk."},{"problem":"The status is red","fix":"Use the Info troubleshoot controls to inspect the last REGISTER or OPTIONS exchange and find which side returned the first failure."}],"commonMistake":"Calling the trunk ‘connected’ because the card exists. A completed test call and its evidence are the real success check.","docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/adding-generic-sip-connection.htm"},{"id":"request-first-number","title":"Give customers a real US or UK number","objective":"Create a controlled public entry point without assuming that number provisioning is instant.","duration":"6 min + provisioning","path":["Voice channels","Phone numbers","Add new phone number"],"architecture":["US or UK number request","Provisioned number","Routing rule","Destination"],"before":["United States or United Kingdom selected for this first Academy run","The billing owner knows the monthly fee","The target Live Hub region is known","Required business information and documents are available"],"actions":[{"title":"Open the request","instruction":"Go to Voice channels → Phone numbers and select Add new phone number."},{"title":"Stay with US or UK","instruction":"For this first Academy path, choose only United States or United Kingdom. Treat any other country as a separate provisioning task."},{"title":"Choose the number","instruction":"Review the monthly fee. For a US number, select the available state and city when those fields appear; then choose the correct Live Hub region."},{"title":"Submit the form","instruction":"Complete the purchase request form and provide every document it asks for. The request can require review, so do not build routing around the number until it is ready."},{"title":"Wait for provisioning","instruction":"Return to Phone numbers and confirm that the requested number is available for use. Record its exact E.164 format and region."},{"title":"Leave the connection to routing","instruction":"The number does not become an AI Agent or SIP destination by itself. The next lesson creates that relationship in Routing."}],"skipForNow":["Countries outside the US and UK","Several numbers","Number patterns","Production capacity"],"success":["The request form was submitted successfully","Any required documents were provided","The number is provisioned and visible in Phone numbers","Its exact number and region are recorded"],"troubleshooting":[{"problem":"The country you need is not offered","fix":"Stop this first-run path and use Help Center or support to request that country. Do not substitute a random country just to continue."},{"problem":"The request is still pending","fix":"Wait for provisioning or resolve the missing form information. Routing cannot make a pending number callable."},{"problem":"The number appears unassigned","fix":"That can be expected. The routing rule connects the number to the destination."}],"commonMistake":"Treating Add new phone number as instant self-service. For the Academy first run, plan for a form, possible documents, and provisioning time.","docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Purchasing%20Phone%20Numbers.htm"},{"id":"sip-number-route","title":"Route the number to SIP and make the call","objective":"Connect the provisioned number to the verified SIP connection with one exact routing rule.","duration":"6 min","path":["Routing","Routing Rules","Add new routing rule"],"architecture":["Caller","US or UK number","Routing rule","SIP connection","Provider destination"],"before":["A provisioned US or UK number","A verified SIP connection","Both entities in the same Live Hub region","One exact destination number"],"actions":[{"title":"Write the rule as a sentence","instruction":"Before editing, write: When a Call comes from this Live Hub phone number and matches this exact called number, route it to this SIP connection."},{"title":"Create the exact rule","instruction":"Select the region, set Type to Call, choose the Live Hub number as Call origin, enter the exact test number, and choose the SIP connection under Route To."},{"title":"Keep optional services off","instruction":"Do not enable recording, Agent Assist, translation, transfer behavior, or number customization for the baseline call."},{"title":"Check rule order","instruction":"Put specific rules before any broad prefix or catch-all rule that could match the same call."},{"title":"Call and inspect","instruction":"Place the controlled call, then open Calls → Call History and inspect Completion status, the matched route, and the SIP Ladder."}],"success":["The exact routing rule matches","The SIP destination receives the call","The call appears in Call History","The SIP Ladder shows the expected provider exchange"],"troubleshooting":[{"problem":"Another rule handles the call","fix":"Move the specific rule ahead of the broad rule or make its called-number condition more exact."},{"problem":"The provider rejects the call","fix":"Compare the actual calling and called number formats in the SIP Ladder with the provider requirement."}],"commonMistake":"Using a catch-all before the exact first test works. Specific rules should be evaluated before broad fallbacks.","docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Defining%20Routing.htm"}],"teams-sip":[{"id":"teams-prepare-tenant","title":"Prepare the Microsoft Teams tenant","objective":"Confirm the tenant is eligible before Live Hub changes its voice configuration.","duration":"7 min","path":["Voice channels","Microsoft Teams","Connect tenant"],"architecture":["Microsoft 365 tenant","Live Hub service account","Live Hub account"],"before":["Microsoft 365 administrator access","Eligible licenses","The intended Live Hub account","Approval to connect the tenant"],"actions":[{"title":"Confirm the account","instruction":"Check Current account in Live Hub. A Teams tenant should be connected to the intended Live Hub account before you create connections or routing."},{"title":"Verify licenses","instruction":"Use the tenant guide to verify the required Microsoft license availability before provisioning the Live Hub service account."},{"title":"Prepare the service account","instruction":"Provision the service account and required Microsoft permissions exactly as the official tenant guide describes."},{"title":"Connect the tenant","instruction":"Start Connect tenant, sign in with the authorized Microsoft administrator, review the permissions, and finish the connection."},{"title":"Confirm the tenant","instruction":"Return to Live Hub and verify that the expected tenant—not a test or similarly named tenant—is connected."}],"skipForNow":["Teams routing","Phone-number assignment","Multiple Teams connections"],"success":["The correct Live Hub account is selected","License checks pass","The service account is provisioned","The intended Microsoft tenant is connected"],"troubleshooting":[{"problem":"License Plan not available","fix":"Stop and verify eligible licenses in Microsoft 365. Recreating the Live Hub connection will not fix a missing license."},{"problem":"The wrong tenant was connected","fix":"Do not continue to number assignment or routing. Follow the official disconnect/cleanup guidance, then connect the correct tenant."}],"commonMistake":"Creating the Teams connection before confirming the tenant, licenses, service account, and current Live Hub account.","docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Configuring%20your%20tenant.htm"},{"id":"teams-create-connection","title":"Create and activate the Teams connection","objective":"Create one Teams voice connection in the same region as the SIP connection it will use.","duration":"6 min + activation","path":["Voice channels","Microsoft Teams","Add new connection"],"architecture":["Teams tenant","Teams connection","Live Hub region"],"before":["A connected Teams tenant","The planned Live Hub region","Test call limits"],"actions":[{"title":"Add the connection","instruction":"Open Microsoft Teams and select Add new connection."},{"title":"Name and locate it","instruction":"Use a clear environment name and select the region that will also contain the SIP connection and routing rules."},{"title":"Set test limits","instruction":"Review concurrent calls, call-establishment rate, and maximum duration. Keep the first-run scope small."},{"title":"Create and wait","instruction":"Select Create, then wait for the connection to become Active. Provisioning can take up to 10 minutes."},{"title":"Do not route early","instruction":"Continue only when the connection state is Active and the region is correct."}],"success":["The connection is Active","Its name identifies the environment","Its region matches the planned SIP path","Its limits are sufficient for the test"],"troubleshooting":[{"problem":"The connection remains Creating","fix":"Allow up to 10 minutes, then open the state details and verify the tenant and license preparation."},{"problem":"The region is wrong","fix":"Correct or recreate the connection before adding phone numbers and routing."}],"docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Creating%20Teams%20connection.htm"},{"id":"teams-assign-numbers","title":"Assign Teams phone numbers","objective":"Make the intended Teams users reachable only after tenant and connection setup is complete.","duration":"6 min","path":["Voice channels","Microsoft Teams","Tenant management","Assign phone numbers"],"architecture":["Teams phone number","Teams user","Teams connection"],"before":["An Active Teams connection","The approved users and phone numbers","The required Microsoft licenses"],"actions":[{"title":"Open tenant management","instruction":"Open the connected Microsoft Teams tenant and choose Assign phone numbers."},{"title":"Select the right users","instruction":"Use approved test users first. Confirm identity, license, and environment before applying numbers."},{"title":"Assign the numbers","instruction":"Enter or select the approved phone numbers and complete the assignment workflow."},{"title":"Wait for synchronization","instruction":"Allow the Microsoft configuration to finish before treating the numbers as ready for routing."},{"title":"Record exact formats","instruction":"Write down the exact Teams numbers you will use as calling or called-number conditions."}],"success":["The intended users have the intended numbers","The exact number formats are recorded","The connection remains Active"],"troubleshooting":[{"problem":"A user cannot receive a number","fix":"Check the user license, tenant identity, existing assignments, and synchronization state before retrying."}],"commonMistake":"Assigning numbers before the tenant and Teams connection are fully ready.","docUrl":"https://techdocs.audiocodes.com/livehub/#LiveHub/Assigning%20Phone%20Numbers.htm?TocPath=Voice%2520channels%257CMicrosoft%2520Teams%2520voice%2520integration%257CManaging%2520Teams%2520tenant%257C_____1"},{"id":"teams-prepare-sip","title":"Create and verify the SIP side","objective":"Prepare the carrier, PBX, or contact-center connection that Teams calls will reach.","duration":"12 min","path":["Voice channels","SIP Connections","Add new SIP connection"],"architecture":["Microsoft Teams","Live Hub routing","SIP connection","Provider"],"before":["Provider hostname or IP, port, and transport","Authentication method","Number format","The Teams connection region"],"actions":[{"title":"Choose listed or Generic","instruction":"Use the named provider profile when it exists. Otherwise choose the Generic option inside the correct SIP Trunk, Contact Center, or UC provider type."},{"title":"Match the region","instruction":"Create the SIP connection in the same region as the Teams connection."},{"title":"Configure both directions","instruction":"Complete General, Incoming, Outgoing, and Numbers from provider-supplied values. Use FQDN Request-URI when supported; otherwise use DIDs plus Source IP or Credentials."},{"title":"Verify SIP Info","instruction":"Confirm allowlisting, FQDN, transport, and number format. Use REGISTER or OPTIONS evidence when those features are enabled."},{"title":"Prove a direct test","instruction":"Use Test your SIP connection and Call History before combining SIP with Teams routing."}],"success":["The SIP connection is saved in the Teams region","Its inbound and outbound requirements are complete","A direct test produces understandable evidence"],"troubleshooting":[{"problem":"SIP is Disconnected","fix":"Inspect the latest REGISTER or OPTIONS ladder in SIP Info before editing Teams."}],"commonMistake":"Diagnosing Teams while the SIP side has never passed its own direct test.","docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/adding-generic-sip-connection.htm"},{"id":"teams-sip-routing","title":"Create both routing directions and test","objective":"Connect Teams and SIP with two explicit rules, then prove each direction independently.","duration":"10 min","path":["Routing","Routing Rules","Add new routing rule"],"architecture":["Teams connection","Routing rules","SIP connection"],"before":["An Active Teams connection","A verified SIP connection","Assigned Teams numbers","One controlled test in each direction"],"actions":[{"title":"Rule 1 — Teams to SIP","instruction":"Set Type to Call, choose the Teams connection as origin, use the exact first test number condition, and choose the SIP connection under Route To."},{"title":"Rule 2 — SIP to Teams","instruction":"Create a second rule with the SIP connection as origin and the Teams connection as destination. Use the exact assigned Teams number for the first test."},{"title":"Order rules safely","instruction":"Place these specific rules before any broad prefix or catch-all rule that could match the same calls."},{"title":"Test Teams to SIP","instruction":"Place the controlled outbound Teams call and verify the matched rule, number format, completion status, and SIP Ladder in Calls."},{"title":"Test SIP to Teams","instruction":"Place the controlled inbound call and verify that the correct Teams user rings. Inspect the call record separately."}],"skipForNow":["Recording","Translation","Agent Assist","Number customization","Broad wildcards"],"success":["Teams-to-SIP uses the intended rule","SIP-to-Teams reaches the intended user","Both call records are understood","Specific rules appear before catch-all rules"],"troubleshooting":[{"problem":"One direction works and the other fails","fix":"Treat the directions as separate calls. Inspect the failed direction's origin, exact number format, matched rule, and SIP response."},{"problem":"The wrong Teams user rings","fix":"Check the assigned number, called-number condition, rule order, and any number customization."}],"commonMistake":"Creating one rule and assuming it controls both directions. Teams-to-SIP and SIP-to-Teams need separate rules.","docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Creating%20%20routing%20rules.htm"}],"routing":[{"id":"routing-model","title":"Frame the customer call","objective":"Decide which exact call should move, where it starts, and where it must land.","duration":"3 min","path":["Routing","Routing Rules"],"architecture":["Origin","Match condition","Route To","Optional services"],"before":["The channel where the call starts","The service that should receive it","One exact test number"],"actions":[{"title":"Name the origin","instruction":"Choose where the call begins: a Live Hub number, SIP connection, bot, or another configured voice channel."},{"title":"Choose Call or Transfer","instruction":"Use Call for a new incoming or outgoing call. Use Transfer only when an existing call is being transferred."},{"title":"Choose one exact condition","instruction":"For the first test, match the exact calling or called number. Add prefixes and broader patterns only after the route works."},{"title":"Name the destination","instruction":"Choose the bot, SIP trunk, phone number, contact center, or other Live Hub service that should receive the call."}],"skipForNow":["Recordings","Agent Assist","Voice translation","Number customization"],"success":["You can say: When a call comes from X and matches Y, send it to Z","Origin and destination already exist in the same region"],"troubleshooting":[{"problem":"You cannot select an origin or destination","fix":"Create that number, bot, or connection first and confirm it uses the same account and region."}],"commonMistake":"Starting with optional services before the basic origin-to-destination route succeeds.","docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Defining%20Routing.htm"},{"id":"routing-create","title":"Build the route in Live Hub","objective":"Create one precise rule that sends the test call to one destination.","duration":"5 min","path":["Routing","Add new routing rule"],"architecture":["Exact test call","Matching rule","One destination"],"before":["Ready origin","Ready destination","Matching Live Hub region"],"actions":[{"title":"Add a rule","instruction":"Open Routing and select Add new routing rule."},{"title":"Select the region","instruction":"Choose the region where the origin and destination services are configured."},{"title":"Configure Origin","instruction":"Set Type to Call for a normal call, select the Call origin, and enter the exact calling or called number used by your test."},{"title":"Configure Route To","instruction":"Select the single bot, SIP connection, phone number, or service that should receive the call."},{"title":"Create","instruction":"Save the rule, expand it in the routing table, and read it back from origin to destination."}],"skipForNow":["Reject Call","Optional services","Call initiator","Number customization"],"success":["The rule appears in Routing","Region, origin, condition, and destination are correct","No optional service is hiding the basic result"],"troubleshooting":[{"problem":"The wrong rule matches","fix":"Make the test condition more specific and review the order of other rules that can match the same call."},{"problem":"The rule never matches","fix":"Compare the actual number format with the rule, including +, country code, prefix, and called-versus-calling field."}],"commonMistake":"Using a broad wildcard for the first test and then not knowing which traffic the rule captures.","docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Defining%20Routing.htm","videoId":"S3VdrZ5FadQ","videoTitle":"Inbound Calls to a Bot Using a Live Hub Number"},{"id":"routing-test","title":"Call it and prove the result","objective":"Make the exact customer call and prove that the intended destination received it.","duration":"4 min","path":["Place test call","Calls","Call History"],"architecture":["Caller","Origin","Routing rule","Destination","Call History"],"before":["The saved rule","A test caller","The expected destination behavior"],"actions":[{"title":"Place one controlled call","instruction":"Use the exact calling and called numbers configured in the rule."},{"title":"Confirm the destination","instruction":"Verify the intended bot, SIP connection, or person receives the call."},{"title":"Open the call record","instruction":"In Calls, confirm Completion status, routing information, duration, and participants."},{"title":"Keep the baseline","instruction":"Record the successful Call ID before adding recordings, transfers, translation, or Agent Assist."}],"success":["The intended destination receives the call","The correct rule appears in call details","Completion status is understood","A baseline Call ID is saved"],"troubleshooting":[{"problem":"The call never appears in Calls","fix":"The attempt may not have reached Live Hub. Check the source channel, dialed number, and provider."},{"problem":"The call appears but routes incorrectly","fix":"Check rule order, region, number format, origin, and the exact matching condition."}],"commonMistake":"Adding features to a route that has never passed a plain end-to-end call.","docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Calls.htm"},{"id":"routing-add-services","title":"Add one production option","objective":"Extend a proven rule without losing the ability to identify what changed.","duration":"5 min","path":["Routing","Edit rule","Services or Number Customization"],"architecture":["Working baseline","One optional service","Repeat test","Compare evidence"],"before":["A successful baseline Call ID","One feature requirement"],"actions":[{"title":"Choose one addition","instruction":"Enable only one: Live Hub recording, external recording, Agent Assist, Voice Translation, call initiator behavior, or number customization."},{"title":"Confirm prerequisites","instruction":"External recording needs a Generic Recording Server; Agent Assist needs an assist bot; Voice Translation needs a translation profile."},{"title":"Customize numbers only when needed","instruction":"Change calling, called, or service number only when the downstream service requires a specific value."},{"title":"Repeat the same call","instruction":"Use the baseline caller, destination, and test phrase so the new service is the only meaningful change."},{"title":"Compare the two calls","instruction":"Check completion, routing, services, recording or transcript, and timing against the saved baseline Call ID."}],"success":["Only one feature was added","Its prerequisite exists","The repeated call still completes","The expected new evidence appears"],"troubleshooting":[{"problem":"A service cannot be selected","fix":"Create its required bot, profile, server, or account entitlement before editing the rule."},{"problem":"The call fails after the change","fix":"Disable the one new option, confirm the baseline returns, then investigate that feature's configuration."}],"commonMistake":"Enabling several services at once and losing the clean baseline that proves which one caused a problem.","docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Defining%20Routing.htm"}],"operate":[{"id":"operate-account-model","title":"Know which account you are operating","objective":"Understand whether this is a Standalone, Parent, or Subaccount before changing billing, access, or service configuration.","duration":"5 min","path":["Current account","Profile","Account settings"],"architecture":["Parent or Standalone account","Subaccount","Users, services, and billing"],"before":["The account name and Account ID","Permission to view account settings"],"actions":[{"title":"Confirm Current account","instruction":"Use the selector at the top of Live Hub and verify both the account name and Account ID."},{"title":"Identify the account type","instruction":"Determine whether it is Standalone, Parent, or Subaccount. Account type changes who manages the account and which billing controls are available."},{"title":"Map ownership","instruction":"For a Parent account, list the Subaccounts it manages. For a Subaccount, identify the Parent account and the team responsible for billing and administration."},{"title":"Check billing responsibility","instruction":"Confirm whether usage is paid directly by this account or managed at the Parent level before changing funds, limits, or services."},{"title":"Switch deliberately","instruction":"When you change accounts, recheck the top selector before every edit. Objects in another account can look missing even when they still exist."}],"success":["Account name and ID are recorded","Account type is known","Billing and administration ownership are clear","Parent/Subaccount relationship is understood when applicable"],"troubleshooting":[{"problem":"A service or user appears missing","fix":"Check Current account and Account ID before recreating anything."},{"problem":"Billing controls are unavailable","fix":"Confirm whether this is a Subaccount whose billing is managed by its Parent account."}],"commonMistake":"Treating every Live Hub account as Standalone. Parent and Subaccount relationships affect administration and billing.","docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Accounts-types.htm"},{"id":"operate-dashboard","title":"Read the dashboard and active alarms","objective":"Know what is configured, what is happening now, and what needs attention.","duration":"5 min","path":["Dashboard"],"architecture":["Current account","Services","Call statistics","Active alarms"],"before":["The correct Current account","A time range you want to review"],"actions":[{"title":"Confirm Current account","instruction":"Check the account selector at the top before interpreting service counts, calls, alarms, or billing."},{"title":"Review Main Services","instruction":"Use the service counters to see how many SIP connections, bot connections, phone numbers, agents, translations, and routing rules exist. Select a counter to open that area."},{"title":"Read Call statistics","instruction":"Choose the interval and review call volume, success ratio, duration, concurrent calls, and voice quality after traffic begins."},{"title":"Open Active alarms","instruction":"Select a severity or alarm count to open Alarms. Read the condition and threshold before changing configuration."}],"success":["The Current account is correct","You can identify active services","You know the current call interval","Every active alarm has an owner or next check"],"troubleshooting":[{"problem":"The dashboard shows zero","fix":"Confirm the account and interval first. Then check whether the services and calls exist in the expected region and time range."}],"commonMistake":"Treating a zero count as a product failure before checking Current account and time interval.","docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Live%20Hub%20Dashboard.htm"},{"id":"operate-alarm-thresholds","title":"Configure useful alarm thresholds","objective":"Turn call and account signals into actionable notifications without creating constant noise.","duration":"8 min","path":["Settings","Advanced and Contacts","Alarms","Thresholds"],"architecture":["Metric","Threshold","Alarm severity","Email recipients","Alarm History"],"before":["The correct Current account","Up to five notification recipients","A normal traffic baseline"],"actions":[{"title":"Enable email forwarding","instruction":"Open Settings → Advanced and set Forward alarms via E-mail to Enabled."},{"title":"Add recipients","instruction":"Open Settings → Contacts and add the people who should act on alarms. Keep the list operational and limited to five contacts."},{"title":"Start with two call signals","instruction":"Open Alarms → Thresholds and begin with Failed calls % and Poor quality calls %. Add other metrics only when someone will act on them."},{"title":"Set direction and severity","instruction":"Use Exceeds threshold for failure or quality rates and Drops below for low-value signals. As a starting example from the supplied guide, consider Minor at 10% and Major at 16%, then tune to your real baseline."},{"title":"Understand account scope","instruction":"Monthly cost and Remaining funds thresholds apply to Standalone and Parent accounts; they may not be available on a Subaccount."},{"title":"Review history","instruction":"Alarms clear automatically when the condition recovers. Use Alarm History and CSV export to investigate recurring behavior; Live Hub supports up to 20 active alarms."}],"success":["Email forwarding is enabled","Recipients are configured","Each threshold has an owner and correct direction","Minor and Major severities are distinguishable","Alarm History can be exported"],"troubleshooting":[{"problem":"The team receives too many alarms","fix":"Compare thresholds with the normal traffic baseline, remove unused metrics, and raise severity only where the response is truly urgent."},{"problem":"Billing metrics are missing","fix":"Check whether the current account is a Subaccount; Monthly cost and Remaining funds are scoped to Standalone and Parent accounts."}],"commonMistake":"Copying example thresholds into production without tuning them to the account's normal traffic and response process.","docUrl":"https://techdocs.audiocodes.com/livehub/#LiveHub/Define-alarm-thresholds.htm?TocPath=Alarm%2520%2526%2520alerts%2520management%257C_____3"},{"id":"operate-call-evidence","title":"Enable transcripts and recordings deliberately","objective":"Capture the evidence you need while respecting privacy and retention.","duration":"6 min","path":["Bot connections","Edit","Features"],"architecture":["Call","Transcript or recording","Call History","Retention and sharing"],"before":["A clear support, QA, or compliance purpose","The account's privacy and retention requirements"],"actions":[{"title":"Enable the required evidence","instruction":"Turn on Call Transcript and/or Call Recording only for the bot connection or route that needs it."},{"title":"Run a test call","instruction":"Place one call and open it in Call History. Confirm the transcript or recording is present and understandable."},{"title":"Know the sharing scope","instruction":"Bot transcript sharing is per bot connection and is available only after transcription is enabled. AI agent log sharing is account-wide under Settings → Advanced."},{"title":"Handle recordings separately","instruction":"Recordings have no standing support-access switch. Download and send only the exact recording support needs."},{"title":"Protect retention-dependent evidence","instruction":"Download files required by an open investigation before the account retention period expires."}],"success":["The selected evidence appears in Call History","Sharing scope is understood","No unnecessary call content is exposed","Retention is sufficient for the task"],"troubleshooting":[{"problem":"Transcript sharing is unavailable","fix":"Enable Call Transcript first; there is nothing to share until transcription is active."},{"problem":"Support cannot see a recording","fix":"Download the exact recording and send it through your approved channel. There is no standing recording-access setting."}],"commonMistake":"Turning on every evidence type account-wide when one bot connection and one test call are enough.","docUrl":"https://techdocs.audiocodes.com/livehub/#LiveHub/byoc_Call%20Transcript.htm?TocPath=Bot%2520connectivity%257CManage%2520%2520features%257C_____1"},{"id":"operate-billing","title":"Read usage and billing","objective":"Understand current consumption and find the monthly service breakdown.","duration":"5 min","path":["Top bar","Account Balance or Monthly Usage","Billing"],"architecture":["Service usage","Current balance or monthly usage","Billing report","CSV"],"before":["Know whether the account is prepaid or postpaid","Permission to view billing"],"actions":[{"title":"Read the top-right indicator","instruction":"Prepaid accounts show Account Balance; postpaid accounts show Monthly Usage. Both reflect current consumption."},{"title":"Open Billing","instruction":"Select the balance or monthly usage indicator, or open Profile → Billing."},{"title":"Review monthly reports","instruction":"Open the current or previous month and inspect the usage and charge breakdown by service."},{"title":"Export when needed","instruction":"Use the CSV export for analysis or reconciliation. Prepaid accounts can also add funds and update billing details from this area."}],"success":["Billing type is known","Current balance or usage is understood","A monthly service breakdown can be opened","The report can be exported"],"troubleshooting":[{"problem":"You cannot change prepaid or postpaid","fix":"Contact the Live Hub team to request an account billing-type change."},{"problem":"You cannot find an invoice","fix":"Invoices are sent to the designated contact. Ask the Live Hub team to update the recipient or provide earlier copies."}],"commonMistake":"Reading the top-bar amount without opening the monthly report that explains which services created it.","docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/billing.htm"},{"id":"operate-iam","title":"Manage users and API clients with IAM","objective":"Give people and systems only the access they need.","duration":"8 min","path":["Profile picture","Access Control (IAM)"],"architecture":["IAM","Users and groups","API clients","Live Hub account"],"before":["The user or system that needs access","The minimum required role or API scope"],"actions":[{"title":"Open Access Control","instruction":"Select the profile picture and choose Access Control (IAM). Confirm the account before editing access."},{"title":"Manage people","instruction":"Add, edit, or remove users and place them in the appropriate predefined user group. Do not grant broad access for convenience."},{"title":"Create API clients separately","instruction":"Use the API clients area for system-to-system access. Name each client after its integration and environment."},{"title":"Protect credentials","instruction":"Store client secrets in an approved secret store. Never place passwords, API keys, client secrets, or bearer tokens in Academy notes, logs, or support tickets."},{"title":"Review access","instruction":"Remove unused users and clients, and confirm remaining permissions still match their purpose."}],"success":["Every user has an intentional group","API clients are named by integration and environment","Secrets are stored safely","Unused access is removed"],"troubleshooting":[{"problem":"A user cannot see a feature","fix":"Check the Current account and the user's assigned group before creating a duplicate invitation."},{"problem":"An API call returns 401 or 403","fix":"Confirm the API client, token endpoint, client secret, requested scope, and the target account without exposing credentials."}],"commonMistake":"Using a personal login for automation instead of a purpose-built API client with limited access.","docUrl":"https://techdocs.audiocodes.com/livehub/#LiveHub/users-introduction.htm?TocPath=User%2520access%2520%2526%2520permissions%257C_____1"}],"voice-channel":[{"id":"choose-channel","title":"Choose the right voice channel","objective":"Select one channel that matches where your calls already live.","duration":"3 min","path":["Voice channels"],"before":["Where calls originate today","Whether you need inbound, outbound, or both"],"actions":[{"title":"Use a Live Hub number","instruction":"Choose Phone numbers when you want the fastest public phone entry point and do not need to keep an existing carrier."},{"title":"Use SIP","instruction":"Choose SIP connections for an existing carrier, PBX, contact center, or UC platform."},{"title":"Use Teams","instruction":"Choose Microsoft Teams when Teams users need calls to or from Live Hub. Connect the tenant first."},{"title":"Use WebRTC","instruction":"Choose Click-to-Call when calls should start from a website or mobile app."},{"title":"Use WhatsApp","instruction":"Choose WhatsApp numbers for voice calls from a verified WhatsApp Business number."}],"success":["You can name the channel and why it is the simplest fit","You know which account, tenant, or provider details are required"],"troubleshooting":[{"problem":"Two channels both seem possible","fix":"Start with the one that reaches a real test caller fastest. Add the second channel after the first route works."}],"docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/voice-channels.htm","videoId":"y-YQIf4FiG4","videoTitle":"Getting Started with Live Hub"},{"id":"create-channel","title":"Create the connection","objective":"Finish the relevant wizard without mixing instructions from another channel.","duration":"8 min","path":["Voice channels","Your channel","Add new"],"before":["The channel decision from lesson 1","Provider credentials or tenant access when required","A Live Hub region"],"actions":[{"title":"SIP","instruction":"Open SIP connections → Add new SIP connection. Select provider type and provider, choose the region, then enter the wizard’s incoming and outgoing details."},{"title":"Teams","instruction":"Open Microsoft Teams → Add new connection. Enter a name, region, call limits, and maximum duration, then click Create."},{"title":"WhatsApp","instruction":"Open WhatsApp numbers → Add new WhatsApp number. Enter a unique name, 6-digit PIN, region, call limits, and duration; then authorize the WhatsApp Business account."},{"title":"WebRTC","instruction":"Create a SIP connection with Provider Type set to Client Applications and Provider set to Click-to-Call (WebRTC). Prefer authentication code over basic credentials."},{"title":"Phone number","instruction":"Open Phone numbers and use the plus wizard to select and purchase a DID in the country you need."}],"success":["The connection card exists","The name and region are correct","The state is moving toward Active or ready"],"troubleshooting":[{"problem":"Teams says License Plan not available","fix":"Verify eligible Microsoft 365 licenses before recreating the connection."},{"problem":"WhatsApp authorization stops","fix":"Confirm an active Facebook account and a verified WhatsApp Business account are available."},{"problem":"WebRTC authentication is unclear","fix":"Use authentication code for the safer setup. Basic credentials are supported but are not the preferred method."}],"docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/voice-channels.htm"},{"id":"verify-channel","title":"Confirm region, state, and limits","objective":"Know the channel is ready before you build routing around it.","duration":"3 min","path":["Voice channels","Connection card"],"before":["A newly created connection"],"actions":[{"title":"Confirm the state","instruction":"Wait for the connection to show Active, Connected, or its equivalent ready state. Teams provisioning can take up to 10 minutes."},{"title":"Confirm the region","instruction":"Make sure the region matches the bot, routing rule, and other entities that will use this channel."},{"title":"Review limits","instruction":"Check calls per second, concurrent calls, and maximum call duration. The lowest applicable maximum duration wins."},{"title":"Keep credentials safe","instruction":"Do not paste provider secrets into notes or screenshots. Store them only in the requested secure fields."}],"success":["The connection is ready","The region matches the destination","The call limits are acceptable for the test"],"troubleshooting":[{"problem":"The state stays Creating","fix":"Open or hover over the state for the reason. For Teams, allow up to 10 minutes before treating it as failed."},{"problem":"The wrong region was used","fix":"Recreate or edit the connection before continuing, then keep all first-test entities in one region."}],"docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Creating%20Teams%20connection.htm"},{"id":"route-channel","title":"Route the channel and test","objective":"Prove that a call from the selected origin reaches the expected destination.","duration":"5 min","path":["Routing","Routing Rules","Add new routing rule"],"before":["A ready voice channel","A ready bot, Teams user, contact center, or other destination"],"actions":[{"title":"Create the rule","instruction":"Open Routing → Routing Rules and click Add new routing rule."},{"title":"Set the origin","instruction":"Select the region. Set Type to Call, then choose your phone number, SIP connection, Teams connection, WebRTC connection, or WhatsApp number under Call origin."},{"title":"Keep the first condition broad","instruction":"For the first controlled test, use the exact called number or * when appropriate. Tighten prefixes after the route works."},{"title":"Choose the destination","instruction":"Under Route To, choose the bot, phone number, connection, or other destination that should receive the call."},{"title":"Create and call","instruction":"Click Create, place one test call, and then verify the call in Calls."}],"success":["The routing rule is visible","The origin and destination are correct","A real test call reaches the destination","The call appears in Call History"],"troubleshooting":[{"problem":"The wrong rule handles the call","fix":"Review other matching rules and their order. Make the test condition more specific."},{"problem":"The call is rejected","fix":"Check called-number formatting, including the + country code, exact number, prefix, or * pattern."}],"docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Defining%20Routing.htm"}],"agent-assist":[{"id":"define-assist","title":"Define the assist bot","objective":"Create the bot connection that will receive the live transcript.","duration":"5 min","path":["Bot connections","Add new assist bot connection"],"before":["An assist-capable bot framework","A clear assistance goal such as answers, summaries, sentiment, or keyword monitoring"],"actions":[{"title":"Open Bot connections","instruction":"Select Bot connections in the Live Hub navigation."},{"title":"Start an assist connection","instruction":"Click Add new assist bot connection—not Add new voice bot connection."},{"title":"Choose the framework","instruction":"Select the bot framework that hosts your assist logic and complete its requested connection settings."},{"title":"Name the outcome","instruction":"Use a name that explains the job, for example Agent-Answers-QA or Wrap-Up-Summary."},{"title":"Create","instruction":"Save the assist bot and confirm it appears on the Bot connections page."}],"success":["The connection is labeled as an assist bot","Its purpose is clear from the name","It is available for routing services"],"troubleshooting":[{"problem":"You created a voice bot by mistake","fix":"Return to Bot connections and use Add new assist bot connection. The two connection types serve different call roles."}],"docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Agent%20assist.htm"},{"id":"choose-assist-path","title":"Choose in-path or SIPREC","objective":"Use the correct integration pattern for where the call is handled.","duration":"4 min","path":["Architecture decision"],"before":["Know whether calls already pass through Live Hub"],"actions":[{"title":"Calls already in Live Hub","instruction":"Use the in-path method. You only need the assist bot and a routing rule with Agent assist bot enabled under Services."},{"title":"Calls stay outside Live Hub","instruction":"Use SIPREC. Your phone system acts as the SIPREC client and Live Hub as the SIPREC server so Live Hub receives the live conversation."},{"title":"For SIPREC","instruction":"Create or prepare the SIP connection that represents the recording path, then make sure the external system sends the SIPREC session to Live Hub."},{"title":"Write down your selected path","instruction":"Choose one path for the first test. Do not configure both unless your architecture truly contains both call types."}],"success":["You can say whether the call is inside or outside Live Hub","You know whether a SIPREC connection is required"],"troubleshooting":[{"problem":"The assist bot receives no transcript","fix":"If the call is outside Live Hub, verify the SIPREC session reaches the Live Hub connection. If inside, verify the service is enabled on the matching routing rule."}],"docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Agent%20assist.htm"},{"id":"attach-assist","title":"Attach the bot to routing","objective":"Apply the assist bot only to the calls it should monitor.","duration":"5 min","path":["Routing","Routing Rules","Add or Edit"],"before":["A ready assist bot","A ready call origin","SIPREC connection if calls are outside Live Hub"],"actions":[{"title":"Open the matching rule","instruction":"Create a new routing rule or edit the rule that handles the target call origin."},{"title":"Set the origin","instruction":"For outside calls, set Type to Call and select the relevant SIP connection as Call origin. For in-path calls, use the existing origin."},{"title":"Set the normal destination","instruction":"For in-path calls, keep the intended call destination under Route To."},{"title":"Enable Agent assist bot","instruction":"Under Services, turn on Agent assist bot and select the assist bot connection."},{"title":"Create or update","instruction":"Save the rule and expand its row to confirm the assist service indicator is active."}],"success":["The rule matches the correct origin","Agent assist bot is enabled","The intended assist bot is selected"],"troubleshooting":[{"problem":"The Agent assist bot option is disabled","fix":"Create the assist bot connection first. Routing can only select an existing assist bot."},{"problem":"You selected the assist bot as the main destination","fix":"For calls already in Live Hub, keep the normal destination and add the assist bot under Services."}],"docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Agent%20assist.htm"},{"id":"test-assist","title":"Test transcript and assistance","objective":"Prove the bot receives the conversation and produces the expected out-of-band result.","duration":"6 min","path":["Place test call","Calls","Call details"],"before":["A saved assist routing rule","A short test script containing one trigger the bot should recognize"],"actions":[{"title":"Plan one trigger","instruction":"Choose a sentence that should cause a clear result—for example, asking for account information or mentioning a monitored keyword."},{"title":"Place the call","instruction":"Call through the exact origin used in the routing rule and say the trigger naturally during the agent-customer conversation."},{"title":"Check the assist result","instruction":"Confirm the human agent or configured recipient receives the expected answer, suggestion, alert, or summary."},{"title":"Inspect the call","instruction":"Open Calls, select the test call, and review participants, transcript/logs, termination, and timing."},{"title":"Tune one thing","instruction":"If the result is weak, change either the bot instruction or the routing setup—only one variable—then repeat the same test."}],"success":["The call is captured","The transcript contains the trigger phrase","The assist output reaches the expected recipient","The output matches the intended job"],"troubleshooting":[{"problem":"There is a transcript but no assist output","fix":"The voice path works. Check the assist bot’s trigger logic and out-of-band destination."},{"problem":"There is no transcript","fix":"Check the routing rule service and, for outside calls, the SIPREC connection before changing the bot logic."}],"docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Calls.htm"}],"translation":[{"id":"translation-profile","title":"Create the translation profile","objective":"Choose when translation begins and create the profile shell.","duration":"4 min","path":["Hub+","Voice translation","Add new voice translation"],"before":["Agent language","Customer language","Whether translation should start automatically or by keypad code"],"actions":[{"title":"Open Voice translation","instruction":"Expand Hub+ in the navigation and select Voice translation."},{"title":"Start the wizard","instruction":"Click Add new voice translation."},{"title":"Name and locate it","instruction":"In General, enter a clear name and select the Live Hub region associated with the call flow."},{"title":"Choose the speech account","instruction":"Select the AudioCodes speech provider option or your own provider, depending on your account setup."},{"title":"Choose activation","instruction":"Use Automatic start when one language pair applies to every call. Use Dynamic activation when an agent should select from multiple languages using DTMF."}],"success":["The name and region are correct","The activation mode matches the real call experience","The wizard advances to Languages"],"troubleshooting":[{"problem":"You are unsure which activation mode to use","fix":"Start with Automatic for one fixed language pair. Use Dynamic only when agents must choose a language during the call."}],"docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Create-Voice-translation.htm"},{"id":"translation-languages","title":"Set languages and activation","objective":"Define exactly who speaks which language and, for dynamic mode, how it starts.","duration":"5 min","path":["Voice translation wizard","Languages"],"before":["Exact language locales, not only language names","DTMF codes if using dynamic activation"],"actions":[{"title":"Automatic mode","instruction":"Select one Agent language and one Customer language. Example: agent en-GB and customer fr-FR."},{"title":"Dynamic mode","instruction":"Add at least two customer-language options. Create a row for each supported language."},{"title":"Add DTMF activation","instruction":"For every dynamic pair, enter a DTMF code and select the agent and customer languages. At least one activation code is required."},{"title":"Choose the translation provider","instruction":"Select the available provider—such as Azure, Claude, or OpenAI—for the language pair."},{"title":"Continue","instruction":"Review every locale and code, then click Next."}],"success":["Agent and customer languages are not reversed","Dynamic mode contains at least two languages","Every intended pair has a unique DTMF code"],"troubleshooting":[{"problem":"Translation goes in the wrong direction","fix":"Recheck which locale is configured as Agent language and which is Customer language."},{"problem":"Dynamic activation does nothing","fix":"Confirm a DTMF code exists for that exact language pair and note whether customer activation is allowed."}],"docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Configure-dynamic-translation.htm"},{"id":"translation-speech","title":"Choose speech, voice, and volume","objective":"Make both directions understandable and comfortable to listen to.","duration":"5 min","path":["Voice translation wizard","Languages","Advanced"],"before":["A supported STT service","A supported TTS voice for each locale"],"actions":[{"title":"Configure the agent side","instruction":"Choose the agent language, STT service, TTS service, and a matching voice name."},{"title":"Configure the customer side","instruction":"Choose the customer language, STT service, TTS service, and a matching voice name."},{"title":"Set volume behavior","instruction":"In Advanced, adjust original-language volume when translation is idle and when translated speech is playing. 0 dB is normal; -31 dB is very low."},{"title":"Add an activation message","instruction":"Optionally add a short message—maximum 200 characters—so participants know translation is active."},{"title":"Choose useful features","instruction":"Enable agent or customer barge-in when natural interruption matters. Enable Store call transcript when you need both original and translated text for review."}],"success":["Every locale has STT, TTS, and a matching voice","Original audio is not overpowering translated audio","Transcript storage follows your privacy and support needs"],"troubleshooting":[{"problem":"A voice is missing","fix":"Choose a TTS provider and voice that support the exact configured locale."},{"problem":"Participants hear two voices too loudly","fix":"Lower the foreign/original language slider while translation is playing, or mute it for the agent when appropriate."}],"docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Configure-automatic-translation.htm"},{"id":"translation-route-test","title":"Enable the route and test both ways","objective":"Prove the configured call receives clear two-way translation.","duration":"6 min","path":["Routing","Routing Rules","Add or Edit"],"before":["A created translation profile","A ready call origin and destination","Two people or recordings that can speak the configured languages"],"actions":[{"title":"Open the call’s rule","instruction":"Create or edit the routing rule that matches the target phone number or connection."},{"title":"Enable Voice translation","instruction":"Under Services, turn on Voice translation and select the profile you created.","note":"Voice translation cannot be enabled together with Agent assist on the same rule."},{"title":"Save","instruction":"Create or update the rule and expand it to confirm the Voice translation indicator is active."},{"title":"Run a two-way test","instruction":"Place a call. Have the customer speak first, then the agent. In dynamic mode, enter the configured DTMF code before testing the language pair."},{"title":"Inspect the result","instruction":"Open Calls and review the Real-time translation transcript. Check that original and translated turns appear in the correct order."}],"success":["Translation activates at the expected time","Both participants hear the other in their configured language","The transcript identifies the two directions","The call remains stable through several turns"],"troubleshooting":[{"problem":"The Voice translation service is disabled","fix":"Create the translation profile first and make sure Agent assist is not enabled on the same rule."},{"problem":"Only one direction works","fix":"Check STT, TTS, locale, and voice settings for the failing participant’s side."},{"problem":"Translation is slow","fix":"Use Call History to compare STT, provider, and TTS timing before changing multiple settings."}],"docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Defining%20Routing.htm"}],"diagnose":[{"id":"capture-failed-call","title":"Capture one failed call","objective":"Start with one exact call record so every next check is based on evidence, not guessing.","duration":"4 min","path":["Calls","Call History","Affected call"],"before":["The approximate time of the failure","Calling or called number","Permission to view call details"],"actions":[{"title":"Reproduce once","instruction":"If it is safe, place one controlled test call and note what you expected versus what actually happened."},{"title":"Open Call History","instruction":"Go to Calls → Call History and filter by time, calling number, called number, or service until you find the exact attempt."},{"title":"Copy the identifiers","instruction":"Record the Call ID, timestamp with time zone, calling number, called number, duration, and Completion status."},{"title":"Keep related records together","instruction":"If alternate routing or a transfer created several records, search for records with the same SID and treat them as one sequence."}],"success":["You have the exact Call ID","The timestamp includes a time zone","You can describe expected versus observed behavior in one sentence"],"troubleshooting":[{"problem":"The call is not in history","fix":"Broaden the time range, remove one filter at a time, and confirm you are looking in the correct account and region."},{"problem":"There are several records","fix":"Compare the SID, start time, routing group, and transfer details before choosing one record in isolation."}],"docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Calls.htm"},{"id":"read-completion-status","title":"Read the outcome before the logs","objective":"Use Completion status and the call summary to identify the first likely failing layer.","duration":"4 min","path":["Calls","Call History","Completion status"],"before":["The call record from lesson 1","The exact Completion status text"],"actions":[{"title":"Read the status literally","instruction":"Copy the Completion status exactly. A SIP code, Bot Err, STT Err, TTS Err, limit message, or normal Bye each points to a different starting layer."},{"title":"Decide whether it is expected","instruction":"Statuses such as caller cancel, busy, normal call clear, a configured maximum duration, or no-user-input can be normal lifecycle events."},{"title":"Name the first owner","instruction":"Choose one starting layer: routing/telephony, Microsoft Teams, speech, AI agent, tool or webhook, account limit, or expected behavior."},{"title":"Open the matching glossary entry","instruction":"Use the Academy Troubleshooting search to match the exact status or the closest symptom and read What it means before changing configuration."}],"success":["The exact status is recorded","You know whether it may be expected","You selected one first area to investigate"],"troubleshooting":[{"problem":"The status says Unknown error","fix":"Continue with the timeline evidence in the next lesson and collect the Call ID for support; do not change several systems at once."},{"problem":"The status is blank or unclear","fix":"Use the call summary, participant sequence, service indicators, and timestamps to find the last successful stage."}],"docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Calls.htm"},{"id":"inspect-failing-layer","title":"Inspect the right evidence","objective":"Open only the evidence that can prove or disprove the suspected layer.","duration":"6 min","path":["Calls","Call details","Recording / Transcript / AI logs / SIP Ladder"],"before":["The first suspected layer","Access to the call details"],"actions":[{"title":"For signaling or routing","instruction":"Open the SIP Ladder. Find which side sent the final failure response and check whether the request reached the intended destination."},{"title":"For speech or audio","instruction":"Listen to the recording, compare the transcript with what was spoken, and review voice quality plus separate STT and TTS latency values."},{"title":"For AI behavior","instruction":"Open AI Agent logs and follow the turn where behavior changed. Check recognized input, model response, tool calls, document activity, and Flow transitions."},{"title":"For broad failures","instruction":"Open Alarms and Alarm History. Check capacity, connectivity, voice quality, balance, and account state around the same timestamp."},{"title":"Write the finding","instruction":"Capture one evidence sentence, for example: ‘The carrier returned 403’ or ‘STT websocket closed before the first transcript turn.’"}],"success":["You opened evidence for the suspected layer","You know which system produced the first failure","You wrote one evidence-backed finding"],"troubleshooting":[{"problem":"There is no recording","fix":"Recordings are only available when enabled and still inside retention. Use the transcript, logs, SIP Ladder, and call metadata instead."},{"problem":"Support cannot see the content","fix":"Sharing is off by default. Share the relevant transcript or AI agent logs, or download the exact files and send them yourself."}],"docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Calls.htm"},{"id":"apply-one-fix","title":"Change one layer and retest","objective":"Apply the smallest evidence-backed correction and prove whether it changed the result.","duration":"5 min","path":["Affected configuration","Edit","Save","Test call"],"before":["One confirmed or strongly suspected cause","A reversible configuration change"],"actions":[{"title":"Choose the smallest fix","instruction":"Examples: correct the called-number pattern, align regions, update one SIP credential, select the right STT locale, repair one tool parameter, or lower a burst rate."},{"title":"Record the original value","instruction":"Before saving, note the previous setting so you can restore it if the test becomes worse."},{"title":"Change only one variable","instruction":"Save one correction. Avoid changing routing, speech, and agent instructions in the same test because the successful cause will be impossible to prove."},{"title":"Repeat the same call","instruction":"Use the same origin, destination, test phrase, and expected result whenever possible."},{"title":"Compare records","instruction":"Compare the new Completion status, call path, transcript, latency, and logs with the original failed attempt."}],"success":["Only one meaningful variable changed","A new Call ID exists","You can say whether the change fixed, changed, or did not affect the failure"],"troubleshooting":[{"problem":"The symptom changed","fix":"That is useful evidence. Search the new exact status and continue from the new first failing layer."},{"problem":"The same failure remains","fix":"Restore the setting if necessary, record that the cause was disproved, and move to the next most likely cause."}],"docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Calls.htm"},{"id":"escalate-cleanly","title":"Escalate with a complete case","objective":"Give support enough evidence to investigate immediately while sharing only what is necessary.","duration":"4 min","path":["Help Center","Contact support"],"before":["Call ID and timestamp","Observed versus expected result","Evidence from the failing layer","The change already tested"],"actions":[{"title":"Try the right assistant first","instruction":"Use the support assistant for documentation questions. For AI Agents, use Build with AI because the AI Assistant can inspect, simulate, edit, and run tests."},{"title":"Choose severity by impact","instruction":"Open Help Center → Contact support and select Low, Medium, High, or Urgent based on the real service impact. Premium support customers should use the Service Portal."},{"title":"Attach the exact evidence","instruction":"Include Call ID, timestamp and time zone, numbers, connection/agent/Flow name, exact status, relevant SIP Ladder or logs, and what you already tried."},{"title":"Share content deliberately","instruction":"Transcript sharing is enabled per bot connection. AI agent log sharing is account-wide. Recordings have no standing-access switch and must be sent manually."},{"title":"Never send secrets","instruction":"Do not include passwords, API keys, client secrets, or bearer tokens in the case."}],"success":["The ticket has a clear impact and severity","The exact identifiers and evidence are attached","No secrets or unrelated call content were shared"],"troubleshooting":[{"problem":"The recording or transcript may expire","fix":"Download anything the investigation depends on before its retention period ends."},{"problem":"You are unsure what to share","fix":"Start with metadata and the smallest relevant excerpt. Add call content only when it is needed for the investigation."}],"docUrl":"https://techdocs.audiocodes.com/livehub/#LiveHub/byoc_cloud_managing_help.htm?TocPath=Help%2520%2526%2520support%2520options%257C_____0"}],"bot-connect":[{"id":"bot-choose-framework","title":"Choose the connection that fits your bot","objective":"Identify the correct framework and collect only the credentials that connection requires.","duration":"5 min","path":["Bot connections","Add new voice bot connection"],"architecture":["Existing bot","Bot connection","Speech","Live Hub call"],"before":["A published or reachable bot","Administrator access to its platform","The intended Live Hub account and region"],"actions":[{"title":"Name the framework","instruction":"Choose Live Hub AI Agent, AudioCodes Bot API, Copilot Studio, Microsoft Bot Framework, Dialogflow CX or ES, Google CX Agent Studio, Amazon Lex, RASA, or Additional bot frameworks."},{"title":"Collect the matching credentials","instruction":"Use only the credential set required by that framework. For example, Bot Framework uses a Direct Line secret; Amazon Lex uses AWS access credentials."},{"title":"Confirm speech ownership","instruction":"Dialogflow supplies its own speech services. Most other frameworks require you to select STT and TTS in Live Hub."},{"title":"Write the test outcome","instruction":"Choose one phrase the bot must understand and one short response it must return before telephony is added."}],"success":["The framework is unambiguous","Required credentials are available","You know whether Live Hub or the framework supplies speech"],"troubleshooting":[{"problem":"Your framework is not listed","fix":"Use Additional bot frameworks only when the bot implements the AudioCodes Bot API. Do not select a visually similar framework."}],"commonMistake":"Beginning the wizard before the bot is published and its exact authentication method is known.","docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Managing%20your%20Bot.htm"},{"id":"bot-create-connection","title":"Connect the bot and give it speech","objective":"Create one voice bot connection and make it ready for a direct test.","duration":"7 min","path":["Bot connections","Add new voice bot connection","Framework"],"architecture":["Caller audio","STT","Bot","TTS","Caller audio"],"before":["The framework decision","Bot credentials","A language and voice","Speech provider credentials when using your own subscription"],"actions":[{"title":"Select the framework","instruction":"Open Bot connections, select Add new voice bot connection, and choose the exact framework."},{"title":"Enter the bot details","instruction":"Add the requested endpoint, environment, region, secret, or authentication fields from the bot platform."},{"title":"Select STT and TTS","instruction":"Choose a speech-to-text service, language, text-to-speech service, and matching voice unless the framework supplies its own speech."},{"title":"Create the connection","instruction":"Save it, then reopen Details and Settings to confirm the name, framework, region, and speech choices."}],"success":["The bot connection appears in Bot connections","Its framework and region are correct","Speech services match the intended language"],"troubleshooting":[{"problem":"The connection cannot authenticate","fix":"Verify the framework-specific credential at its source. Do not rotate several secrets at once."},{"problem":"A speech service is missing","fix":"Add your subscription under Speech providers first, or select an available AudioCodes-provided service."}],"commonMistake":"Choosing a voice whose locale does not match the speech-to-text language.","docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Managing%20your%20Bot.htm"},{"id":"bot-test-before-routing","title":"Prove the bot before routing a call","objective":"Separate bot and speech quality from phone-channel and routing problems.","duration":"6 min","path":["Bot connections","Connection card","Test call"],"architecture":["Browser","Bot connection","Bot response","Evidence"],"before":["A saved bot connection","Browser microphone permission","One known question and expected answer"],"actions":[{"title":"Open the direct test","instruction":"Use the phone icon on the bot connection and confirm the correct microphone and speaker."},{"title":"Run the known scenario","instruction":"Say the prepared phrase and listen for the expected short answer."},{"title":"Check turn taking","instruction":"Verify silence detection, interruption behavior, and DTMF only if the bot uses them."},{"title":"Enable only needed features","instruction":"After the baseline works, use Features for transcript, recording, transfer, background music, or failover."}],"success":["The direct browser call connects","The bot understands the known phrase","The expected response is spoken clearly"],"troubleshooting":[{"problem":"The bot works in text but not voice","fix":"Inspect microphone permission, STT language, recognized text, TTS voice, and speech latency before touching routing."}],"commonMistake":"Creating a phone route before the direct bot test passes.","docUrl":"https://techdocs.audiocodes.com/livehub/#LiveHub/Testing%20your%20Bot.htm?TocPath=Bot%2520connectivity%257C_____7"}],"speech-provider":[{"id":"speech-choose-provider","title":"Choose speech for one real conversation","objective":"Pick STT and TTS by language, latency, voice, compliance, and ownership—not by brand familiarity.","duration":"5 min","path":["Speech providers"],"architecture":["Caller audio","STT","Bot text","TTS","Caller"],"before":["Target language and locale","Latency target","Preferred voice","Decision to use AudioCodes billing or your own provider subscription"],"actions":[{"title":"Define the call","instruction":"Write the language, accent, expected noise level, and whether callers interrupt frequently."},{"title":"Choose STT","instruction":"Select a provider and model that support the locale and turn-taking behavior. Current options include Microsoft, Google, Deepgram, Soniox, ElevenLabs, Speechmatics, OpenAI, and custom integration choices."},{"title":"Choose TTS","instruction":"Select a provider and voice that support the same locale. Keep the first test to one voice."},{"title":"Choose ownership","instruction":"Use an included service when available, or add your provider account when policy, region, features, or commercial terms require it."}],"success":["One STT model and one TTS voice are selected","Both support the target locale","The ownership and billing choice is understood"],"troubleshooting":[{"problem":"There are too many provider options","fix":"Use one caller locale, one expected environment, and one latency goal to create a shortlist. Move model tables to Expert Reference."}],"docUrl":"https://techdocs.audiocodes.com/livehub/Content/VAIG_Combined/Managing%20Speech%20Services.htm"},{"id":"speech-add-provider","title":"Add your provider safely","objective":"Create a reusable speech provider without exposing credentials or mixing environments.","duration":"6 min","path":["Speech providers","Add speech provider"],"architecture":["Provider account","Authentication key","Live Hub provider","Bot connection"],"before":["Provider endpoint or region","Authentication key","A name that identifies vendor and environment"],"actions":[{"title":"Select the vendor","instruction":"Open Speech providers, add a provider, and choose the exact vendor or Custom integration."},{"title":"Name the environment","instruction":"Use a name such as Deepgram-Production-EU so builders do not select a test subscription by mistake."},{"title":"Enter secure fields","instruction":"Add the authentication key, endpoint, host, region, or account fields requested by that vendor. Never place a key in the description."},{"title":"Create and reopen","instruction":"Save the provider and confirm its displayed vendor, region, and purpose."}],"success":["The provider appears in Speech providers","Its name identifies vendor and environment","No secret appears in notes or screenshots"],"troubleshooting":[{"problem":"Authentication fails","fix":"Verify the key, endpoint, subscription region, and provider permissions at the source. Rotate only the affected credential."}],"commonMistake":"Using one ambiguous provider name for test and production credentials.","docUrl":"https://techdocs.audiocodes.com/livehub/Content/VAIG_Combined/Managing%20Speech%20Services.htm"},{"id":"speech-prove-quality","title":"Prove recognition, voice, and latency","objective":"Use one repeatable call to decide whether the speech configuration is ready.","duration":"7 min","path":["Bot connections","Settings","Test call","Calls"],"architecture":["Known phrase","Transcript","Spoken answer","Latency evidence"],"before":["A bot connection using the provider","A 20-second script with a name, number, and interruption"],"actions":[{"title":"Attach the provider","instruction":"Edit the bot connection and choose the new STT or TTS provider, model, language, and voice."},{"title":"Run the same script","instruction":"Say the prepared phrase naturally, include the name and number, and interrupt one response."},{"title":"Compare speech evidence","instruction":"Check the recognized transcript against what was said and listen for pronunciation, pace, and interruption behavior."},{"title":"Read latency","instruction":"Open the call and compare STT, bot, and TTS delay. Tune only the stage that is slow or inaccurate."}],"success":["The transcript matches the important words","The voice matches the locale","You can identify the slowest stage from call evidence"],"troubleshooting":[{"problem":"The whole call feels slow","fix":"Use the separate STT, bot, and TTS timing before changing models. The slowest measured stage owns the first experiment."}],"commonMistake":"Changing STT, TTS, and the bot model in one test, which makes the improvement impossible to attribute.","docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Calls.htm"}],"click-to-call":[{"id":"web-call-create-channel","title":"Create the web calling channel","objective":"Create one Click-to-call connection for a controlled browser test.","duration":"6 min","path":["Voice channels","SIP connections","Add new SIP connection"],"architecture":["Web page","WebRTC","Click-to-call connection","Live Hub"],"before":["A test web page","The target Live Hub region","A destination bot or voice service"],"actions":[{"title":"Choose the correct provider type","instruction":"Create a SIP connection with Provider type set to Client Applications and Provider set to Click-to-Call (WebRTC)."},{"title":"Name and locate it","instruction":"Use a clear environment name and the same region as the destination and future routing rule."},{"title":"Choose authentication","instruction":"Prefer short-lived authentication codes. Use fixed credentials only when your architecture and security review require them."},{"title":"Create the connection","instruction":"Save it and record the connection details needed by the widget or SDK."}],"success":["A Click-to-call connection exists","Its region matches the destination","The authentication method is intentional"],"troubleshooting":[{"problem":"You created a Generic SIP trunk","fix":"Recreate it under Client Applications → Click-to-Call (WebRTC); a carrier trunk is a different channel."}],"docUrl":"https
