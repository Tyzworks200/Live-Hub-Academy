":"Approving the first Meta business shown without verifying the business and phone number names.","docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/buy-whats-app-number.htm"},{"id":"whatsapp-route-call","title":"Route and prove a WhatsApp call","objective":"Make one WhatsApp voice call reach the intended AI or voice destination.","duration":"6 min","path":["Routing","Routing Rules","Add new routing rule"],"architecture":["WhatsApp caller","WhatsApp number","Route","Bot","Calls"],"before":["A ready WhatsApp number","A ready bot or voice destination","One WhatsApp-enabled test phone"],"actions":[{"title":"Create the route","instruction":"Choose the WhatsApp number as the Call origin and select the intended bot or destination under Route To."},{"title":"Keep services off","instruction":"Use a clean baseline before adding recording, translation, transfer behavior, or Agent Assist."},{"title":"Place the call","instruction":"Call from WhatsApp, complete the known scenario, and end normally."},{"title":"Inspect evidence","instruction":"Open Calls and confirm the origin, matched route, destination, completion status, and transcript when enabled."}],"success":["The WhatsApp call reaches the intended destination","The call appears in Calls","The route and result are understandable from evidence"],"troubleshooting":[{"problem":"The call reaches Live Hub but audio fails","fix":"Check codec and media evidence, region, and the call record before changing Meta authorization."}],"docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/buy-whats-app-number.htm"}],"outbound":[{"id":"outbound-enable","title":"Prepare one safe outbound call","objective":"Enable dialout with the correct plan, API identity, bot, and limits.","duration":"7 min","path":["Bot connections","Edit","Outbound Calling"],"architecture":["Dialer","Live Hub","Voice channel","Person","Bot"],"before":["A ready bot connection","A controlled destination number","A SIP connection or enabled AudioCodes-supplied calling number","Permission to create an API client"],"actions":[{"title":"Check the voice channel","instruction":"Choose the SIP connection or calling number Live Hub will use. AudioCodes-supplied outbound PSTN calling requires an Essential plan and AudioCodes enablement."},{"title":"Open Outbound Calling","instruction":"Edit the bot connection and select its Outbound Calling tab."},{"title":"Create the API client","instruction":"Use Create API client and copy the client ID and secret immediately; the secret is not shown again."},{"title":"Set only needed options","instruction":"Choose whether recognition starts on connect and whether the bot receives the dialout initiated event."}],"success":["Outbound Calling is enabled on the intended bot","The API client secret is stored safely","The channel and account are eligible for the test"],"troubleshooting":[{"problem":"Outbound PSTN is unavailable","fix":"Confirm the Essential plan, positive balance, and AudioCodes enablement for supplied numbers. Adding credit alone does not enable it."}],"commonMistake":"Assuming an Essential plan automatically enables outbound PSTN through AudioCodes-supplied numbers.","docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/byoc_Outbound%20Call.htm"},{"id":"outbound-route","title":"Create the outbound route","objective":"Tell Live Hub which channel places calls requested by this bot.","duration":"5 min","path":["Routing","Routing Rules","Add new routing rule"],"architecture":["Bot connection","Routing rule","SIP or number","Destination"],"before":["The enabled bot connection","A ready outbound voice channel","An agreed target-number format"],"actions":[{"title":"Start with the bot","instruction":"Create a Call rule and select the bot connection as Call origin."},{"title":"Select the calling channel","instruction":"Route to the SIP connection that places the call or the phone number Live Hub should call from."},{"title":"Match the number format","instruction":"Use the target format expected by the carrier or channel, normally tel:+ followed by E.164 digits for the API request."},{"title":"Save and read it back","instruction":"Confirm the rule says: calls initiated by this bot leave through this exact channel."}],"success":["The bot is the route origin","The intended outbound channel is the destination","The target number format is known"],"troubleshooting":[{"problem":"The request is accepted but no call leaves","fix":"Check that the outbound route exists, the bot matches the request, and the destination channel is ready."}],"docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/byoc_Outbound%20Call.htm"},{"id":"outbound-trigger-prove","title":"Trigger and prove the dialout","objective":"Place one controlled API call and follow it from request to final status.","duration":"8 min","path":["Dialout API","POST /api/v1/actions/dialout"],"architecture":["POST dialout","Call ID","Phone answers","Bot","Final status"],"before":["API client ID and secret","Bot connection ID","Controlled target in tel:+ format","The saved route"],"actions":[{"title":"Use the right authentication","instruction":"Call POST /api/v1/actions/dialout with HTTP Basic authentication. This endpoint does not use the OAuth bearer token used by the main REST API."},{"title":"Send the minimum body","instruction":"Provide the bot connection ID and target URI, such as tel:+123456789. Add metadata only after the baseline works."},{"title":"Run the portal test too","instruction":"Use Test Outbound Call on the bot connection to separate API-client problems from route or carrier problems."},{"title":"Follow the evidence","instruction":"Record the returned call ID and conversation ID, then inspect Call History and any configured status notifications."}],"success":["The API request returns an identifier","The controlled phone rings","The bot handles the answered call","A final call status is visible"],"troubleshooting":[{"problem":"The API returns 401"," ted, failed, or otherwise resolved targets."},{"title":"Open failed targets","instruction":"For each failure type, open the related call record and identify whether the first issue is API, routing, carrier, answer detection, or bot behavior."},{"title":"Decide whether to scale","instruction":"Expand the audience only after the pilot's success rate, call experience, retry behavior, and evidence meet the agreed gate."}],"success":["The pilot completes","Every failed target has an understood status","A clear go, tune, or stop decision is recorded"],"troubleshooting":[{"problem":"Many targets fail at once","fix":"Pause or lock the campaign, inspect the first shared failure, and correct the common layer before retrying."}],"docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Campaign-Dialer.htm"}],"call-features":[{"id":"features-evidence","title":"Choose the evidence each call should produce","objective":"Enable transcripts and recordings deliberately, with plan and retention understood.","duration":"6 min","path":["Bot connections","Edit","Features"],"architecture":["Call","Transcript or recording","Retention","Authorized user"],"before":["A bot connection","Privacy approval","Required retention period","An Essential plan when recording is needed"],"actions":[{"title":"Choose transcript or recording","instruction":"Use transcripts when searchable conversation text is enough. Add recording only when the audio itself is required."},{"title":"Enable per bot","instruction":"Turn on Call Transcript and the required Call Recording mode in the bot connection's Features tab."},{"title":"Confirm retention","instruction":"The manual's defaults are seven days for transcripts and thirty days for recordings; verify the account settings that apply to your deployment."},{"title":"Place one test call","instruction":"Open Call History and confirm the expected artifact appears and is accessible to the intended user."}],"success":["The right evidence is enabled","Retention and plan requirements are understood","A test call produces the expected artifact"],"troubleshooting":[{"problem":"A recording is missing","fix":"Confirm the Essential plan, recording mode, matched bot or route, completed call, permissions, and retention window."}],"commonMistake":"Enabling recording everywhere without a privacy purpose, access model, or retention decision.","docUrl":"https://techdocs.audiocodes.com/livehub/#LiveHub/byoc_Call%20Transcript.htm?TocPath=Bot%2520connectivity%257CManage%2520%2520features%257C_____1"},{"id":"features-transfer","title":"Transfer a caller without losing context","objective":"Configure one supported transfer path and prove the destination receives the expected call and context.","duration":"8 min","path":["Bot connections","Edit","Features","Call transfer"],"architecture":["Caller","Bot","Transfer","Human destination","Transfer evidence"],"before":["A verified transfer destination","Provider support for INVITE or REFER","The context or SIP headers the human side needs"],"actions":[{"title":"Choose the transfer method","instruction":"Match INVITE or REFER to the SIP provider or contact center's supported behavior."},{"title":"Configure the target","instruction":"Set the destination number or routing behavior and add only approved custom SIP headers."},{"title":"Handle failure","instruction":"Define what the bot should do when transfer setup fails or the destination cannot accept the call."},{"title":"Run the full test","instruction":"Start with a real caller, trigger transfer, verify the human side receives the call and context, then inspect all related call records."}],"success":["The transfer reaches the intended destination","Required context arrives","Failed transfer behavior is safe and understandable"],"troubleshooting":[{"problem":"The transfer starts but does not complete","fix":"Inspect the transfer call record and SIP Ladder, then compare INVITE or REFER behavior with the provider requirement."}],"docUrl":"https://te on":"Use https://livehub.audiocodes.io with the /api/v1/ path for the standard management and monitoring resources."},{"title":"Expect expiry","instruction":"Request a new token when it expires. Do not treat token refresh as a configuration failure."}],"success":["A token is returned","A protected API request succeeds","No secret or token appears in a URL or saved evidence"],"troubleshooting":[{"problem":"The token request returns 401","fix":"Verify the client ID, current client secret, account, and client state. Do not use the dialout Basic-auth pattern here."}],"commonMistake":"Confusing standard REST API bearer authentication with the Dialout API's HTTP Basic authentication.","docUrl":"https://techdocs.audiocodes.com/livehub/#LiveHub/API/api-security.htm?TocPath=REST%2520API%257C_____2"},{"id":"api-prove-calls","title":"Retrieve one call and prove automation works","objective":"Use a small read-only request to validate authentication, access, filtering, and response handling.","duration":"8 min","path":["GET /api/v1/calls"],"architecture":["GET calls","Filter","Call record","Call ID","Automation proof"],"before":["A valid bearer token","One recent test-call timestamp or number","Call-data read permission"],"actions":[{"title":"Request a small collection","instruction":"Call GET /api/v1/calls with conservative pagination instead of retrieving the full history."},{"title":"Filter the test","instruction":"Use the documented filtering, pagination, sorting, or free-text conventions to locate the known call."},{"title":"Read one record","instruction":"Capture its identifiers, calling and called entities, timing, outcome, and performance fields."},{"title":"Handle empty and denied states","instruction":"Distinguish no matching data from 401 authentication, 403 authorization, rate limits, and server errors."}],"success":["The known call is returned","Pagination and filtering are bounded","The integration handles empty and error responses distinctly"],"troubleshooting":[{"problem":"The portal shows the call but the API does not","fix":"Check account, token permissions, filter syntax, time zone, pagination, and whether personal-data visibility affects the fields you expect."}],"docUrl":"https://techdocs.audiocodes.com/livehub/#LiveHub/API/REST-API-VoiceAI-Connect-Cloud.htm?TocPath=REST%2520API%257C_____0"}],"account-admin":[{"id":"account-choose-model","title":"Choose the right account structure","objective":"Use standalone, parent, and subaccount models intentionally before production objects multiply.","duration":"6 min","path":["Current account","Create account or Subaccounts"],"architecture":["Organization","Parent or standalone","Subaccounts","Services and billing"],"before":["Who owns the service","Whether you operate for customers","Who pays","Who needs isolation"],"actions":[{"title":"Choose standalone","instruction":"Use a standalone account when one organization operates and pays for its own Live Hub environment."},{"title":"Choose parent and subaccounts","instruction":"Use a parent account when a provider or central team manages separate customer or business accounts beneath it."},{"title":"Define ownership","instruction":"For every account, record who administers configuration, who pays, and who may view call content."},{"title":"Switch deliberately","instruction":"After switching accounts, recheck the Current account banner before creating or editing anything."}],"success":["The account type matches the operating model","Administration and billing owners are known","Isolation boundaries are documented"],"troubleshooting":[{"problem":"A resource appears missing","fix":"Check Current account first. Resources belong to the account in which they were created."}],"commonMistake":"Creating additional accounts to organize objects before deciding whether isolation, billing, or delegated administration is actually required.","docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Account%20and%20Sign%20Up.htm"},{"id":"account-plan-billing","title":"Keep the account active and billable","objective":"Understand plan state, balance, outbound enablement, and billing ownership before calls reach production.","duration":"7 min","path":["Billing","Settings","Account details"],"architecture":["Plan","Balance or usage","Active account","Working calls"],"before":["Current plan and billing model","Billing owner","Expected call volume","Required outbound capabilities"],"actions":[{"title":"Identify Trial or Essential","instruction":"A first account starts on Trial. Adding enough credit for a positive balance upgrades it to Essential, but does not by itself enable outbound PSTN through AudioCodes-supplied numbers."},{"title":"Read prepaid or postpaid","instruction":"Prepaid accounts show Account Balance; postpaid accounts show Monthly Usage. Open Billing for the detailed report."},{"title":"Protect continuity","instruction":"An account becomes inactive at zero or negative balance. Configure auto-recharge or the appropriate billing process before production traffic."},{"title":"Review reports","instruction":"Use monthly reports and CSV export to reconcile usage by service without hard-coding prices into the Academy."}],"success":["The plan and billing model are known","A billing owner is assigned","The account has a process that prevents accidental inactivity"],"troubleshooting":[{"problem":"Many unrelated services stop together","fix":"Check account state and balance before diagnosing bots, SIP, or routing individually."}],"commonMistake":"Treating a broad service failure as a technical outage before checking whether the account is inactive.","docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/billing.htm"},{"id":"account-access-privacy","title":"Protect access and call data","objective":"Apply least privilege, retention, and support-sharing choices before real customer conversations arrive.","duration":"8 min","path":["Access control (IAM)","Settings","Advanced"],"architecture":["User or API client","Group and policy","Call data","Retention and sharing"],"before":["Named users and systems","Required roles","Recording and transcript policy","Support-sharing approval"],"actions":[{"title":"Assign groups intentionally","instruction":"Place users and API clients in the smallest predefined or custom groups that grant their actual work."},{"title":"Require strong sign-in","instruction":"Use MFA and your approved identity method. Separate human users from system API clients."},{"title":"Set data visibility and retention","instruction":"Configure personal-data visibility plus recording and transcript retention according to policy and investigation needs."},{"title":"Share only during support work","instruction":"Transcript sharing is per bot connection; AI agent log sharing is account-wide. Recordings must be sent manually."}],"success":["Every identity has an intentional access group","Retention matches policy","Support sharing is off unless an investigation requires it"],"troubleshooting":[{"problem":"A user cannot see a screen","fix":"Confirm account membership and group policy before adding a second user or granting administrator access."}],"commonMistake":"Granting administrator access to solve a single missing permission.","docUrl":"https://techdocs.audiocodes.com/livehub/#LiveHub/users-introduction.htm?TocPath=User%2520access%2520%2526%2520permissions%257C_____1"}]},"knowledgeQuestions":[{"id":"generic-sip","question":"Your SIP trunk or contact center is not in the provider list. What should you do?","options":["Choose the matching Generic SIP option and use provider-supplied settings","Choose a similar provider template and change its name","Stop—the provider cannot be connected to Live Hub","Create a routing rule before creating the connection"],"correctIndex":0,"explanation":"Use Generic SIP Trunk, Generic Contact Center, or Generic UC for an unlisted provider. Generic setup requires the real transport, authentication, address, and number-format requirements from that provider.","sourceUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/sip_connections.htm"},{"id":"debug-call","question":"A call from a SIP trunk to a bot fails. What is the strongest first investigation?","options":["Recreate the bot and trunk immediately","Check SIP connectivity, the matched route, the call record, SIP ladder, and transcript or AI logs","Ask only the external SIP provider","Open a ticket without a Call ID"],"correctIndex":1,"explanation":"Follow the call through each layer. The exact Calls record shows how it ended; the matched route, SIP ladder, transcript, and AI logs show where the first failure occurred.","sourceUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Calls.htm"},{"id":"support-evidence","question":"Which information makes a Live Hub support request investigation-ready?","options":["Only the account name","Only a screenshot of the error","Issue and impact, timestamp, account ID, Call or Session ID, plus relevant evidence","No details are needed because support can see all call content"],"correctIndex":2,"explanation":"Precise identifiers let support find the right event. Include only relevant recordings, transcripts, or logs, because support does not automatically have standing access to every call artifact.","sourceUrl":"https://techdocs.audiocodes.com/livehub/#LiveHub/byoc_cloud_managing_help.htm?TocPath=Help%2520%2526%2520support%2520options%257C_____0"},{"id":"public-addresses","question":"Where do you find the Live Hub addresses and certificate for a SIP connection?","options":["In the Billing page","In the SIP connection Info view","Inside every routing rule","Only by requesting them from engineering"],"correctIndex":1,"explanation":"The SIP connection Info view contains its FQDN, signaling and media addresses, certificate, limits, and available REGISTER or OPTIONS troubleshooting tools.","sourceUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/sip_connections.htm"},{"id":"routing-conditions","question":"When should you add calling-number or called-number conditions to a routing rule?","options":["When calls from the same origin must reach different destinations","To change the account password","To enable a speech provider","Conditions are never needed"],"correctIndex":0,"explanation":"Conditions narrow the match. Start with one exact test number; introduce prefixes or wildcards only after the baseline call works.","sourceUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Defining%20Routing.htm"},{"id":"routing-order","question":"Why does routing-rule order matter?","options":["It changes only how the table looks","A broad rule can match before the more specific rule you intended","It matters only for deleted rules","Live Hub always ignores broad rules"],"correctIndex":1,"explanation":"Put exact and narrow rules before broad prefix or catch-all rules so the intended path is evaluated first.","sourceUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Defining%20Routing.htm"},{"id":"number-format","question":"A provider expects numbers without the + prefix. Where should you align that format?","options":["The SIP connection Numbers tab","The user profile","The AI Agent prompt","The billing report"],"correctIndex":0,"explanation":"Configure the provider's required E.164 presentation and national format on the SIP connection. Confirm the actual calling and called values in the SIP ladder.","sourceUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/adding-generic-sip-connection.htm"},{"id":"two-directions","question":"You need calls to travel both from a bot to SIP and from SIP to the bot. What is the clean setup?","options":["One catch-all rule with no origin","Two explicit rules—one for each direction","A single phone number with no routing","Two copies of the same rule"],"correctIndex":1,"explanation":"Each direction has a different origin and destination. Create and test each rule independently before adding optional services.","sourceUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Defining%20Routing.htm"},{"id":"red-sip-status","question":"Registration or keep-alive is enabled and the SIP connection turns red. What next?","options":["Change every Advanced setting","Delete the connection","Open SIP Info and inspect the last REGISTER or OPTIONS ladder","Add a second routing rule"],"correctIndex":2,"explanation":"The response to REGISTER or OPTIONS identifies the first signaling failure. Check address, port, transport, credentials, firewall, and the provider response before changing configuration.","sourceUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/sip_connections.htm"},{"id":"prove-sip-first","question":"What should you prove before combining a new SIP connection with routing?","options":["That the connection card exists","A direct controlled test and understandable evidence in Calls","That every optional codec is enabled","That a broad wildcard rule is active"],"correctIndex":1,"explanation":"A saved object is not proof. Run the smallest direct test available and understand its completion status and SIP ladder before adding another layer.","sourceUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/sip_connections.htm"},{"id":"call-or-transfer","question":"What does the Type field decide in a routing rule?","options":["Whether the rule begins with a new call or a transfer event","Whether the account is prepaid or postpaid","Which speech model the bot uses","Which user group can sign in"],"correctIndex":0,"explanation":"Type determines the event that triggers the rule. It also changes Call Origin to Transferred by and affects which services are available.","sourceUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Defining%20Routing.htm"},{"id":"advanced-bot","question":"What belongs in a bot connection's Advanced settings?","options":["Every configuration value, even when Live Hub has a dedicated field","Framework-specific configuration that does not have a dedicated Live Hub setting","SIP provider credentials","Teams user licenses"],"correctIndex":1,"explanation":"Use dedicated Live Hub fields where they exist. Advanced settings are for supported framework-specific properties that do not have their own product control.","sourceUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/byoc_cloud_managing_features.htm"}],"TECH_DOCS":{"home":"https://techdocs.audiocodes.com/livehub/#LiveHub/AudioCodes%20Live%20Hub.htm?TocPath=_____1","signIn":"https://techdocs.audiocodes.com/livehub/#LiveHub/signing-into-livehub.htm?TocPath=_____3","userInterface":"https://techdocs.audiocodes.com/livehub/#LiveHub/User-Interface.htm?TocPath=_____4","accountPlans":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/User%20Account%20Plans.htm","accountTypes":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Accounts-types.htm","accounts":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Account%20and%20Sign%20Up.htm","dashboard":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Live%20Hub%20Dashboard.htm","quickSetupWizard":"https://techdocs.audiocodes.com/livehub/#LiveHub/Configuration%20Wizard.htm?TocPath=_____24","botConnections":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Managing%20your%20Bot.htm","speechProviders":"https://techdocs.audiocodes.com/livehub/Content/VAIG_Combined/Managing%20Speech%20Services.htm","aiAgent":"https://techdocs.audiocodes.com/livehub/#AI-Agents/Add%20an%20AI%20Agent.htm?TocPath=AI%2520Agents%257CAgents%257C_____1","aiAssistant":"https://techdocs.audiocodes.com/livehub/#AI-Agents/AI%20Assistant.htm?TocPath=AI%2520Agents%257C_____24","aiTools":"https://techdocs.audiocodes.com/livehub/#AI-Agents/Tools.htm?TocPath=AI%2520Agents%257CTools%257C_____0","agentAssistMode":"https://techdocs.audiocodes.com/livehub/#AI-Agents/Agent%20assist%20mode.htm?TocPath=AI%2520Agents%257CAgent%2520assist%2520mode%257C_____0","botFeatu techdocs.audiocodes.com/livehub/Content/LiveHub/Agent%20assist.htm","translation":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Voice-translation.htm","translationCreate":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Create-Voice-translation.htm","translationAutomatic":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Configure-automatic-translation.htm","translationDynamic":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Configure-dynamic-translation.htm","outboundCalling":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/byoc_Outbound%20Call.htm","outboundAutomation":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Campaign-Dialer.htm","callHistory":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Calls.htm","callTranscript":"https://techdocs.audiocodes.com/livehub/#LiveHub/byoc_Call%20Transcript.htm?TocPath=Bot%2520connectivity%257CManage%2520%2520features%257C_____1","callRecording":"https://techdocs.audiocodes.com/livehub/#LiveHub/Call-Recording-workflow.htm?TocPath=_____22","callTransfer":"https://techdocs.audiocodes.com/livehub/#LiveHub/byoc_Call%20Transfer.htm?TocPath=Bot%2520connectivity%257CManage%2520%2520features%257C_____5","statistics":"https://techdocs.audiocodes.com/livehub/#LiveHub/Statistics.htm?TocPath=_____18","alarms":"https://techdocs.audiocodes.com/livehub/#LiveHub/Vewing%20Alarms.htm?TocPath=Alarm%2520%2526%2520alerts%2520management%257C_____0","alarmThresholds":"https://techdocs.audiocodes.com/livehub/#LiveHub/Define-alarm-thresholds.htm?TocPath=Alarm%2520%2526%2520alerts%2520management%257C_____3","alarmNotifications":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Configure-alarm-notification.htm","billing":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/billing.htm","userGroups":"https://techdocs.audiocodes.com/livehub/#LiveHub/users-introduction.htm?TocPath=User%2520access%2520%2526%2520permissions%257C_____1","apiClients":"https://techdocs.audiocodes.com/livehub/#VAIC/api-introduction.htm?TocPath=User%2520access%2520%2526%2520permissions%257CAPI%2520Clients%257C_____0","restApi":"https://techdocs.audiocodes.com/livehub/#LiveHub/API/REST-API-VoiceAI-Connect-Cloud.htm?TocPath=REST%2520API%257C_____0","restAuthentication":"https://techdocs.audiocodes.com/livehub/#LiveHub/API/api-security.htm?TocPath=REST%2520API%257C_____2","support":"https://techdocs.audiocodes.com/livehub/#LiveHub/byoc_cloud_managing_help.htm?TocPath=Help%2520%2526%2520support%2520options%257C_____0","releaseNotes":"https://techdocs.audiocodes.com/livehub/#LiveHub/release-notes.htm?TocPath=_____28"},"troubleshooting":[{"id":"401-unauthorized","section":"Calling","title":"401 Unauthorized","status":["401 Unauthorized"],"statusVerified":false,"type":"Protocol Result","investigate":"Multiple Possible Sources","actionability":"Sometimes self-service","meaning":"A SIP request was rejected because authentication was missing, invalid, or expired.","causes":["SIP trunk or connection credentials are incorrect or out of date","Digest authentication challenge/response did not complete correctly"],"actions":["Open the affected call in Calls → Call History and review the SIP Ladder to see which side issued the 401.","Verify the SIP connection's authentication settings under Voice Channels → SIP Connections.","Confirm the credential configured in Live Hub matches what the receiving system expects."],"escalate":"Contact AudioCodes if the SIP Ladder shows Live Hub sent correct credentials and the far end still rejected the request, or if you cannot determine which side issued the 401.","evidence":["Call ID","Timestamp and time zone","Calling and called number","SIP Ladder excerpt"],"related":"403 Forbidden, 407 Proxy Authentication Required"},{"id":"403-forbidden","section":"Calling","title":"403 Forbidden","status":["403 Forbidden"],"statusVerified":false,"type":"Protocol Result","investigate":"Multiple Possible Sources","actionability":"Sometimes self-service","meaning":"A SIP request was understood but rejected as forbidden. This is a protocol result, not a definitive diagnosis — it can be returned by Live Hub, Microsoft Teams, a carrier, a SIP trunk, or a remote SBC depending on configured policy.","causes":["The source IP, trunk, or number is not on the receiving system's allow-list","A policy or routing restriction is blocking the request","The receiving system's own access control rejected it"],"actions":["Review the SIP Ladder in Calls → Call History to identify which side returned the 403.","Check the relevant routing rule under Routing → Routing Rules for reject conditions.","If the far end is a carrier or SIP trunk, confirm the source is authorized on their side."],"escalate":"Contact AudioCodes if the SIP Ladder confirms Live Hub sent a valid request and the far end still returned 403, or if you cannot determine which side generated the response.","evidence":["Call ID","Timestamp and time zone","Calling and called number","SIP Ladder excerpt"],"related":"401 Unauthorized, SIP Provider Rejected Call"},{"id":"407-proxy-authentication-required","section":"Calling","title":"407 Proxy Authentication Required","status":["407 Proxy Authentication Required"],"statusVerified":false,"type":"Protocol Result","investigate":"Carrier / PSTN","actionability":"Sometimes self-service","meaning":"The SIP proxy (commonly a carrier trunk) is requesting authentication before it will process the request.","causes":["Proxy authentication credentials are incorrect or outdated","The authentication challenge/response cycle did not complete correctly"],"actions":["Review the SIP Ladder for the affected call to see the 407 challenge and whether a response followed.","Verify the trunk's authentication configuration under Voice Channels → SIP Connections."],"escalate":"Contact AudioCodes if credentials appear correct and the challenge is still failing.","evidence":["Call ID","Timestamp and time zone","SIP Ladder excerpt"],"related":"401 Unauthorized"},{"id":"404-not-found","section":"Calling","title":"404 Not Found","status":["404 Not Found"],"statusVerified":true,"type":"Protocol Result","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"The destination address could not be resolved to a valid endpoint.","causes":["The dialed number isn't provisioned or is mistyped","No routing rule matches this destination","The number was recently ported or reassigned"],"actions":["Open Routing → Routing Rules and confirm a rule exists that matches the called number.","Confirm the destination number is correctly assigned under Voice Channels.","Check for recent number porting or reassignment."],"escalate":"Contact AudioCodes if a matching routing rule and correctly assigned number both exist and the call still returns 404.","evidence":["Call ID","Timestamp and time zone","Called number"],"related":"No Matching Route"},{"id":"408-request-timeout","section":"Calling","title":"408 Request Timeout","status":["408 Request Timeout"],"statusVerified":true,"type":"Protocol Result","investigate":"Carrier / PSTN","actionability":"Sometimes self-service","meaning":"The destination did not respond to the call request within the time SIP allows, so Live Hub treated the attempt as failed.","causes":["Network issue between Live Hub and the destination","The SIP trunk or destination system was unreachable","Carrier-side congestion or outage"],"actions":["Check Alarms and Alarm History for related connectivity warnings.","Retry the call and note whether the timeout is consistent or intermittent.","Review the SIP Ladder to confirm no response was received."],"escalate":"Contact AudioCodes if the timeout is consistent, affects multiple destinations, or coincides with an active alarm.","evidence":["Call ID","Timestamp and time zone","Called number","Whether other destinations are also affected"],"related":"503 Service Unavailable"},{"id":"480-temporarily-unavailable","section":"Calling","title":"480 Temporarily Unavailable","status":["480 Temporarily Unavailable","480 Temporarily not available","480 Temporarily Not Available"],"statusVerified":true,"type":"Protocol Result","investigate":"Multiple Possible Sources","actionability":"Usually self-service","meaning":"The destination is currently unreachable or not accepting calls. This commonly reflects the destination's own state rather than a Live Hub condition.","causes":["The destination endpoint is registered but not currently responding","Do-not-disturb or similar state is active on the destination"],"actions":["Confirm with the destination party whether their endpoint was available at the time.","Retry the call after a short interval."],"escalate":"Contact AudioCodes only if this occurs consistently for a destination that should be reliably reachable.","evidence":["Call ID","Timestamp and time zone","Called number"],"related":"No Answer"},{"id":"481-call-transaction-does-not-exist","section":"Calling","title":"481 Call/Transaction Does Not Exist","status":["481 Call/Transaction Does Not Exist"],"statusVerified":false,"type":"Protocol Result","investigate":"Live Hub","actionability":"Sometimes self-service","meaning":"A request — often related to a transfer or call update — referenced a call session that the receiving side no longer recognized.","causes":["The call had already ended on one side when the request was sent","A transfer or re-invite was processed after the original session ended (a timing/race condition)"],"actions":["Review the SIP Ladder and Call Details for the affected call to see the sequence of events around the failure.","Check whether a transfer or hold/resume action was in progress at the time."],"escalate":"Contact AudioCodes with the SIP Ladder if the sequence of events doesn't explain the 481.","evidence":["Call ID","Timestamp and time zone","Description of any transfer/hold action involved"],"related":"482 Loop Detected"},{"id":"482-loop-detected","section":"Calling","title":"482 Loop Detected","status":["482 Loop Detected"],"statusVerified":false,"type":"Protocol Result","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"The call request was routed back to a point it had already passed through, forming a loop.","causes":["A routing rule or forwarding configuration is pointing back to itself or an earlier hop","Two routing rules or trunks each point back to the other, so the call bounces between them until Live Hub detects the loop","A carrier-side forwarding setting redirects the call back toward Live Hub instead of on to a different destination"],"actions":["Review Routing → Routing Rules for any rule whose destination could point back toward its own origin.","If the destination is a customer PBX, check its call-forwarding configuration."],"escalate":"Contact AudioCodes if routing rules and forwarding configuration both look correct and the loop persists.","evidence":["Call ID","Timestamp and time zone","Routing rule name if known"],"related":"404 Not Found"},{"id":"484-address-incomplete","section":"Calling","title":"484 Address Incomplete","status":["484 Address Incomplete"],"statusVerified":false,"type":"Protocol Result","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"The dialed number is incomplete or doesn't match the expected format for the routing rule handling it.","causes":["A digit or prefix is missing in the dialed number","The routing rule's number-matching criteria don't align with the number format actually being sent"],"actions":["Compare the actual dialed number against the calling/called-number criteria in the matched routing rule.","Confirm the expected number format (with/without country code) for this route."],"escalate":"Contact AudioCodes if the number format matches the routing rule's criteria and the call still fails with 484.","evidence":["Call ID","Timestamp and time zone","Exact number dialed"],"related":""},{"id":"487-request-terminated","section":"Calling","title":"487 Request Terminated","status":["487 Request Terminated"],"statusVerified":true,"type":"Protocol Result","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"The call attempt was cancelled before it completed — most often because the caller hung up before the destination answered.","causes":["Caller-initiated cancellation before answer","A no-answer timer on the caller’s own device or softphone expired and cancelled the attempt","An upstream system (dialer, contact center, or auto-attendant) cancelled the call based on its own logic before the destination answered"],"actions":["Check Call Details for alert duration — a short alert duration followed by 487 is typically expected caller-cancel behavior."],"escalate":"Contact AudioCodes only if 487 is occurring at an unusually high rate relative to total call volume, which may indicate a different underlying issue.","evidence":["Call ID","Timestamp and time zone"],"related":""},{"id":"488-not-acceptable-here","section":"Calling","title":"488 Not Acceptable Here","status":["488 Not Acceptable Here"],"statusVerified":false,"type":"Protocol Result","investigate":"Multiple Possible Sources","actionability":"Sometimes self-service","meaning":"The far end could not accept the call as offered — commonly a codec or secure-media mismatch.","causes":["No common audio codec between the two sides","A secure media (SRTP) mismatch on a call that requires encryption"],"actions":["Review the SIP Ladder to inspect the SDP offer and answer for the affected call.","Confirm the codec and secure-media settings configured for the relevant voice channel."],"escalate":"Contact AudioCodes with the SIP Ladder if the SDP offer and answer don't reveal an obvious mismatch.","evidence":["Call ID","Timestamp and time zone","SIP Ladder excerpt","Call recording, if one was captured for this call/conversation"],"related":"Codec/Secure Media Mismatch"},{"id":"503-service-unavailable","section":"Calling","title":"503 Service Unavailable","status":["503 Service Unavailable"],"statusVerified":true,"type":"Protocol Result","investigate":"Carrier / PSTN","actionability":"Sometimes self-service","meaning":"The target system — often a carrier or SIP trunk — is currently unable to accept the call.","causes":["Carrier-side outage or maintenance","SBC or trunk overload on the receiving side"],"actions":["Check Alarms and Alarm History for related warnings around the time of the call.","Retry after a short interval and note whether the failure is consistent."],"escalate":"Contact AudioCodes if 503 responses are sustained, affect multiple destinations, or correlate with an active alarm.","evidence":["Call ID","Timestamp and time zone","Called number","Whether other destinations are also affected"],"related":"408 Request Timeout"},{"id":"603-decline","section":"Calling","title":"603 Decline","status":["603 Decline","Call rejected"],"statusVerified":true,"type":"Protocol Result","investigate":"Carrier / PSTN","actionability":"Sometimes self-service","meaning":"The call was actively rejected by the far end, rather than simply timing out or being unreachable.","causes":["Carrier or destination-side reputation/spam filtering","Explicit policy rejection on the receiving side"],"actions":["Check whether this happens consistently for a specific origination number, which may point to number reputation.","Review Routing → Routing Rules to confirm the call isn't being intentionally rejected by a Live Hub rule."],"escalate":"Contact AudioCodes if the call isn't rejected by your own routing configuration and the decline is unexpected or affects multiple destinations.","evidence":["Call ID","Timestamp and time zone","Calling and called number"],"related":""},{"id":"no-answer","section":"Calling","title":"No Answer","status":["Dialout: no answer","No Answer"],"statusVerified":true,"type":"Symptom","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"The destination rang but nobody (or nothing) answered before the call attempt timed out or the caller gave up.","causes":["The destination device was ringing but not picked up","The destination was offline or unreachable","A forwarding loop caused the call to time out before reaching a live endpoint"],"actions":["Confirm with the destination party whether their device was reachable at the time.","If forwarding is configured on the destination, review it for loops or misconfiguration."],"escalate":"Contact AudioCodes only if this occurs for a destination confirmed to be online and available.","evidence":["Call ID","Timestamp and time zone","Called number","Call recording, if one was captured for this call/conversation"],"related":"480 Temporarily Unavailable"},{"id":"busy","section":"Calling","title":"Busy","status":["User busy"],"statusVerified":true,"type":"Expected Event","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"The destination endpoint rejected the call because it was already engaged on another call.","causes":["The line is genuinely in use","A call-waiting or simultaneous-call limit on the destination device was reached, even without the person actively using the line","The destination is a hunt group or queue where every member is currently occupied"],"actions":["If this is unexpected, confirm with the destination whether their line was actually busy at the time."],"escalate":"Contact AudioCodes only if a line reports busy while confirmed to be idle.","evidence":["Call ID","Timestamp and time zone","Called number"],"related":""},{"id":"insufficient-funds-trial-restriction","section":"Calling","title":"Insufficient Funds / Trial Restriction","status":["Credit ended"],"statusVerified":true,"type":"Limit / Entitlement","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"A trial account with zero or negative credit becomes inactive. While inactive, bots and SIP connections cannot handle calls, and some Live Hub resources cannot be managed until the balance becomes positive again.","causes":["The account is on a trial plan and its credit has reached zero or gone negative","A paid account's prepaid balance has been depleted"],"actions":["Check the account's plan and current balance/credit status.","If on trial, review what credit remains and what triggers activation."],"escalate":"Contact AudioCodes if the balance appears positive/active but calling and resource management are still blocked.","evidence":["Account name","Timestamp","Description of the affected functionality"],"related":"Account Inactive — Broad Service Failure"},{"id":"call-limit-maximum-call-duration-reached","section":"Calling","title":"Call Limit / Maximum Call Duration Reached","status":["Max duration timer expired","Call duration timeout expired","Local, Max call duration expired","call duration timeout expired"],"statusVerified":true,"type":"Limit / Entitlement","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"The call was ended automatically after reaching a configured maximum-duration limit. This limit can be set at the account level or on an individual voice entity, and the lower applicable value applies.","causes":["A maximum call duration is configured on the account or on the specific phone number, SIP connection, Teams connection, or AI Agent voice path handling the call","This is intentional cost-control or compliance behavior rather than a fault — it guarantees no single call runs indefinitely","A shorter limit configured lower in the hierarchy (for example, on a specific number) can override a longer account-level default"],"actions":["Check for a maximum call duration setting on the relevant voice entity and at the account level.","Confirm the call's actual duration matches the configured limit."],"escalate":"Contact AudioCodes if the call ended before reaching any configured maximum-duration value.","evidence":["Call ID","Timestamp and time zone","Actual call duration observed"],"related":""},{"id":"no-matching-route-call-rejected-by-routing-rule","section":"Calling","title":"No Matching Route / Call Rejected By Routing Rule","status":["No route","Call rejected"],"statusVerified":true,"type":"Configuration Condition","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"The call could not be delivered because no routing rule matched it, or a matched rule was configured to reject the call.","causes":["No routing rule's origin/call criteria matches this call","A matching rule exists but is intentionally configured to reject calls meeting that criteria"],"actions":["Open Routing → Routing Rules and review origin, calling/called-number criteria, region, and destination for the expected rule.","Confirm whether any rule is configured to reject this type of call intentionally."],"escalate":"Contact AudioCodes if a rule appears correctly configured to accept and route this call, and it's still failing.","evidence":["Call ID","Timestamp and time zone","Expected routing rule name","Calling and called number"],"related":"Region Mismatch"},{"id":"region-mismatch","section":"Calling","title":"Region Mismatch","status":["Region Mismatch"],"statusVerified":false,"type":"Configuration Condition","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"Live Hub voice entities participating in the same call must be in compatible regions. Traffic can only be routed between Live Hub entities located in the same region.","causes":["The phone number, SIP connection, Teams connection, or bot/AI Agent connection involved in the call are configured in different regions","A number, connection, or agent was recently provisioned in a different region than the rest of the call path — often after a configuration change or a resource created in the wrong region by mistake"],"actions":["Check the configured region of the phone number, SIP connection, Teams connection, and bot/AI Agent connection involved in the call.","Confirm the routing rule's destination region is compatible with the origin."],"escalate":"Contact AudioCodes if all relevant entities appear to be in the same region and the call still fails to route.","evidence":["Call ID","Timestamp and time zone","Names/regions of the voice entities involved"],"related":"No Matching Route / Call Rejected By Routing Rule"},{"id":"alternate-route-routing-group-failover","section":"Calling","title":"Alternate Route / Routing Group Failover","status":["Alternate Route / Routing Group Failover"],"statusVerified":false,"type":"Expected Event","investigate":"Live Hub","actionability":"Usually self-service","meaning":"A routing group can send a call to an alternate destination when the primary destination doesn't respond. This can result in more than one call record for what the customer experienced as a single call attempt.","causes":["The primary destination in a routing group failed to answer or was unavailable, triggering failover to the next-priority destination","This is frequently intentional resiliency design working as configured — the routing group falls back to the next destination specifically so calls aren’t lost when the first choice doesn’t answer"],"actions":["Search for related call records — records sharing the same SID can represent the original attempt and the failover.","Confirm the routing group's configured priorities match the observed behavior."],"escalate":"Contact AudioCodes if the failover behavior doesn't match the configured routing group priorities.","evidence":["Call ID or SID","Timestamp and time zone","Routing group name if known"],"related":"No Matching Route / Call Rejected By Routing Rule"},{"id":"call-connects-but-audio-is-bad-or-missing-one-way-audio-no-audio-choppy-audio","section":"Calling","title":"Call Connects But Audio Is Bad or Missing (One-Way Audio / No Audio / Choppy Audio)","status":["RTP connection broken","Rtp conn broken","RTP Timeout","No incoming media for 15000 ms"],"statusVerified":true,"type":"Symptom","investigate":"Multiple Possible Sources","actionability":"Sometimes self-service","meaning":"The call signals as connected, but one or both sides hear silence, only one direction has audio, or the audio is choppy/distorted. This is a media-path problem, separate from the signaling issues covered by the SIP response codes above.","causes":["The audio path (RTP) between the two sides never established, even though call setup succeeded","A firewall, NAT, or network device is blocking media in one direction","The two sides could not agree on a common audio format (codec) or encryption setting","Network congestion, packet loss, or jitter on either leg of the call","For WebRTC/Teams calls, no usable media path could be found between endpoints (ICE negotiation)"],"actions":["Open the call in Calls → Call History and check whether it shows as connected despite the audio problem.","Review the SIP Ladder to confirm signaling completed normally (a normal ladder alongside bad audio points to a media-path, not a signaling, issue).","Check whether the problem affects one specific call, one specific route/carrier, or all calls — this narrows down where the media path is breaking.","Retry the call and note whether the same result happens consistently."],"escalate":"Contact AudioCodes if signaling completed normally, the problem is not isolated to one destination or network path, and it continues on retry.","evidence":["Call ID","Timestamp and time zone","Calling and called number","Which direction had no/bad audio","Call recording, if one was captured for this call"],"related":"488 Not Acceptable Here, No Answer"},{"id":"420-bad-extension","section":"Calling","title":"420 Bad Extension","status":["420 Bad Extension"],"statusVerified":true,"type":"Protocol Result","investigate":"Multiple Possible Sources","actionability":"Sometimes self-service","meaning":"The far end sent or expected a call-setup detail (a SIP extension/feature) that the other side does not support.","causes":["A feature or header used in call setup isn’t supported by the receiving system","A mismatch between what Live Hub, a SIP trunk, or a carrier each expect during call setup"],"actions":["Open the call in Call History and review the SIP Ladder to see which side sent the unsupported extension.","If this is isolated to one trunk or carrier, check whether anything changed recently in that connection’s configuration."],"escalate":"Contact AudioCodes if the SIP Ladder doesn’t make clear which side introduced the unsupported extension, or the issue affects more than one call.","evidence":["Call ID","Timestamp and time zone","SIP Ladder excerpt"],"related":"481 Call/Transaction Does Not Exist, Protocol Error, Unspecified"},{"id":"403-remote-is-disconnected","section":"Calling","title":"403 Remote Is Disconnected","status":["403 Remote Is Disconnected","403 Relayed Response: Remote Is Disconnected","403 Remote Is Disconnected (last Code: 408)"],"statusVerified":true,"type":"Protocol Result","investigate":"Multiple Possible Sources","actionability":"Sometimes self-service","meaning":"The remote endpoint disconnected unexpectedly during the call, sometimes following a timeout on that leg. This is a hangup condition distinct from a policy-based 403 Forbidden.","causes":["The far end dropped the connection without a clean call teardown","A prior timeout condition (shown as \"last Code: 408\") led to the disconnect","A network interruption on the remote side ended the session abruptly"],"actions":["Check the SIP Ladder for the sequence of events immediately before the disconnect.","If a \"(last Code: 408)\" is shown, treat the 408 as the underlying trigger and check that entry too.","Confirm whether this is isolated to one destination/carrier or happening broadly."],"escalate":"Contact AudioCodes if this is happening across multiple destinations or carriers, or the SIP Ladder doesn’t explain the disconnect.","evidence":["Call ID","Timestamp and time zone","SIP Ladder excerpt","Call recording, if one was captured for this call"],"related":"408 Request Timeout, Call Connects But Audio Is Bad or Missing"},{"id":"unallocated-unassigned-number","section":"Calling","title":"Unallocated (Unassigned) Number","status":["Unallocated (unassigned) number"],"statusVerified":true,"type":"Protocol Result","investigate":"Carrier / Network","actionability":"Sometimes self-service","meaning":"The dialed number doesn’t exist or hasn’t been assigned to anyone on the receiving network — this is a carrier-level result, not a Live Hub routing failure.","causes":["The number was mistyped or is genuinely not in service","A number was ported or deactivated recently and the destination network hasn’t updated"],"actions":["Confirm the dialed number is correct, including country/area code.","If this is a known, previously-working number, check whether it was recently ported or deactivated."],"escalate":"Contact AudioCodes if the number is confirmed correct and in service, but calls still fail with this result.","evidence":["Call ID","Timestamp and time zone","Dialed number"],"related":"404 Not Found, No Matching Route / Call Rejected By Routing Rule"},{"id":"answering-machine-detected","section":"Calling","title":"Answering Machine Detected","status":["Answering Machine"],"statusVerified":true,"type":"Symptom","investigate":"Live Hub","actionability":"Usually self-service","meaning":"The call reached a voicemail system or automated answering service rather than a live person.","causes":["Answering machine detection identified voicemail/greeting audio patterns on the call","A legitimate live answer with a short or scripted-sounding greeting can occasionally be misclassified as a machine"],"actions":["If this result is unexpected, confirm answering machine detection is configured the way you intend for this routing rule/flow.","Listen back to the call recording, if available, to confirm the detection was accurate."],"escalate":"Contact AudioCodes if answering machine detection is consistently misclassifying live answers as machines (or vice versa).","evidence":["Call ID","Timestamp and time zone","Call recording, if one was captured for this call"],"related":"No Answer, User Did Not Respond"},{"id":"protocol-error-unspecified","section":"Calling","title":"Protocol Error, Unspecified","status":["Protocol error, unspecified"],"statusVerified":true,"type":"Error","investigate":"Multiple Possible Sources","actionability":"Support investigation usually required","meaning":"A call-signaling problem occurred that doesn’t map to one of the named, specific protocol results in this guide.","causes":["An edge case or unusual signaling sequence occurred that isn’t covered by a standard named result","This is a catch-all the platform uses when the signaling problem doesn’t match a defined, named result — the raw SIP Ladder is usually needed to pin down the specific case"],"actions":["Open the SIP Ladder for the call and look for anything unusual immediately before the failure.","Check whether the issue is reproducible or a one-off."],"escalate":"Contact AudioCodes with the SIP Ladder — this result usually needs the raw signaling trace to diagnose further.","evidence":["Call ID","Timestamp and time zone","SIP Ladder excerpt"],"related":"Unknown Error (Unspecified Platform Failure)"},{"id":"call-reached-wrong-destination","section":"Routing & Call Delivery","title":"Call Reached Wrong Destination","status":["Call Reached Wrong Destination"],"statusVerified":false,"type":"Configuration Condition","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"The call was delivered somewhere other than the expected destination.","causes":["A different routing rule than expected matched the call (based on origin, calling/called number, or region)","Rule priority/order caused an earlier rule to match first"],"actions":["Open Routing → Routing Rules and check origin, calling/called-number criteria, and destination for every rule that could plausibly match this call.","Confirm which rule actually matched using the call record in Call History."],"escalate":"Contact AudioCodes if the routing rules appear correctly configured and the call still reaches the wrong destination.","evidence":["Call ID","Timestamp and time zone","Expected destination vs. actual destination"],"related":"No Matching Route / Call Rejected By Routing Rule"},{"id":"expected-service-not-applied-recording-translation-assist-bot","section":"Routing & Call Delivery","title":"Expected Service Not Applied (Recording / Translation / Assist Bot)","status":["Expected Service Not Applied (Recording / Translation / Assist Bot)"],"statusVerified":false,"type":"Configuration Condition","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"A call did not receive an additional service — such as recording, external recording, voice translation, Assist bot, or number customization — that was expected.","causes":["The matched routing rule doesn't have the relevant service enabled","A different rule than expected matched the call"],"actions":["Open Routing → Routing Rules, identify the rule that matched this call, and confirm the relevant service is enabled on it."],"escalate":"Contact AudioCodes if the correct rule is matched and the service is enabled, but it still didn't apply.","evidence":["Call ID","Timestamp and time zone","Which service was expected"],"related":"Call Reached Wrong Destination"},{"id":"teams-connection-not-active","section":"Microsoft Teams","title":"Teams Connection Not Active","status":["Teams Connection Not Active"],"statusVerified":false,"type":"Configuration Condition","investigate":"Microsoft Teams","actionability":"Usually self-service","meaning":"The Teams connection is not in an Active state. A new connection can briefly show as Creating before becoming Active — this is expected and not an error on its own.","causes":["The connection is still being provisioned (Creating)","Tenant authentication or configuration is incomplete"],"actions":["Check the Teams connection status. If it shows Creating, allow time for provisioning to complete before treating it as a failure.","If it remains in a non-Active state for an extended period, review tenant authentication and configuration."],"escalate":"Contact AudioCodes if the connection remains non-Active well beyond the expected provisioning time.","evidence":["Teams tenant/connection name","Timestamp","Current connection status shown"],"related":"Teams Call Fails to Connect"},{"id":"teams-call-fails-to-connect","section":"Microsoft Teams","title":"Teams Call Fails to Connect","status":["Teams Call Fails to Connect"],"statusVerified":false,"type":"Symptom","investigate":"Multiple Possible Sources","actionability":"Sometimes self-service","meaning":"A call involving a Teams participant fails to connect. Teams calls can be inspected using the same Call History and SIP Ladder tools as other calls — start there rather than assuming the issue is on Microsoft's side.","causes":["Teams tenant not connected or not authenticated","Teams connection not in Active state","Missing Microsoft license for the user/resource","Phone number not correctly assigned","Live Hub routing rule missing or misconfigured","Region mismatch between the Teams connection and the other voice entity"],"actions":["Locate the call in Calls → Call History and review the SIP Ladder to see which side returned a failure.","Verify: tenant connected and authenticated → Teams connection Active → user/resource provisioned correctly → phone number assigned → required Microsoft licenses present → Teams voice policies/routes configured → Live Hub routing rule exists → regions match."],"escalate":"Contact AudioCodes if Call History and the SIP Ladder don't clearly explain the failure after working through the checks above.","evidence":["Call ID","Timestamp and time zone","Affected Teams user or resource account","Number involved","SIP Ladder excerpt"],"related":"Teams Connection Not Active, Region Mismatch, User Missing Required Microsoft License"},{"id":"user-missing-required-microsoft-license","section":"Microsoft Teams","title":"User Missing Required Microsoft License","status":["User Missing Required Microsoft License"],"statusVerified":false,"type":"Configuration Condition","investigate":"Microsoft Teams","actionability":"Usually self-service","meaning":"Teams calling requires eligible Microsoft 365 licensing for the affected user or resource account.","causes":["The user or resource account doesn't have the required Microsoft license assigned","A license was recently removed, reassigned, or expired in the Microsoft 365 admin center, even if nothing changed on the Live Hub side","Enterprise Voice is enabled in Teams, but the calling plan or Direct Routing license needed alongside it is missing"],"actions":["Check license assignment for the affected user/resource account in your Microsoft 365 admin center."],"escalate":"Contact AudioCodes if the required license is confirmed assigned and the issue continues.","evidence":["Affected user or resource account","Timestamp"],"related":"Teams Call Fails to Connect"},{"id":"teams-number-not-assigned-correctly","section":"Microsoft Teams","title":"Teams Number Not Assigned Correctly","status":["Teams Number Not Assigned Correctly"],"statusVerified":false,"type":"Configuration Condition","investigate":"Microsoft Teams","actionability":"Usually self-service","meaning":"A phone number intended for a Teams user or resource account isn't correctly assigned.","causes":["Number assignment wasn't completed in Teams admin or Live Hub","Assignment doesn't match the connection actually being used"],"actions":["Verify the number's assignment in both Live Hub and the Teams admin center."],"escalate":"Contact AudioCodes if the number appears correctly assigned in both places and still isn't working.","evidence":["Affected number","Affected user or resource account","Timestamp"],"related":"Teams Call Fails to Connect"},{"id":"agent-does-not-respond","section":"AI Agents & Conversations","title":"Agent Does Not Respond","status":["Bot Err: no bot input for 20000ms","Bot Err: Max retries exceeded","Bot Err: Max retries (2) exceeded.","Bot Err: Error: 11 OUT_OF_RANGE: More than 120"],"statusVerified":true,"type":"Symptom","investigate":"Multiple Possible Sources","actionability":"Sometimes self-service","meaning":"The caller reached the AI Agent, but the agent did not produce a response.","causes":["The call never actually reached the agent (telephony/routing layer)","Speech wasn't recognized (STT layer)","The model/LLM didn't produce a response in time","A tool call was invoked and never returned","The provider or model was unavailable"],"actions":["Confirm the call reached the agent in Calls → Call History.","Check AI Agent logs for the conversation.","Review the separate STT, Bot, and TTS latency figures in Call History to identify which layer was slow or unresponsive — do not assume the delay was the LLM without checking.","If a tool was involved, check whether it was called and whether it returned."],"escalate":"Contact AudioCodes with the identified failing layer (telephony, STT, LLM, or tool) if the checks above don't resolve it.","evidence":["Call ID / conversation identifier","Agent name","Flow name if applicable","Timestamp","Model/provider","AI Agent logs","Latency figures if available"],"related":"Speech Not Recognized, Tool Call Failed or Timed Out, AI Provider/Model Unavailable, Conversation Ended at Maximum Turns"},{"id":"conversation-ended-at-maximum-turns","section":"AI Agents & Conversations","title":"Conversation Ended at Maximum Turns","status":["Conversation Ended at Maximum Turns"],"statusVerified":false,"type":"Expected Event","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"A  Service not available"],"statusVerified":true,"type":"Symptom","investigate":"AI / Speech Provider","actionability":"Sometimes self-service","meaning":"The underlying AI model or provider configured for the agent was unavailable when needed.","causes":["Provider-side outage or degradation","Configured model is deprecated, restricted, or misconfigured"],"actions":["Check AI Agent logs for the conversation to confirm the model/provider involved.","Confirm the configured model is currently valid and available for the account."],"escalate":"Contact AudioCodes if the configured model/provider appears correct and valid, and the unavailability persists.","evidence":["Call ID / conversation identifier","Agent name","Model/provider","Timestamp","Call recording, if one was captured for this call/conversation"],"related":"Empty or Invalid LLM Response, AI Rate or Quota Limit Reached"},{"id":"ai-rate-or-quota-limit-reached","section":"AI Agents & Conversations","title":"AI Rate or Quota Limit Reached","status":["AI Rate or Quota Limit Reached"],"statusVerified":false,"type":"Limit / Entitlement","investigate":"AI / Speech Provider","actionability":"Sometimes self-service","meaning":"A rate or quota limit on the AI provider/model has been reached.","causes":["Request volume to the model/provider exceeded the configured or provider-side limit","A burst of concurrent conversations pushed request volume above the provider’s per-minute or per-day allowance","The configured AI provider account may be on a lower usage tier than current call volume requires"],"actions":["Check AI Agent logs around the affected time for rate/quota-related messages.","Review recent conversation volume for the affected agent."],"escalate":"Contact AudioCodes to review the applicable limit and discuss increasing it if usage is expected to continue at this level.","evidence":["Agent name","Model/provider","Timestamp","Approximate conversation volume at the time","Call recording, if one was captured for this call/conversation"],"related":"AI Provider/Model Unavailable"},{"id":"agent-conversation-session-expired","section":"AI Agents & Conversations","title":"Agent/Conversation Session Expired","status":["Agent/Conversation Session Expired"],"statusVerified":false,"type":"Expected Event","investigate":"Live Hub","actionability":"Usually self-service","meaning":"The AI Agent conversation session ended due to inactivity or reaching its maximum allowed duration. This is distinct from a user's sign-in session expiring in the Live Hub portal.","causes":["The conversation was inactive for longer than the session timeout allows","The conversation reached its maximum configured duration"],"actions":["Check the conversation log to confirm how long the session was inactive before ending."],"escalate":"Contact AudioCodes if the session ended despite active, ongoing conversation.","evidence":["Call ID / conversation identifier","Agent name","Timestamp"],"related":"User Authentication Session Expired, WhatsApp Conversation Window Closed"},{"id":"bot-agent-failed-to-start","section":"AI Agents & Conversations","title":"Bot/Agent Failed To Start","status":["Bot Err: Error starting bot","Bot Err: Error starting bot: getaddrinfo ENOTFOUND","Bot Err: Error starting bot: Request failed with..."],"statusVerified":true,"type":"Error","investigate":"Bot / AI Platform","actionability":"Sometimes self-service","meaning":"The AI agent/bot failed to initialize for this conversation before it could begin responding.","causes":["The bot platform or endpoint the agent connects to was unreachable (e.g. a DNS/network lookup failure)","A request made during startup failed or was rejected"],"actions":["Confirm nothing changed recently in the agent/bot’s configuration or its connection details.","Check whether this is affecting one specific agent/flow or all of them."],"escalate":"Contact AudioCodes if the agent’s configuration hasn’t changed and it consistently fails to start.","evidence":["Call ID /
