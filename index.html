 Service not available"],"statusVerified":true,"type":"Symptom","investigate":"AI / Speech Provider","actionability":"Sometimes self-service","meaning":"The underlying AI model or provider configured for the agent was unavailable when needed.","causes":["Provider-side outage or degradation","Configured model is deprecated, restricted, or misconfigured"],"actions":["Check AI Agent logs for the conversation to confirm the model/provider involved.","Confirm the configured model is currently valid and available for the account."],"escalate":"Contact AudioCodes if the configured model/provider appears correct and valid, and the unavailability persists.","evidence":["Call ID / conversation identifier","Agent name","Model/provider","Timestamp","Call recording, if one was captured for this call/conversation"],"related":"Empty or Invalid LLM Response, AI Rate or Quota Limit Reached"},{"id":"ai-rate-or-quota-limit-reached","section":"AI Agents & Conversations","title":"AI Rate or Quota Limit Reached","status":["AI Rate or Quota Limit Reached"],"statusVerified":false,"type":"Limit / Entitlement","investigate":"AI / Speech Provider","actionability":"Sometimes self-service","meaning":"A rate or quota limit on the AI provider/model has been reached.","causes":["Request volume to the model/provider exceeded the configured or provider-side limit","A burst of concurrent conversations pushed request volume above the provider’s per-minute or per-day allowance","The configured AI provider account may be on a lower usage tier than current call volume requires"],"actions":["Check AI Agent logs around the affected time for rate/quota-related messages.","Review recent conversation volume for the affected agent."],"escalate":"Contact AudioCodes to review the applicable limit and discuss increasing it if usage is expected to continue at this level.","evidence":["Agent name","Model/provider","Timestamp","Approximate conversation volume at the time","Call recording, if one was captured for this call/conversation"],"related":"AI Provider/Model Unavailable"},{"id":"agent-conversation-session-expired","section":"AI Agents & Conversations","title":"Agent/Conversation Session Expired","status":["Agent/Conversation Session Expired"],"statusVerified":false,"type":"Expected Event","investigate":"Live Hub","actionability":"Usually self-service","meaning":"The AI Agent conversation session ended due to inactivity or reaching its maximum allowed duration. This is distinct from a user's sign-in session expiring in the Live Hub portal.","causes":["The conversation was inactive for longer than the session timeout allows","The conversation reached its maximum configured duration"],"actions":["Check the conversation log to confirm how long the session was inactive before ending."],"escalate":"Contact AudioCodes if the session ended despite active, ongoing conversation.","evidence":["Call ID / conversation identifier","Agent name","Timestamp"],"related":"User Authentication Session Expired, WhatsApp Conversation Window Closed"},{"id":"bot-agent-failed-to-start","section":"AI Agents & Conversations","title":"Bot/Agent Failed To Start","status":["Bot Err: Error starting bot","Bot Err: Error starting bot: getaddrinfo ENOTFOUND","Bot Err: Error starting bot: Request failed with..."],"statusVerified":true,"type":"Error","investigate":"Bot / AI Platform","actionability":"Sometimes self-service","meaning":"The AI agent/bot failed to initialize for this conversation before it could begin responding.","causes":["The bot platform or endpoint the agent connects to was unreachable (e.g. a DNS/network lookup failure)","A request made during startup failed or was rejected"],"actions":["Confirm nothing changed recently in the agent/bot’s configuration or its connection details.","Check whether this is affecting one specific agent/flow or all of them."],"escalate":"Contact AudioCodes if the agent’s configuration hasn’t changed and it consistently fails to start.","evidence":["Call ID / s the caller's language.","Review the STT latency figure for the affected call in Call History.","Listen to the call recording, if available, to assess audio quality."],"escalate":"Contact AudioCodes if language and audio quality both look correct and recognition still fails consistently.","evidence":["Call ID","Agent name","Timestamp","Configured STT language/provider","STT latency if available","Call recording, if one was captured for this call/conversation"],"related":"Agent Does Not Respond, Incorrect Speech Recognition"},{"id":"incorrect-speech-recognition","section":"Speech & Telephony","title":"Incorrect Speech Recognition","status":["Incorrect Speech Recognition"],"statusVerified":false,"type":"Symptom","investigate":"AI / Speech Provider","actionability":"Sometimes self-service","meaning":"The agent recognized speech, but transcribed it incorrectly, leading to an unexpected response.","causes":["Accent, background noise, or audio quality affecting STT accuracy","Domain-specific vocabulary not well recognized by the configured STT service"],"actions":["Review the conversation log/transcript to see exactly what was recognized versus what was said.","Check the configured STT language and provider under Speech and Telephony."],"escalate":"Contact AudioCodes with specific examples if misrecognition is frequent and affecting normal, clear speech.","evidence":["Call ID","Agent name","Timestamp","Example of what was said vs. what was recognized","Call recording, if one was captured for this call/conversation"],"related":"Speech Not Recognized"},{"id":"agent-cannot-be-interrupted-barge-in","section":"Speech & Telephony","title":"Agent Cannot Be Interrupted (Barge-In)","status":["Agent Cannot Be Interrupted (Barge-In)"],"statusVerified":false,"type":"Configuration Condition","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"The caller is unable to interrupt the agent while it's speaking.","causes":["Barge-in is disabled in the agent's Speech and Telephony configuration","Barge-in can also be unsupported by the specific speech/telephony configuration in use for that agent, separate from whether the setting is toggled on"],"actions":["Open the agent's Speech and Telephony settings and confirm whether barge-in is enabled."],"escalate":"Contact AudioCodes if barge-in is enabled in configuration but interruption still doesn't work.","evidence":["Call ID","Agent name","Timestamp","Call recording, if one was captured for this call/conversation"],"related":""},{"id":"dtmf-not-detected","section":"Speech & Telephony","title":"DTMF Not Detected","status":["DTMF Not Detected"],"statusVerified":false,"type":"Configuration Condition","investigate":"Multiple Possible Sources","actionability":"Sometimes self-service","meaning":"Touch-tone (DTMF) input from the caller was not detected or acted on by the agent.","causes":["DTMF handling isn't configured or enabled for this agent/Flow","The Flow or prompt doesn't define expected behavior for DTMF input","A telephony-layer issue prevented DTMF tones from reaching the agent"],"actions":["Check the agent's Speech and Telephony and Flow configuration for DTMF handling.","Confirm DTMF was actually sent — review the call recording or logs if available."],"escalate":"Contact AudioCodes if DTMF handling is configured correctly and tones are confirmed sent, but still not detected.","evidence":["Call ID","Agent name","Timestamp","Digits expected to be sent","Call recording, if one was captured for this call/conversation"],"related":"No User Input Event"},{"id":"no-user-input-event","section":"Speech & Telephony","title":"No User Input Event","status":["User Did Not Respond","No user responding","User inactive for 20 seconds","User inactive for 30 seconds","User inactive for 60 seconds","User inactive for 62 seconds","User inactive for 120 seconds","User inactive for 300 seconds"],"statusVerified":true,"type":"Expected Event","investigate":"Live Hub","actionability":"Usually self-service","meaning":"AI Agents generate a synthetic event (such as NO-USER-INPUT-1, with incrementing numbers for repeated occurrences) when the caller is silent during a voice conversation. This is expected platform behavior, not an error — how it's handled depends on the agent's prompt or Flow configuration.","causes":["The caller was silent and this event fired as designed","The prompt or Flow doesn't handle this event the way you expect (e.g. it should repeat a prompt, transfer, or end the call)"],"actions":["Review the agent's prompt or Flow to see how NO-USER-INPUT events are configured to be handled.","Check the conversation log to see how many NO-USER-INPUT events occurred and what happened after."],"escalate":"Contact AudioCodes if the configured handling doesn't match observed behavior.","evidence":["Call ID / conversation identifier","Agent name","Flow name if applicable","Timestamp","Call recording, if one was captured for this call/conversation"],"related":"DTMF Not Detected, Agent Does Not Respond"},{"id":"call-ends-after-fixed-duration-ai-agent","section":"Speech & Telephony","title":"Call Ends After Fixed Duration (AI Agent)","status":["Call Ends After Fixed Duration (AI Agent)"],"statusVerified":false,"type":"Limit / Entitlement","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"The call with the AI Agent ends consistently after a set amount of time. This commonly reflects a configured maximum call duration on the agent's Speech and Telephony settings, the voice entity, or the account.","causes":["Maximum call duration is configured on the agent, the relevant voice channel, or the account, and the lower applicable value is being enforced","If no limit was intentionally set for this agent, check whether a default account-level maximum is being inherited instead"],"actions":["Check the agent's Speech and Telephony configuration for a maximum call duration setting.","Also check the relevant voice entity and account-level limits."],"escalate":"Contact AudioCodes if no configured maximum duration explains the observed cutoff point.","evidence":["Call ID","Agent name","Timestamp","Observed call duration","Call recording, if one was captured for this call/conversation"],"related":"Call Limit / Maximum Call Duration Reached"},{"id":"speech-to-text-service-connection-failed-stt-err","section":"Speech & Telephony","title":"Speech-to-Text Service Connection Failed (STT Err)","status":["STT Err: Websocket error: WebSocket was closed","STT Err: Unable to contact server. StatusCode:"],"statusVerified":true,"type":"Error","investigate":"Speech / AI Provider","actionability":"Sometimes self-service","meaning":"The connection to the Speech-to-Text service was lost or couldn’t be established, so the caller’s speech couldn’t be transcribed for this part of the call.","causes":["The STT provider’s connection was interrupted or closed unexpectedly","The STT service was unreachable or returned an error status when Live Hub tried to connect"],"actions":["Check whether this is isolated to one call or affecting speech recognition broadly.","If it’s widespread and recent, check whether it lines up with a known STT provider incident."],"escalate":"Contact AudioCodes if this is affecting multiple calls or agents rather than a single occurrence.","evidence":["Call ID / conversation identifier","Timestamp and time zone","Call recording, if one was captured for this call"],"related":"Speech Not Recognized, Text-to-Speech Request Failed (TTS Err)"},{"id":"text-to-speech-request-failed-tts-err","section":"Speech & Telephony","title":"Text-to-Speech Request Failed (TTS Err)","status":["TTS Err: 400 Bad Request. Req body: <speak ..."],"statusVerified":true,"type":"Error","investigate":"Speech / AI Provider","actionability":"Sometimes self-service","meaning":"A request to convert the agent’s response text into spoken audio was rejected as malformed or invalid, so the caller may have heard nothing or a fallback message instead.","causes":["The text sent to the Text-to-Speech service contained something it couldn’t process (for example, invalid formatting in the spoken-text markup)","Special characters, unsupported spoken-text markup, or an unexpectedly long response can each trigger this on the Text-to-Speech provider’s side"],"actions":["If this is tied to a specific agent response or prompt, check that response for unusual characters or formatting.","Check whether this is a one-off or consistently tied to the same prompt/response."],"escalate":"Contact AudioCodes if this is consistently tied to a specific prompt or happening across many calls.","evidence":["Call ID / conversation identifier","Timestamp and time zone","Agent/flow name and the response involved, if known"],"related":"Speech-to-Text Service Connection Failed (STT Err)"},{"id":"tool-call-failed-or-timed-out","section":"AI Agent Tools & External Actions","title":"Tool Call Failed or Timed Out","status":["Tool Call Failed or Timed Out"],"statusVerified":false,"type":"Symptom","investigate":"Third-Party Integration","actionability":"Sometimes self-service","meaning":"The agent attempted to use a tool to perform an external action, and the tool call failed or didn't return in time.","causes":["The tool's target endpoint was unavailable","The request timed out","Authentication to the target endpoint failed","The endpoint returned an error"],"actions":["Review AI Agent logs for the conversation to see the tool call, its parameters, and the returned status/error.","Confirm the target endpoint is reachable and functioning independently of Live Hub.","Check the tool's configured authentication is current."],"escalate":"Contact AudioCodes with the sanitized request/response details if the target endpoint is confirmed healthy and the tool call still fails from Live Hub.","evidence":["Call ID / conversation identifier","Agent name","Tool name","Timestamp","Sanitized request/response (no credentials)","AI Agent logs"],"related":"Agent Does Not Respond, Audio Playback Failed"},{"id":"wrong-tool-selected-or-invalid-parameters","section":"AI Agent Tools & External Actions","title":"Wrong Tool Selected or Invalid Parameters","status":["Wrong Tool Selected or Invalid Parameters"],"statusVerified":false,"type":"Configuration Condition","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"The agent invoked a tool, but selected the wrong one or generated parameters that didn't match what was expected.","causes":["The prompt/instructions don't clearly guide the model on when and how to use the tool","The tool's parameter definitions are ambiguous or incomplete"],"actions":["Review AI Agent logs to see which tool was called and with what parameters.","Review the agent's prompt/instructions and the tool's parameter definitions for clarity."],"escalate":"Contact AudioCodes if the tool and parameter configuration look correct and the model still consistently selects the wrong tool.","evidence":["Call ID / conversation identifier","Agent name","Tool name","AI Agent logs"],"related":"Tool Call Failed or Timed Out"},{"id":"audio-playback-failed-play-url-failed","section":"AI Agent Tools & External Actions","title":"Audio Playback Failed (PLAY-URL-FAILED)","status":["Audio Playback Failed (PLAY-URL-FAILED)"],"statusVerified":false,"type":"Error","investigate":"Multiple Possible Sources","actionability":"Sometimes self-service","meaning":"The agent's audio playback tool failed to play a prerecorded audio file. Live Hub documents an exact failure indicator, PLAY-URL-FAILED, which includes the specific reason for the failure.","causes":["The audio URL was unreachable","The file format isn't supported","The tool configuration is incorrect"],"actions":["Check AI Agent logs for the PLAY-URL-FAILED message and the specific reason included with it.","Confirm the audio URL is reachable and the file format is supported.","Review the tool's configuration for the affected agent."],"escalate":"Contact AudioCodes with the exact PLAY-URL-FAILED reason if the URL and format both check out.","evidence":["Call ID / conversation identifier","Agent name","Audio URL","Exact PLAY-URL-FAILED reason from logs","Timestamp","Call recording, if one was captured for this call/conversation"],"related":"Tool Call Failed or Timed Out"},{"id":"call-transfer-failed","section":"AI Agent Tools & External Actions","title":"Call Transfer Failed","status":["Transfer failed: REFER request failed","Transfer failed: 403 Forbidden"],"statusVerified":true,"type":"Symptom","investigate":"Multiple Possible Sources","actionability":"Sometimes self-service","meaning":"The agent attempted to transfer the call and the transfer did not complete successfully.","causes":["The transfer target isn't correctly configured","The transfer target didn't answer","A call-control action returned an error"],"actions":["Review AI Agent logs and the SIP Ladder for the transfer attempt.","Confirm the intended transfer target is correctly configured and reachable."],"escalate":"Contact AudioCodes with the logs and SIP Ladder if the transfer target is correctly configured and reachable but the transfer still fails.","evidence":["Call ID / conversation identifier","Agent name","Intended transfer target","Timestamp","AI Agent logs"],"related":"Tool Call Failed or Timed Out"},{"id":"agent-gives-incorrect-answer-from-document","section":"AI Agent Documents & Knowledge","title":"Agent Gives Incorrect Answer From Document","status":["Agent Gives Incorrect Answer From Document"],"statusVerified":false,"type":"Symptom","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"The agent answered a question using an attached document, but the answer was wrong or didn't reflect the document's actual content. This is usually a retrieval or content issue, not a platform failure — Live Hub converts source content to Markdown and splits it into chunks, so retrieval quality depends on that processing and configuration.","causes":["The document isn't attached to the agent that needs it","The relevant information wasn't captured well during chunking","The wrong retrieval mode is selected for this use case","The question falls outside what the document actually covers"],"actions":["Confirm the document is attached to the correct agent under AI Agents → Documents.","Open AI Agents → Documents → [Document] → Info to inspect the document's status and generated chunks.","Test the same question directly and compare the agent's answer to the source content.","Review the configured retrieval mode for the document."],"escalate":"Contact AudioCodes with the document name, the question asked, and the expected vs. actual answer if the document, chunks, and retrieval mode all appear correct.","evidence":["Agent name","Document name","Source type","Retrieval mode","Example question","Expected answer from source","Actual agent answer","Relevant chunk/status info"],"related":"Document Not Accessible or Cannot Be Retrieved"},{"id":"document-not-accessible-or-cannot-be-retrieved","section":"AI Agent Documents & Knowledge","title":"Document Not Accessible or Cannot Be Retrieved","status":["Document Not Accessible or Cannot Be Retrieved"],"statusVerified":false,"type":"Symptom","investigate":"Multiple Possible Sources","actionability":"Sometimes self-service","meaning":"A document the agent relies on could not be downloaded, parsed, or made available to the agent.","causes":["The source URL is inaccessible","The document failed to parse correctly","The document isn't fully processed yet"],"actions":["Open AI Agents → Documents → [Document] → Info and check its current status.","If the source is a URL, confirm it's currently reachable.","Review generated chunks, where available, to see whether processing completed."],"escalate":"Contact AudioCodes if the document status shows a processing failure that persists after re-checking the source.","evidence":["Agent name","Document name","Source type/URL","Current document status"],"related":"Agent Gives Incorrect Answer From Document"},{"id":"flow-takes-unexpected-path","section":"AI Agent Flows & Multi-Agent","title":"Flow Takes Unexpected Path","status":["Flow Takes Unexpected Path"],"statusVerified":false,"type":"Configuration Condition","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"A Flow — a deterministic sequence of nodes and transitions — moved to a different node than expected. This is generally a configuration matter (a condition, transition, or extracted variable behaving differently than intended) rather than a platform execution failure.","causes":["A transition condition evaluated differently than expected","Variable extraction produced an unexpected value","A fallback path was triggered","A no-user-input event drove the conversation down an unintended path"],"actions":["Review the Flow's node and transition configuration for the path in question.","Check the conversation log to see which conditions and variable values were evaluated at each transition.","If testing, use the Flow's test/preview capability to trace the path step by step."],"escalate":"Contact AudioCodes with the conversation log and expected vs. actual path if the Flow logic appears correctly configured and the path is still wrong.","evidence":["Call ID / conversation identifier","Agent name","Flow name","Expected path vs. actual path","Relevant variable values"],"related":"No User Input Event, Maximum Transitions Reached"},{"id":"maximum-transitions-reached","section":"AI Agent Flows & Multi-Agent","title":"Maximum Transitions Reached","status":["Maximum Transitions Reached"],"statusVerified":false,"type":"Limit / Entitlement","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"The Flow reached its configured limit on transitions or turns and ended or moved to a fallback path as designed.","causes":["The conversation genuinely required more turns than the configured maximum allows","A Flow design issue — such as a transition condition that’s never satisfied — can also cause turns to accumulate without the Flow ever reaching its intended end node"],"actions":["Check the Flow's configured maximum-transition/turn setting against the observed conversation length."],"escalate":"Contact AudioCodes if the Flow ended well before the configured maximum was reached.","evidence":["Call ID / conversation identifier","Agent name","Flow name","Configured maximum","Observed turn count"],"related":"Conversation Ended at Maximum Turns, Flow Takes Unexpected Path"},{"id":"sub-agent-not-reached-wrong-agent-responds","section":"AI Agent Flows & Multi-Agent","title":"Sub-Agent Not Reached / Wrong Agent Responds","status":["Sub-Agent Not Reached / Wrong Agent Responds"],"statusVerified":false,"type":"Configuration Condition","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"In a multi-agent setup, control did not transfer to the expected sub-agent, or a different agent than expected responded.","causes":["The sub-agent isn't correctly configured or assigned","Orchestration/prompt logic didn't hand off control as intended","A model/provider-specific limitation affected multi-agent handoff"],"actions":["Identify the main agent and the expected sub-agent for this scenario.","Inspect conversation logs around the point where handoff should have occurred.","Confirm the sub-agent is correctly configured and assigned."],"escalate":"Contact AudioCodes with the conversation log if configuration looks correct and handoff still isn't happening as expected.","evidence":["Call ID / conversation identifier","Main agent name","Expected sub-agent name","Timestamp","AI Agent logs"],"related":"Flow Takes Unexpected Path"},{"id":"whatsapp-number-not-connected","section":"WhatsApp","title":"WhatsApp Number Not Connected","status":["WhatsApp Number Not Connected"],"statusVerified":false,"type":"Configuration Condition","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"The WhatsApp Business number isn't showing as connected in Live Hub.","causes":["The Meta/WhatsApp authorization flow wasn't completed","The connection was disconnected or revoked on the Meta side"],"actions":["Check the number's connection status under Voice Channels → WhatsApp Numbers.","If not connected, complete the WhatsApp/Meta authorization flow again."],"escalate":"Contact AudioCodes if the authorization flow completes successfully but the number still doesn't show as connected.","evidence":["WhatsApp number","Timestamp","Connection status shown"],"related":""},{"id":"whatsapp-message-failed","section":"WhatsApp","title":"WhatsApp Message Failed","status":["WhatsApp Message Failed"],"statusVerified":false,"type":"Symptom","investigate":"Meta / WhatsApp","actionability":"Sometimes self-service","meaning":"A WhatsApp message could not be delivered to the recipient, and WhatsApp returned a delivery failure rather than a delivered/read receipt.","causes":["The customer service window with this recipient has closed and the message isn't an approved template","A template message was used but hasn't been approved","A Meta-side policy or account restriction is in effect","General delivery failure on Meta's side"],"actions":["Check whether the 24-hour conversation window with this recipient is open or closed.","If sending a template, confirm it's approved.","Check the WhatsApp Business Account status for any restriction."],"escalate":"Contact AudioCodes if the conversation window is open, the template (if used) is approved, and there's no account restriction, yet the message still fails.","evidence":["WhatsApp number","Recipient (where appropriate)","Timestamp","Template name if applicable","Message/error detail shown"],"related":"WhatsApp Conversation Window Closed, WhatsApp Template Not Approved"},{"id":"whatsapp-conversation-window-closed","section":"WhatsApp","title":"WhatsApp Conversation Window Closed","status":["WhatsApp Conversation Window Closed"],"statusVerified":false,"type":"Expected Event","investigate":"Meta / WhatsApp","actionability":"Usually self-service","meaning":"WhatsApp's customer service window closes after a period without a customer reply. Once closed, only approved template messages can be sent until the customer messages again.","causes":["More time has passed since the customer's last message than the WhatsApp-defined window allows","The window only resets from a genuine customer-initiated message — an agent or automated reply does not reopen it"],"actions":["Check the timestamp of the customer's last inbound message to confirm whether the window should be open or closed.","If you need to reach the customer, use an approved template message."],"escalate":"Contact AudioCodes if the window appears closed despite a recent customer reply.","evidence":["WhatsApp number","Recipient","Timestamp of last customer message"],"related":"WhatsApp Message Failed"},{"id":"whatsapp-template-not-approved","section":"WhatsApp","title":"WhatsApp Template Not Approved","status":["WhatsApp Template Not Approved"],"statusVerified":false,"type":"Configuration Condition","investigate":"Meta / WhatsApp","actionability":"Usually self-service","meaning":"A message template hasn't completed Meta's approval process yet, so it can't be used to start a conversation outside the customer service window.","causes":["The template is still pending review","The template was rejected during review"],"actions":["Check the template's status in your WhatsApp template management."],"escalate":"Contact AudioCodes if the template shows approved but still can't be used to send messages.","evidence":["Template name","Current template status"],"related":"WhatsApp Message Failed"},{"id":"whatsapp-business-account-restricted","section":"WhatsApp","title":"WhatsApp Business Account Restricted","status":["WhatsApp Business Account Restricted"],"statusVerified":false,"type":"Warning","investigate":"Meta / WhatsApp","actionability":"Sometimes self-service","meaning":"Meta has placed a restriction on the WhatsApp Business Account, which can affect the ability to send messages.","causes":["A Meta-side policy or quality restriction has been applied to the business account","Restrictions are commonly triggered by a drop in message quality rating, a spike in blocks/reports from recipients, or a policy violation flagged by Meta’s automated review"],"actions":["Check the WhatsApp Business Account status and any notifications from Meta about the restriction."],"escalate":"Contact AudioCodes for help understanding the restriction — resolving it typically requires coordination with Meta.","evidence":["WhatsApp number","Business account name","Any restriction message/notice received"],"related":"WhatsApp Message Failed"},{"id":"expected-recording-is-missing","section":"Recording & Transcription","title":"Expected Recording Is Missing","status":["Expected Recording Is Missing"],"statusVerified":false,"type":"Symptom","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"A recording that was expected for a call cannot be found. This isn't automatically a processing failure — recording depends on routing configuration, retention settings, and access permissions, and any of these can explain a missing recording.","causes":["The routing rule that matched the call didn't have recording enabled","The call wasn't actually established","The recording has been removed under the account's retention policy","External recording was used instead of Live Hub recording","The viewing user doesn't have permission to access it"],"actions":["Confirm which routing rule matched the call, and whether recording (Live Hub or external) was enabled on it.","Confirm the call was actually established (not just attempted).","Check whether the recording may have been removed under retention/lifecycle settings.","Confirm the current user has permission to view recordings for this call.","Check the recording area within Calls → Call History for this call."],"escalate":"Contact AudioCodes with the Call ID if the matched routing rule had recording enabled, retention hasn't expired, and permissions are correct, yet the recording still doesn't appear.","evidence":["Call ID","Timestamp and time zone","Routing rule/service expected","Current status shown in Call History"],"related":"Recording Retention Expired, Recording Still Processing"},{"id":"recording-still-processing","section":"Recording & Transcription","title":"Recording Still Processing","status":["Recording Still Processing"],"statusVerified":false,"type":"Expected Event","investigate":"Live Hub","actionability":"Usually self-service","meaning":"The call recording exists but hasn't finished processing yet, so it isn't viewable immediately.","causes":["Normal processing delay after call completion","Longer calls, or higher account-wide recording volume at the same time, can extend how long processing takes"],"actions":["Wait a short period and check Call History again for the recording."],"escalate":"Contact AudioCodes if the recording remains in a processing state for an extended period.","evidence":["Call ID","Timestamp","How long the recording has shown as processing"],"related":"Expected Recording Is Missing"},{"id":"recording-retention-expired","section":"Recording & Transcription","title":"Recording Retention Expired","status":["Recording Retention Expired"],"statusVerified":false,"type":"Expected Event","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"Live Hub can automatically remove outdated recordings and transcripts according to the account's retention configuration. An old recording no longer being available may reflect this lifecycle behavior rather than a fault.","causes":["The recording's age exceeded the configured retention period","Retention is usually set account-wide, so if the removal timing is unexpected, the configured period may not match what was assumed when the account was set up"],"actions":["Check the account's configured retention period against the age of the recording you're looking for."],"escalate":"Contact AudioCodes if the recording should still be within the retention window but isn't available.","evidence":["Call ID","Approximate date of the call","Configured retention period if known"],"related":"Expected Recording Is Missing"},{"id":"transcript-not-available","section":"Recording & Transcription","title":"Transcript Not Available","status":["Transcript Not Available"],"statusVerified":false,"type":"Symptom","investigate":"Live Hub","actionability":"Usually self-service","meaning":"A transcript expected for a call or recording cannot be found.","causes":["Transcription wasn't enabled for this call","The transcript is still being generated","The underlying recording is missing or was removed under retention"],"actions":["Confirm transcription was enabled for this call via the matched routing rule or agent configuration.","Check whether the transcript may still be generating.","Confirm the underlying recording exists and hasn't been removed under retention."],"escalate":"Contact AudioCodes with the Call ID if transcription was enabled, sufficient time has passed, and the recording exists, but the transcript is still missing.","evidence":["Call ID","Timestamp","Whether transcription was enabled for this call"],"related":"Expected Recording Is Missing, Recording Retention Expired"},{"id":"cannot-sign-in-authentication-failure","section":"Users, Authentication & Permissions","title":"Cannot Sign In (Authentication Failure)","status":["Cannot Sign In (Authentication Failure)"],"statusVerified":false,"type":"Symptom","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"A user cannot sign in to Live Hub. This is a question of authentication — confirming who the user is — which is distinct from authorization (what they're allowed to do) once signed in.","causes":["Incorrect username/password for local authentication","Microsoft/Entra ID authentication issue for organizations using Microsoft sign-in","MFA step not completed successfully","The account is disabled"],"actions":["Confirm which sign-in method applies (local Live Hub credentials vs. Microsoft/Entra ID).","For local sign-in, confirm the username and attempt a password reset if needed.","For Microsoft sign-in, confirm the user can authenticate normally with Microsoft outside of Live Hub.","Confirm MFA, if enabled, is completing successfully."],"escalate":"Contact AudioCodes if credentials and MFA are confirmed correct and sign-in still fails, or if the account may be disabled.","evidence":["Affected username/email","Sign-in method used (local or Microsoft)","Exact error message shown","Timestamp"],"related":"Insufficient Permissions For Action"},{"id":"insufficient-permissions-for-action","section":"Users, Authentication & Permissions","title":"Insufficient Permissions For Action","status":["Insufficient Permissions For Action"],"statusVerified":false,"type":"Configuration Condition","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"A signed-in user cannot perform an action or see a menu/resource they expect to. Access to Live Hub resources is controlled through IAM, user groups, and policies — a missing menu or blocked action is typically a permissions matter, not a platform failure.","causes":["The user's assigned user group/policy doesn't grant access to this resource or action","The user isn't a member of the account where the resource exists"],"actions":["Check the user's assigned user group(s) and policies under account IAM settings.","Confirm the user is a member of the correct account (especially in parent/subaccount setups)."],"escalate":"Contact AudioCodes if the user's assigned permissions should cover this action and it's still blocked.","evidence":["Affected username","Action/resource attempted","Assigned user group/role if known","Timestamp"],"related":"Cannot Sign In (Authentication Failure)"},{"id":"user-authentication-session-expired","section":"Users, Authentication & Permissions","title":"User Authentication Session Expired","status":["User Authentication Session Expired"],"statusVerified":false,"type":"Expected Event","investigate":"Live Hub","actionability":"Usually self-service","meaning":"The user's Live Hub portal sign-in session has expired and they need to sign in again. This is separate from an AI Agent conversation session expiring.","causes":["Normal session timeout after a period of inactivity or elapsed time","Signing in from a new device or browser, or an administrator-forced sign-out policy, can also end a session earlier than the normal inactivity timeout"],"actions":["Sign in again to start a new session."],"escalate":"Contact AudioCodes if sessions are expiring much faster than expected during active use.","evidence":["Affected username","Approximate session duration observed"],"related":"Agent/Conversation Session Expired"},{"id":"api-client-access-denied","section":"Users, Authentication & Permissions","title":"API Client Access Denied","status":["API Client Access Denied"],"statusVerified":false,"type":"Configuration Condition","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"An API Client (a non-human, programmatic user) was denied access to an endpoint or action.","causes":["The API Client's assigned user group/permissions don't cover this endpoint or action","The client secret in use is outdated or was rotated"],"actions":["Check the API Client's assigned user group/permissions.","Confirm the client secret configured in the calling system is current — do not send the secret itself anywhere, including to AudioCodes Support."],"escalate":"Contact AudioCodes with the API Client name/ID, the endpoint or action attempted, and the HTTP status/error returned if permissions appear correct.","evidence":["API Client name/ID (not the secret)","Endpoint/action attempted","HTTP status/error returned","Timestamp"],"related":"Insufficient Permissions For Action"},{"id":"post-call-analysis-webhook-failed","section":"Integrations & Webhooks","title":"Post-Call Analysis Webhook Failed","status":["Post-Call Analysis Webhook Failed"],"statusVerified":false,"type":"Error","investigate":"Third-Party Integration","actionability":"Sometimes self-service","meaning":"A post-call analysis result (such as a summary or structured extraction) failed to deliver to your configured webhook endpoint. Live Hub records a response_status and response_text for each delivery attempt — an HTTP 2xx status means successful transmission, an HTTP 4xx/5xx means the receiving endpoint returned an error, and a status of 700 specifically indicates the delivery attempt timed out.","causes":["The receiving endpoint returned an error (4xx/5xx)","The receiving endpoint didn't respond in time (status 700)","The endpoint URL or authentication configured is incorrect"],"actions":["Check the recorded response_status and response_text for the delivery attempt.","If 4xx/5xx, review your endpoint's own logs for why it rejected the request.","If status 700, confirm your endpoint responds quickly enough and is reachable."],"escalate":"Contact AudioCodes if response_status/response_text don't clearly explain the failure, or if you need help confirming what Live Hub actually sent.","evidence":["Call ID / conversation identifier","Agent name","Timestamp","Recorded response_status and response_text","Endpoint URL (without embedded credentials)"],"related":""},{"id":"third-party-tool-api-failed","section":"Integrations & Webhooks","title":"Third-Party Tool/API Failed","status":["Third-Party Tool/API Failed"],"statusVerified":false,"type":"Symptom","investigate":"Third-Party Integration","actionability":"Sometimes self-service","meaning":"A call from Live Hub to a connected third-party service (a CRM, ticketing system, or other external API) did not complete successfully.","causes":["The third-party service is unavailable","Authentication to the third-party service failed","The request sent didn't match what the service expects"],"actions":["Test the third-party endpoint independently of Live Hub, if possible, to confirm it's healthy.","Confirm authentication/credentials configured for the integration are current."],"escalate":"Contact AudioCodes with the sanitized request/response if the third-party endpoint is confirmed healthy and the failure persists from Live Hub.","evidence":["Integration/tool name","Timestamp","HTTP status if exposed","Sanitized request/response (no credentials)"],"related":"Post-Call Analysis Webhook Failed, Tool Call Failed or Timed Out"},{"id":"account-inactive-broad-service-failure","section":"Billing, Account State & Licensing","title":"Account Inactive — Broad Service Failure","status":["Account Inactive — Broad Service Failure"],"statusVerified":false,"type":"Limit / Entitlement","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"Many unrelated functions are failing at once. Before assuming a technical outage, check account balance and state — a trial account with zero or negative credit becomes inactive, and an inactive account cannot handle calls through bots or SIP connections and blocks management of certain resources.","causes":["The account's prepaid balance is depleted","A trial account has reached zero or negative credit"],"actions":["Check the account's plan, balance, and active/inactive status.","Check Alarms and Alarm History for related warnings (e.g. low-funds thresholds).","Once balance/state is ruled out, determine whether the failure affects all calls, one provider, one region, Teams only, one AI provider, one agent, or one routing rule — narrowing the scope before assuming a platform-wide issue."],"escalate":"Contact AudioCodes if the account is active with sufficient balance and the broad failure continues.","evidence":["Account name","Timestamp","Scope of affected functionality (all calls / specific provider / specific region / etc.)"],"related":"Insufficient Funds / Trial Restriction"},{"id":"feature-not-available-on-current-plan","section":"Billing, Account State & Licensing","title":"Feature Not Available on Current Plan","status":["Feature Not Available on Current Plan"],"statusVerified":false,"type":"Limit / Entitlement","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"A feature being used isn't included in the account's current plan or entitlement.","causes":["The plan doesn't include this feature","The feature requires a specific add-on or tier"],"actions":["Review the account's current plan and entitlements."],"escalate":"Contact AudioCodes to discuss adding this feature to your plan.","evidence":["Account name","Feature in question"],"related":"Insufficient Funds / Trial Restriction"},{"id":"concurrent-call-limit-reached","section":"Capacity & Limits","title":"Concurrent Call Limit Reached","status":["Max traffic limits exceeded"],"statusVerified":true,"type":"Limit / Entitlement","investigate":"Customer Configuration","actionability":"Sometimes self-service","meaning":"New calls are being rejected because the account or a specific voice entity has reached its configured maximum concurrent-call limit.","causes":["Call volume has genuinely exceeded the configured concurrency limit","A stuck call that never properly released can occupy a concurrency slot without an active conversation actually happening"],"actions":["Check Alarms and Alarm History for a maximum-concurrent-calls threshold alert.","Review which account/entity the limit applies to."],"escalate":"Contact AudioCodes to review the current limit and discuss an increase if this volume is expected to continue.","evidence":["Account/entity name","Timestamp","Approximate call volume at the time"],"related":"CPS Limit Reached"},{"id":"cps-limit-reached","section":"Capacity & Limits","title":"CPS Limit Reached","status":["CPS Limit Reached"],"statusVerified":false,"type":"Limit / Entitlement","investigate":"Customer Configuration","actionability":"Sometimes self-service","meaning":"Calls are failing specifically during bursts because the configured Calls Per Second (CPS) threshold has been exceeded.","causes":["A traffic burst exceeded the configured CPS limit for the account or entity","A dialer, bulk campaign, or retry storm — many calls retried in a short window right after a failure — is a common trigger even when total daily volume is normal"],"actions":["Check Alarms and Alarm History for a CPS-related threshold alert.","Review the timing of the failures against known traffic spikes."],"escalate":"Contact AudioCodes to review the current CPS limit and discuss an increase if bursts like this are expected.","evidence":["Account/entity name","Timestamp of the burst","Approximate CPS observed if known"],"related":"Concurrent Call Limit Reached"},{"id":"rejected-calls-due-to-limit-exceeded","section":"Capacity & Limits","title":"Rejected Calls Due to Limit Exceeded","status":["Rejected Calls Due to Limit Exceeded"],"statusVerified":false,"type":"Limit / Entitlement","investigate":"Customer Configuration","actionability":"Sometimes self-service","meaning":"Calls are being explicitly rejected because a configured limit was exceeded. Live Hub supports alarm thresholds specifically for calls rejected due to limits being exceeded.","causes":["Concurrent call, CPS, or another configured limit was exceeded","This is a summary/alarm-level indicator rather than one specific mechanism — check Concurrent Call Limit Reached and CPS Limit Reached individually for which one actually applies"],"actions":["Check Alarms and Alarm History for a rejected-calls-due-to-limit-exceeded alert around the affected time."],"escalate":"Contact AudioCodes to review which specific limit is being hit and discuss adjusting it.","evidence":["Account/entity name","Timestamp","Alarm details if available"],"related":"Concurrent Call Limit Reached, CPS Limit Reached"},{"id":"ai-rate-or-quota-limit-reached-capacity","section":"Capacity & Limits","title":"AI Rate or Quota Limit Reached (Capacity)","status":["AI Rate or Quota Limit Reached (Capacity)"],"statusVerified":false,"type":"Limit / Entitlement","investigate":"AI / Speech Provider","actionability":"Sometimes self-service","meaning":"See AI Agents & Conversations → AI Rate or Quota Limit Reached. Listed here for discoverability under capacity/limit topics.","causes":["Request volume to the configured AI model/provider exceeded the applicable limit","The account may be using a shared AI provider quota across multiple agents, so unrelated agents can contribute to hitting the same limit"],"actions":["Review AI Agent logs around the affected time for rate/quota-related messages."],"escalate":"Contact AudioCodes to review the applicable limit and discuss increasing it.","evidence":["Agent name","Model/provider","Timestamp","Call recording, if one was captured for this call/conversation"],"related":"AI Rate or Quota Limit Reached"},{"id":"phone-number-provisioning-failed","section":"Account & Provisioning","title":"Phone Number Provisioning Failed","status":["Phone Number Provisioning Failed"],"statusVerified":false,"type":"Error","investigate":"Live Hub","actionability":"Sometimes self-service","meaning":"A new phone number failed to be provisioned onto the account.","causes":["The number is already in use elsewhere","A required configuration step wasn't completed"],"actions":["Confirm the number isn't already assigned elsewhere in the account.","Retry the provisioning steps and confirm each required field is completed."],"escalate":"Contact AudioCodes if provisioning continues to fail after confirming the number is available and all required fields are complete.","evidence":["Number being provisioned","Timestamp","Exact error shown if any"],"related":""},{"id":"resource-already-exists","section":"Account & Provisioning","title":"Resource Already Exists","status":["Resource Already Exists"],"statusVerified":false,"type":"Configuration Condition","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"A resource (such as a routing rule, agent, or connection) could not be created because one with the same name/identifier already exists.","causes":["A resource with this name already exists in the account","This commonly happens when a resource was actually created successfully on a previous attempt that appeared to fail, and the retry reused the same name"],"actions":["Search for an existing resource with the same name before creating a new one, and rename if needed."],"escalate":"Contact AudioCodes if no visibly conflicting resource exists and creation still fails with this message.","evidence":["Resource type and intended name","Timestamp"],"related":""},{"id":"sip-connection-not-reachable","section":"Platform & Connectivity","title":"SIP Connection Not Reachable","status":["SIP Connection Not Reachable"],"statusVerified":false,"type":"Symptom","investigate":"Multiple Possible Sources","actionability":"Sometimes self-service","meaning":"A configured SIP connection cannot be reached, affecting calls that depend on it.","causes":["The remote SBC or SIP trunk endpoint is down or unreachable","A firewall or network path issue is blocking connectivity","The connection's configuration (address, port, credentials) is incorrect"],"actions":["Check the SIP connection's configuration under Voice Channels → SIP Connections.","Check Alarms and Alarm History for related connectivity alerts.","Confirm with your network/carrier that the remote endpoint is reachable."],"escalate":"Contact AudioCodes if the configuration is confirmed correct and the remote endpoint is confirmed reachable, yet Live Hub still can't connect.","evidence":["SIP connection name","Timestamp","Alarm details if available"],"related":"503 Service Unavailable, 408 Request Timeout"},{"id":"tls-certificate-issue","section":"Platform & Connectivity","title":"TLS/Certificate Issue","status":["TLS/Certificate Issue"],"statusVerified":false,"type":"Symptom","investigate":"Multiple Possible Sources","actionability":"Sometimes self-service","meaning":"A secure connection (TLS) failed to establish, commonly due to a certificate problem.","causes":["An expired or soon-to-expire certificate on either side","A certificate not trusted by the receiving party","A hostname/FQDN mismatch"],"actions":["Check the relevant certificate's expiry date and issuing authority.","Confirm the hostname/FQDN in the certificate matches the configuration in use."],"escalate":"Contact AudioCodes if the certificate is valid, trusted, and matches, and the TLS failure persists.","evidence":["Affected connection name","Timestamp","Certificate expiry date if known"],"related":"SIP Connection Not Reachable"},{"id":"unknown-error-unspecified-platform-failure","section":"Platform & Connectivity","title":"Unknown Error (Unspecified Platform Failure)","status":["Unknown error","Uknown error"],"statusVerified":true,"type":"Error","investigate":"Live Hub","actionability":"Support investigation usually required","meaning":"An unexpected platform-level error occurred and Live Hub could not identify a more specific cause.","causes":["An edge case occurred that isn’t mapped to a specific, named error","This is a deliberate catch-all rather than a specific diagnosis — it exists so a call or action doesn’t fail completely silently, even when the platform can’t further classify what happened"],"actions":["Note the exact time and any pattern (same call type, same route, same integration) around when it occurs.","Check Alarms and Alarm History for anything related at the same time."],"escalate":"Contact AudioCodes — this result doesn’t point to a specific self-service fix, so Support will need to investigate the underlying cause.","evidence":["Call ID or conversation identifier","Timestamp and time zone","What you observed vs. what you expected"],"related":"Protocol Error, Unspecified"},{"id":"temporary-failure-transient-system-error","section":"Platform & Connectivity","title":"Temporary Failure (Transient System Error)","status":["Temporary failure"],"statusVerified":true,"type":"Warning","investigate":"Multiple Possible Sources","actionability":"Usually self-service","meaning":"A short-lived network, carrier, or service issue affected the call or action. Live Hub is explicitly flagging this as transient rather than a persistent failure.","causes":["A brief network hiccup, carrier-side blip, or momentary service unavailability occurred","Live Hub distinguishes this from a hard failure specifically because a retry is expected to succeed — if it doesn’t clear on retry, the underlying issue is no longer transient"],"actions":["Retry the call or action — transient failures typically resolve on their own.","If it keeps recurring for the same destination or integration, that’s no longer \"temporary\" and is worth a closer look."],"escalate":"Contact AudioCodes if this result keeps recurring rather than clearing on retry.","evidence":["Call ID or conversation identifier","Timestamp and time zone","How often it’s recurring"],"related":"Unknown Error (Unspecified Platform Failure)"},{"id":"idle-endpoint-session-inactivity-timeout","section":"Platform & Connectivity","title":"Idle Endpoint / Session Inactivity Timeout","status":["Idle Endpoint"],"statusVerified":true,"type":"Symptom","investigate":"Live Hub","actionability":"Usually self-service","meaning":"The endpoint on the call or session stopped responding or generating activity, and Live Hub ended it as idle.","causes":["The far end stopped sending expected signaling or media activity","A device, app, or integration on one side hung or lost its connection without a clean disconnect"],"actions":["Check whether this is isolated to one endpoint, device, or integration.","If it’s a recurring device or app, confirm it isn’t losing network connectivity mid-session."],"escalate":"Contact AudioCodes if idle-endpoint results are happening across multiple sessions or endpoints without a clear device-side cause.","evidence":["Call ID or conversation identifier","Timestamp and time zone"],"related":"403 Remote Is Disconnected"},{"id":"system-recovery-after-timeout","section":"Platform & Connectivity","title":"System Recovery After Timeout","status":["Recovery on timer expiry"],"statusVerified":true,"type":"Warning","investigate":"Live Hub","actionability":"Usually self-service","meaning":"A timeout occurred on the call or session, and Live Hub’s recovery process activated to bring it to a clean end state.","causes":["A component or step in the call flow didn’t complete within its expected time window, triggering recovery handling","Seeing this result is itself evidence the recovery mechanism worked as intended — the concerning signal is how often it fires, not that it fired once"],"actions":["Check what the call/session was doing right before this point (which flow step, tool call, or media wait) to see what actually timed out."],"escalate":"Contact AudioCodes if this is affecting a specific flow or integration repeatedly.","evidence":["Call ID or conversation identifier","Timestamp and time zone","Flow or step where it occurred, if known"],"related":"Internal Call-Leg Timeout (Low-Level)"},{"id":"internal-call-leg-timeout-low-level","section":"Platform & Connectivity","title":"Internal Call-Leg Timeout (Low-Level)","status":["Subsystem Id: ICALLLEG Cause Code: Timeout"],"statusVerified":true,"type":"Warning","investigate":"Live Hub","actionability":"Support investigation usually required","meaning":"An internal Live Hub call-processing component timed out while handling this call leg. This is a low-level, engineering-style result rather than a customer-configurable one.","causes":["An internal processing step for this call leg didn’t complete in time","Because this sits below customer-configurable settings, a recurring pattern is more informative than a single occurrence"],"actions":["Note the exact time and any pattern in what type of call this affects."],"escalate":"Contact AudioCodes with the Call ID — this result generally requires backend investigation rather than self-service checks.","evidence":["Call ID","Timestamp and time zone"],"related":"System Recovery After Timeout"},{"id":"interworking-issue-unspecified","section":"Platform & Connectivity","title":"Interworking Issue, Unspecified","status":["Interworking unspecified"],"statusVerified":true,"type":"Error","investigate":"Carrier / Network","actionability":"Support investigation usually required","meaning":"A compatibility issue occurred between Live Hub and an interconnected carrier or system, without a more specific cause identified.","causes":["Two interconnected systems (for example, Live Hub and a carrier network) disagreed on how to handle some part of the call","This can also surface after a carrier or upstream provider makes an unannounced change to their own signaling behavior"],"actions":["Check whether this is isolated to one carrier route or destination."],"escalate":"Contact AudioCodes with the Call ID and destination — interworking issues usually need coordination with the carrier or upstream system.","evidence":["Call ID","Timestamp and time zone","Destination/carrier route involved"],"related":"Protocol Error, Unspecified"},{"id":"active-alarm-on-account","section":"Alarms & Monitoring","title":"Active Alarm on Account","status":["Active Alarm on Account"],"statusVerified":false,"type":"Warning","investigate":"Live Hub","actionability":"Usually self-service","meaning":"Live Hub is showing an active alarm on the account. Alarms are early-warning indicators with their own severity levels — Critical, Major, Minor, Warning, or Cleared — used for account-wide monitoring.","causes":["A monitored threshold (failed calls, poor-quality calls, concurrency, CPS, rejected calls, remaining funds, etc.) has been crossed","The alarm may reflect a leading indicator — for example, approaching a limit — rather than an outage already in progress; the alarm’s own severity and description say which"],"actions":["Open the Alarms view to see the alarm's time, severity, type, description, and region.","Match the alarm type to the relevant section of this guide (for example, a funds alarm relates to Billing, Account State & Licensing; a CPS alarm relates to Capacity & Limits)."],"escalate":"Contact AudioCodes if the alarm's described condition doesn't match what you're observing, or if a Critical/Major alarm doesn't clear after the underlying condition is resolved.","evidence":["Alarm time, severity, type, and description","Affected region"],"related":"Concurrent Call Limit Reached, CPS Limit Reached, Insufficient Funds / Trial Restriction"},{"id":"intermittent-issue-with-no-currently-active-alarm","section":"Alarms & Monitoring","title":"Intermittent Issue With No Currently Active Alarm","status":["Intermittent Issue With No Currently Active Alarm"],"statusVerified":false,"type":"Symptom","investigate":"Live Hub","actionability":"Usually self-service","meaning":"You experienced a problem, but no alarm is currently active. The absence of a currently active alarm doesn't prove no problem occurred — check Alarm History rather than only the live Alarms view.","causes":["The condition was transient and has since cleared","The issue occurred outside the window you're currently viewing"],"actions":["Open Alarm History and search around the specific time the issue was reported, rather than only checking current/active alarms."],"escalate":"Contact AudioCodes with the specific time of the reported issue if Alarm History shows nothing relevant.","evidence":["Timestamp and time zone of the reported issue","Description of what was observed"],"related":"Active Alarm on Account"},{"id":"caller-cancelled-before-answer","section":"Not Errors / Expected Events","title":"Caller Cancelled Before Answer","status":["Cancel","ORIGINATOR_CANCEL"],"statusVerified":true,"type":"Expected Event","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"The caller ended the call attempt before the destination answered.","causes":["The caller hung up, pressed end call, or their calling app cancelled the attempt before the destination picked up"],"actions":["No action needed for normal, occasional occurrences."],"escalate":"Contact AudioCodes only if this is happening at an unusually high rate relative to total call volume.","evidence":["Call ID","Timestamp"],"related":"487 Request Terminated"},{"id":"destination-busy-or-declined","section":"Not Errors / Expected Events","title":"Destination Busy or Declined","status":["Destination Busy or Declined"],"statusVerified":false,"type":"Expected Event","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"The destination was legitimately busy or actively declined the call.","causes":["The destination device signaled it was already in use, or the person/system actively rejected the incoming call"],"actions":["Investigate only if all calls to a destination return busy/declined unexpectedly, multiple destinations are affected, or the result conflicts with the destination's known state."],"escalate":"Contact AudioCodes if busy/decline results conflict with a destination confirmed to be available.","evidence":["Call ID","Timestamp","Called number"],"related":"Busy"},{"id":"call-completed-and-ended-normally","section":"Not Errors / Expected Events","title":"Call Completed and Ended Normally","status":["Bye","Bye received from remote","User ends call","User Triggered","Normal call clear","Normal End Of Call","Normal, unspecified","Call ended successfully","Completion status","OK"],"statusVerified":true,"type":"Expected Event","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"The call connected and both parties disconnected normally when finished.","causes":["Either party ended the call after the conversation concluded, using a standard call-teardown signal"],"actions":["No action needed — this is expected, normal behavior."],"escalate":"No escalation needed.","evidence":["—"],"related":""},{"id":"conversation-completed-as-designed","section":"Not Errors / Expected Events","title":"Conversation Completed as Designed","status":["Conversation Completed as Designed"],"statusVerified":false,"type":"Expected Event","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"The AI Agent conversation reached its intended conclusion and ended.","causes":["The AI Agent’s flow or logic reached its defined end state — for example, the caller’s request was resolved or handed off as intended"],"actions":["No action needed — this is expected, normal behavior."],"escalate":"No escalation needed.","evidence":["—"],"related":""},{"id":"maximum-call-duration-reached-expected","section":"Not Errors / Expected Events","title":"Maximum Call Duration Reached (Expected)","status":["Maximum Call Duration Reached (Expected)"],"statusVerified":false,"type":"Expected Event","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"The call ended because it reached a configured maximum-duration limit — this is designed behavior, not a failure.","causes":["A configured maximum-duration limit — account-level or on the specific voice entity — was reached, and the call ended automatically as designed"],"actions":["Confirm against the configured maximum duration if you want to verify the exact limit in effect."],"escalate":"Contact AudioCodes if the call ended before any configured maximum duration was reached.","evidence":["Call ID","Observed duration"],"related":"Call Limit / Maximum Call Duration Reached"},{"id":"old-recording-or-transcript-no-longer-available-retention","section":"Not Errors / Expected Events","title":"Old Recording or Transcript No Longer Available (Retention)","status":["Old Recording or Transcript No Longer Available (Retention)"],"statusVerified":false,"type":"Expected Event","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"The recording or transcript was removed automatically because it exceeded the account's configured retention period.","causes":["The recording or transcript’s age passed the account’s configured retention period, and it was removed automatically"],"actions":["Check the configured retention period against the age of the item you're looking for."],"escalate":"Contact AudioCodes if the item should still be within the retention window.","evidence":["Call ID","Approximate date of the call","Configured retention period if known"],"related":"Recording Retention Expired"},{"id":"no-user-input-handled-normally","section":"Not Errors / Expected Events","title":"No-User-Input Handled Normally","status":["No-User-Input Handled Normally"],"statusVerified":false,"type":"Expected Event","investigate":"Live Hub","actionability":"Usually self-service","meaning":"The caller was silent, and the AI Agent handled it using its configured no-user-input behavior (such as repeating a prompt, transferring, or ending the call).","causes":["The caller didn’t speak or provide input within the expected window, and the agent’s configured no-input handling — a reprompt, fallback message, or graceful call end — took over as designed"],"actions":["Review the prompt/Flow configuration if you want to confirm the exact configured behavior."],"escalate":"Contact AudioCodes if the observed handling doesn't match what's configured.","evidence":["Call ID / conversation identifier","Agent name"],"related":"No User Input Event"},{"id":"user-signed-out","section":"Not Errors / Expected Events","title":"User Signed Out","status":["User Signed Out"],"statusVerified":false,"type":"Expected Event","investigate":"Customer Configuration","actionability":"Usually self-service","meaning":"The user signed out of Live Hub, either manually or because their session ended.","causes":["The user clicked sign out, or their session ended due to an inactivity timeout or an administrator-forced sign-out"],"actions":["Sign in again to continue."],"escalate":"Contact AudioCodes if sign-outs are happening much more frequently than expected during active use.","evidence":["Username","Approximate frequency if recurring"],"related":"User Authentication Session Expired"},{"id":"teams-connection-shows-creating","section":"Not Errors / Expected Events","title":"Teams Connection Shows 'Creating'","status":["Teams Connection Shows 'Creating'"],"statusVerified":false,"type":"Expected Event","investigate":"Microsoft Teams","actionability":"Usually self-service","meaning":"A newly created Teams connection can briefly show a Creating status before becoming Active. This is expected provisioning behavior.","causes":["The connection was created recently and Microsoft Teams hasn’t finished provisioning it yet — this is a normal, temporary state"],"actions":["Allow a reasonable amount of time for provisioning before treating this as a problem."],"escalate":"Contact AudioCodes if the connection remains in Creating status well beyond the expected provisioning time.","evidence":["Teams connection name","How long it has shown Creating"],"related":"Teams Connection Not Active"},{"id":"alternate-routing-multiple-call-records-for-one-attempt","section":"Not Errors / Expected Events","title":"Alternate Routing / Multiple Call Records for One Attempt","status":["Alternate Routing / Multiple Call Records for One Attempt"],"statusVerified":false,"type":"Expected Event","investigate":"Live Hub","actionability":"Usually self-service","meaning":"You see more than one call record for what felt like a single call attemp /* ============ state (per-viewer, localStorage) ============ */
const SKEY = "lha_redesign_v1";
function loadState(){
  try{
    const raw = localStorage.getItem(SKEY);
    if(!raw) throw 0;
    return JSON.parse(raw);
  }catch(e){
    return { completed:[], xp:0, lastVisit:null, streak:0, quizBest:0 };
  }
}
let STATE = loadState();
if(!STATE.evidence) STATE.evidence = {};
function saveState(){ try{ localStorage.setItem(SKEY, JSON.stringify(STATE)); }catch(e){} }

function bumpStreak(){
  const today = new Date().toISOString().slice(0,10);
  if(STATE.lastVisit === today) return;
  if(STATE.lastVisit){
    const diff = (new Date(today) - new Date(STATE.lastVisit)) / 86400000;
    STATE.streak = diff === 1 ? (STATE.streak||0)+1 : 1;
  } else {
    STATE.streak = 1;
  }
  STATE.lastVisit = today;
  saveState();
}
bumpStreak();

function missionKey(trackId, lessonId){ return trackId + "::" + lessonId; }
function isDone(trackId, lessonId){ return STATE.completed.includes(missionKey(trackId, lessonId)); }
function trackDoneCount(trackId){ return lessonsFor(trackId).filter(l => isDone(trackId, l.id)).length; }
function trackPercent(trackId){
  const total = lessonsFor(trackId).length;
  return total ? Math.round((trackDoneCount(trackId) / total) * 100) : 0;
}
function trackIsComplete(trackId){
  const ls = lessonsFor(trackId);
  return ls.length > 0 && ls.every(l => isDone(trackId, l.id));
}
function firstIncompleteIndex(trackId){
  const ls = lessonsFor(trackId);
  const idx = ls.findIndex(l => !isDone(trackId, l.id));
  return idx === -1 ? Math.max(0, ls.length-1) : idx;
}
function level(){ return 1 + Math.floor(STATE.xp / 150); }
function xpToNext(){ return 150 - (STATE.xp % 150); }

function completeMission(trackId, lessonId){
  const key = missionKey(trackId, lessonId);
  if(STATE.completed.includes(key)) return { firstTime:false, pathJustCompleted:false };
  STATE.completed.push(key);
  STATE.xp += 15;
  const pathJustCompleted = trackIsComplete(trackId);
  if(pathJustCompleted) STATE.xp += 75;
  saveState();
  return { firstTime:true, pathJustCompleted };
}
function earnedBadges(){ return D.tracks.filter(t => trackIsComplete(t.id)); }

/* ============ confetti ============ */
function confettiBurst(big){
  try{
    const canvas = document.getElementById("confetti-canvas");
    const cctx = canvas.getContext && canvas.getContext("2d");
    if(!cctx) return;
    canvas.width = innerWidth; canvas.height = innerHeight;
    const colors = ["#00bcff","#005cff","#ba4cf6","#12b888","#f4b93e","#00ffff"];
    const n = big ? 160 : 70;
    const parts = Array.from({length:n},()=>({
      x: innerWidth/2 + (Math.random()-0.5)*(big?innerWidth*0.5:260),
      y: innerHeight*0.28 + (Math.random()-0.5)*40,
      vx:(Math.random()-0.5)*9, vy:-Math.random()*9-3, g:0.28+Math.random()*0.15,
      s:4+Math.random()*5, c:colors[(Math.random()*colors.length)|0], r:Math.random()*Math.PI, vr:(Math.random()-0.5)*0.3
    }));
    let frame=0;
    function tick(){
      frame++;
      cctx.clearRect(0,0,canvas.width,canvas.height);
      let alive=false;
      parts.forEach(p=>{
        p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        if(p.y < canvas.height+20) alive=true;
        cctx.save(); cctx.translate(p.x,p.y); cctx.rotate(p.r);
        cctx.fillStyle = p.c; cctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6);
        cctx.restore();
      });
      if(alive && frame < 220) requestAnimationFrame(tick);
      else cctx.clearRect(0,0,canvas.width,canvas.height);
    }
    tick();
  }catch(e){ /* decorative only - never block completion flow */ }
}

function toast(text, icon){

  el.className = "toast";

}

/* ============ ring svg ============ */
function ringSvg(pct, size, stroke){
  size = size||38; stroke = stroke||4;
  const r = (size-stroke)/2, c = 2*Math.PI*r, off = c - (pct/100)*c;
  return `<div class="ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}"><circle class="bg" cx="${size/2}" cy="${size/2}" r="${r}"/>
    <circle class="fg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>
    <div class="rlabel">${pct}%</div></div>`;
}

function animateHeroPreview(){
  const nodes = document.querySelectorAll("#hp-chain .hp-node");
  const rail = document.getElementById("hp-rail-fill");
  if(!nodes.length) return;
  let i = 0;
  clearInterval(window.__heroTimer);
  window.__heroTimer = setInterval(()=>{
    nodes.forEach((n,idx)=> n.classList.toggle("on", idx <= i));
    if(rail) rail.style.width = (i/(nodes.length-1))*100 + "%";
    i = (i+1) % (nodes.length+2);
    if(i === 0 && rail) rail.style.width = "0%";
  }, 750);
}

function missionMatches(query){const clean=query.toLowerCase().replace(/[^a-z0-9\s-]/g," ").trim();if(!clean)return[];const tokens=clean.split(/\s+/).filter(t=>t.length>2);const results=[];D.tracks.forEach(track=>lessonsFor(track.id).forEach((lesson,lessonIndex)=>{const hay=[track.title,track.description,track.scenario,lesson.title,lesson.objective,(lesson.path||[]).join(" "),lesson.commonMistake].filter(Boolean).join(" ").toLowerCase();let score=0;tokens.forEach(t=>{if(hay.includes(t))score+=2});if(score)results.push({track,lesson,lessonIndex,score})}));return results.sort((a,b)=>b.score-a.score).slice(0,3)}
function showGuideResult(query){const r=document.getElementById("guide-result"),m=missionMatches(query);if(!r)return;if(!m.length){r.className="guide-result show";r.innerHTML=`${msy("search_off")}<div><small>TRY A PRODUCT GOAL</small><strong>No exact Mission yet</strong><span>Try routing, SIP, Teams, AI Agent, billing, alarms, or failed call.</span></div>`;return;}const x=m[0];r.className="guide-result show";r.innerHTML=`${msy("auto_awesome")}<div><small>BEST NEXT MISSION</small><strong>${x.lesson.title}</strong><span>${x.track.title}</span></div><button type="button" onclick="go('#/track/${x.track.id}/mission/${x.lessonIndex}')">Open Mission</button>`}

        ${lessons.map((l,i)=>mapNodeHtml(t, l, i, nextIdx)).join("")}

      ${complete ? `<div class="path-complete-banner">${msy("military_tech")}<h3>${t.reward} earned</h3><p>Every mission in this path is proven and saved on this device.</p></div>` : ""}

function mapNodeHtml(track, lesson, index, nextIdx){
  const done = isDone(track.id, lesson.id);
  const unlocked = track.id !== "voice-agent" || index === 0 || done || isDone(track.id, lessonsFor(track.id)[index-1].id);
  const isCurrent = !done && unlocked && index === nextIdx;
  const side = index % 2 === 0 ? "L" : "R";
  const cls = done ? "done" : !unlocked ? "locked" : isCurrent ? "current" : "";
  const onclick = unlocked ? `onclick="go('#/track/${track.id}/mission/${index}')"` : "";
  return `<div class="map-node-row ${side}">
    <div class="map-node ${cls}">
      <div class="node-dot">${done ? msy("check") : !unlocked ? msy("lock") : (index+1)}</div>
      <div class="node-card" ${onclick}><strong>${lesson.title}</strong><small>${lesson.duration}</small></div>
    </div>
  </div>`;
}

  const lessons = lessonsFor(trackId);

  return `<section class="abb">
    <div class="abb-head">
      <div class="abb-title">
        <div class="abb-avatar">${msy("smart_toy",'style="font-size:22px"')}</div>

      <div class="abb-pct"><strong>${pct}%</strong><br/><small style="font-weight:700;color:#698093">BUILT</small></div>

  app.innerHTML = `
  <div class="mission-topbar"><div class="inner">
    <a class="back-btn" style="margin:0" onclick="go('#/track/${trackId}')">${msy("arrow_back")}</a>

  const slot = document.getElementById("capability-slot");

let quizIndex = 0, quizScore = 0, quizAnswered = false;
function renderQuiz(){
  quizIndex = 0; quizScore = 0;
  renderQuizQuestion();
}
function renderQuizQuestion(){
  const qs = D.knowledgeQuestions;
  if(quizIndex >= qs.length){ renderQuizResult(); return; }
  const q = qs[quizIndex];
  quizAnswered = false;
  app.innerHTML = `<div class="page quiz-wrap">
    <a class="back-btn" onclick="go('#/')">${msy("arrow_back")} Home</a>
    <div class="quiz-progress">${qs.map((_,i)=>`<span class="${i<quizIndex?'done':i===quizIndex?'cur':''}"></span>`).join("")}</div>
    <div class="quiz-card">
      <p class="quiz-q">${q.question}</p>
      <div id="quiz-opts">${q.options.map((o,i)=>`<button class="quiz-opt" data-i="${i}">${o}</button>`).join("")}</div>
      <div id="quiz-explain"></div>
      <div class="quiz-foot"><button class="btn btn-primary" id="quiz-next" style="display:none">${quizIndex===qs.length-1?"See results":"Next question"} ${msy("arrow_forward")}</button></div>
    </div>
  </div>`;
  document.querySelectorAll(".quiz-opt").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(quizAnswered) return;
      quizAnswered = true;
      const i = parseInt(btn.dataset.i,10);
      document.querySelectorAll(".quiz-opt").forEach(b=>b.disabled=true);
      if(i === q.correctIndex){ btn.classList.add("correct"); quizScore++; }
      else { btn.classList.add("wrong"); document.querySelector(`.quiz-opt[data-i="${q.correctIndex}"]`).classList.add("correct"); }
      document.getElementById("quiz-explain").innerHTML = `<div class="quiz-explain">${q.explanation}${q.sourceUrl?` <a href="${q.sourceUrl}" target="_blank" rel="noreferrer">Read the doc ${msy("open_in_new",'style="font-size:13px"')}</a>`:""}</div>`;
      document.getElementById("quiz-next").style.display = "inline-flex";
    });
  });
  document.getElementById("quiz-next").addEventListener("click", ()=>{ quizIndex++; renderQuizQuestion(); });
}
function renderQuizResult(){
  const qs = D.knowledgeQuestions;
  if(quizScore > (STATE.quizBest||0)){ STATE.quizBest = quizScore; STATE.xp += 20; saveState(); }
  confettiBurst(quizScore === qs.length);
  app.innerHTML = `<div class="page quiz-wrap">
    <div class="quiz-card quiz-result">
      ${msy("military_tech")}
      <h2>${quizScore} / ${qs.length}</h2>
      <p style="color:var(--muted)">Best score saved on this device: ${STATE.quizBest}/${qs.length}</p>
      <div class="hero-ctas" style="justify-content:center;margin-top:18px">
        <button class="btn btn-primary" onclick="go('#/quiz')">${msy("refresh")} Retake quiz</button>
        <button class="btn btn-ghost" onclick="go('#/')" style="color:var(--ink);border-color:var(--line)">Back home</button>
      </div>
    </div>
  </div>`;
  syncTopbar();
}
