<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Live Hub Academy · Build Your First Working Voice AI</title>
<meta name="description" content="A hands-on Live Hub learning experience for building, routing, calling and operating a real Voice AI deployment."/>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<style>@import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Rajdhani:wght@600;700&display=swap");
@import url("https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0");

:root{
  --ink:#050b18; --navy:#124680; --blue:#005cff; --cyan:#00bcff; --bcyan:#00ffff;
  --violet:#ba4cf6; --pink:#e64ca6; --green:#12b888; --amber:#f4b93e; --red:#e0503f;
  --paper:#f3f8fc; --line:#d7e3ee; --muted:#5a6b7f; --card:#ffffff;
  --radius:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Poppins",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:"Rajdhani",sans-serif;font-weight:700}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
.msy{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;font-size:20px;line-height:1;display:inline-block;vertical-align:middle;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#c7d8e4;border-radius:99px}

/* ===== layout shell ===== */
#topbar{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;align-items:center;justify-content:space-between;
  height:64px;padding:0 22px;background:rgba(5,17,38,.92);backdrop-filter:blur(10px);color:#fff;
  border-bottom:1px solid rgba(255,255,255,.08)}
.brand{display:flex;align-items:center;gap:10px;font:700 17px/1 "Rajdhani",sans-serif;letter-spacing:.01em}
.brand-mark{display:flex;height:22px;align-items:center;gap:2.5px}
.brand-mark span{width:3.5px;border-radius:99px;background:linear-gradient(#45e5ff,#1481ff)}
.brand-mark span:nth-child(1){height:10px}.brand-mark span:nth-child(2){height:20px}
.brand-mark span:nth-child(3){height:15px}.brand-mark span:nth-child(4){height:8px}
#topnav{display:flex;align-items:center;gap:4px}
#topnav button{padding:8px 14px;border-radius:99px;font-size:13.5px;font-weight:600;color:#b7c8dd}
#topnav button:hover{background:rgba(255,255,255,.08);color:#fff}
#topnav button.on{background:linear-gradient(135deg,#0a6dfb,#00bceb);color:#fff}
#topright{display:flex;align-items:center;gap:10px}
.pill-stat{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;background:rgba(255,255,255,.08);font-size:12.5px;font-weight:700;color:#fff;white-space:nowrap}
.pill-stat .msy{font-size:16px}
.pill-stat.xp{background:linear-gradient(135deg,rgba(0,188,235,.25),rgba(186,76,246,.2));border:1px solid rgba(0,188,235,.35)}
.pill-stat.streak .msy{color:#ffb54b}
#soundbtn{width:34px;height:34px;border-radius:99px;display:grid;place-items:center;background:rgba(255,255,255,.08);color:#fff}
#soundbtn:hover{background:rgba(255,255,255,.16)}
#burger{display:none;width:34px;height:34px;border-radius:99px;place-items:center;background:rgba(255,255,255,.08);color:#fff}

#app{padding-top:64px;min-height:100vh}
.page{max-width:1180px;margin:0 auto;padding:28px 24px 90px}
.kicker{display:inline-flex;align-items:center;gap:6px;font:700 11.5px/1 "Rajdhani",sans-serif;letter-spacing:.14em;color:var(--blue)}
.back-btn{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-weight:600;font-size:13px;margin-bottom:14px}
.back-btn:hover{color:var(--blue)}

/* ===== home hero ===== */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:clamp(34px,6vw,64px);margin-bottom:30px;color:#fff;
  background:radial-gradient(circle at 15% 0%,rgba(0,188,235,.35),transparent 40%),radial-gradient(circle at 90% 100%,rgba(186,76,246,.3),transparent 45%),linear-gradient(150deg,#050b18,#0a1f3d 55%,#0a2a52)}
.hero::after{content:"";position:absolute;inset:auto -100px -120px auto;width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,255,255,.1),transparent 70%)}
.hero-grid{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(34px,4.6vw,54px);line-height:1.04;margin:14px 0 16px;letter-spacing:-.01em}
.hero p.lead{max-width:520px;color:#b9cbe0;font-size:16px;line-height:1.65;margin:0 0 26px}
.hero-ctas{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:99px;font-weight:700;font-size:14.5px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#0a6dfb,#00d2ff);color:#00182f;box-shadow:0 14px 30px rgba(0,120,255,.35)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.18)}
.btn-ghost:hover{background:rgba(255,255,255,.15)}
.btn-dark{background:#0d1b30;color:#fff}
.btn-dark:hover{background:#132849}

/* mini build preview inside hero */
.hero-preview{position:relative;border-radius:20px;background:rgba(6,16,34,.55);border:1px solid rgba(255,255,255,.12);padding:20px}
.hero-preview small{font:700 10.5px/1 "Rajdhani",sans-serif;letter-spacing:.12em;color:#7fd8ff}
.hero-preview h3{margin:6px 0 14px;font-size:19px;color:#fff}
.hp-chain{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;position:relative}
.hp-rail{position:absolute;top:16px;left:7%;right:7%;height:2px;background:rgba(255,255,255,.14);border-radius:99px;z-index:0}
.hp-rail>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#0a6dfb,#00e5ff);transition:width .5s ease}
.hp-node{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:5px}
.hp-node .dot{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.08);color:#5f7b9c;border:1px solid rgba(255,255,255,.14);transition:all .4s}
.hp-node .dot .msy{font-size:16px}
.hp-node small{font-size:8.5px;font-weight:700;color:#5f7b9c;text-align:center}
.hp-node.on .dot{background:linear-gradient(145deg,#6bf0c6,#12b888);color:#003b2d;border-color:transparent;box-shadow:0 4px 12px rgba(18,184,136,.4)}
.hp-node.on small{color:#8bf0cf}

/* ===== continue card ===== */
.continue-card{display:flex;align-items:center;gap:18px;padding:18px 22px;border-radius:18px;margin-bottom:26px;
  background:#fff;border:1px solid var(--line);box-shadow:0 10px 26px rgba(5,43,81,.05)}
.continue-card .ring{flex:0 0 auto}
.continue-card h3{margin:0 0 3px;font-size:18px}
.continue-card p{margin:0;color:var(--muted);font-size:13px}
.continue-card .btn{margin-left:auto}

/* ===== stat strip ===== */
.stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:30px}
.stat-box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.stat-box strong{display:block;font:700 26px/1 "Rajdhani",sans-serif;color:var(--ink)}
.stat-box span{font-size:12px;color:var(--muted);font-weight:600}

/* ===== gallery ===== */
.gallery-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:8px 0 16px;flex-wrap:wrap}
.gallery-head h2{margin:0;font-size:24px}
.search-wrap{position:relative;width:260px}
.search-wrap .msy{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:18px}
.search-wrap input{width:100%;padding:10px 12px 10px 36px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:13.5px}
.search-wrap input:focus{outline:2px solid #b9d9ff}
.chip-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px}
.chip{padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:var(--muted)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.track-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:14px}
.track-card{position:relative;display:flex;flex-direction:column;gap:10px;background:#fff;border:1px solid var(--line);
  border-radius:18px;padding:18px;box-shadow:0 8px 22px rgba(5,43,81,.04);transition:transform .18s,box-shadow .18s}
.track-card:hover{transform:translateY(-3px);box-shadow:0 16px 30px rgba(5,43,81,.1)}
.tc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.tc-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:0 0 auto}
.tc-icon .msy{font-size:21px}
.tc-eyebrow{font:700 10px/1 "Rajdhani",sans-serif;letter-spacing:.1em;color:var(--muted);margin:2px 0 4px;display:block}
.tc-title{font-size:16.5px;font-weight:700;line-height:1.25;margin:0 0 4px;color:var(--ink)}
.tc-desc{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0;flex:1}
.tc-meta{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--muted);font-weight:600}
.tc-meta span{display:flex;align-items:center;gap:3px}
.tc-meta .msy{font-size:14px}
.tc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
.tc-reward{font-size:11px;font-weight:700;color:var(--navy)}
.ring{position:relative;width:38px;height:38px}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:#e6eef4}
.ring .fg{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring .rlabel{position:absolute;inset:0;display:grid;place-items:center;font-size:9.5px;font-weight:800;color:var(--ink)}
.badge-earned .ring .fg{stroke:var(--amber)}

/* color ramps for track icon tiles, by track.color */
.ct-cyan{background:linear-gradient(135deg,#7df2ff,#00bceb);color:#032d53}
.ct-blue{background:linear-gradient(135deg,#9fc4ff,#005cff);color:#00193c}
.ct-violet{background:linear-gradient(135deg,#e3b9ff,#ba4cf6);color:#320a54}
.ct-pink{background:linear-gradient(135deg,#ffc2df,#e64ca6);color:#4d0c2c}
.ct-green{background:linear-gradient(135deg,#a9f2d1,#12b888);color:#03301f}
.ct-amber{background:linear-gradient(135deg,#ffe2a1,#f4b93e);color:#3f2500}

/* ===== track map (path page) ===== */
.track-head{display:grid;grid-template-columns:1.3fr .9fr;gap:20px;margin-bottom:26px;align-items:stretch}
.track-head-main h1{font-size:clamp(26px,3.4vw,36px);margin:8px 0 10px;line-height:1.08}
.track-head-main p{color:var(--muted);font-size:14.5px;line-height:1.6;max-width:560px}
.stake-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.stake-card small{font:700 10.5px/1 "Rajdhani",sans-serif;letter-spacing:.1em;color:var(--muted)}
.stake-row{display:flex;gap:10px;margin-top:12px;align-items:flex-start}
.stake-row .msy{color:var(--blue);margin-top:1px;flex:0 0 auto}
.stake-row p{margin:0;font-size:13px;line-height:1.55;color:var(--ink)}

.map-wrap{position:relative;padding:10px 0 30px}
.map-track{position:relative;max-width:720px;margin:0 auto}
.map-track::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:4px;margin-left:-2px;
  background:repeating-linear-gradient(180deg,#d7e3ee 0 10px,transparent 10px 20px);border-radius:99px;z-index:0}
.map-fill{position:absolute;top:0;left:50%;width:4px;margin-left:-2px;border-radius:99px;z-index:0;
  background:linear-gradient(180deg,var(--blue),var(--cyan));transition:height .6s ease}
.map-node-row{position:relative;z-index:1;display:flex;margin:0 0 8px;min-height:112px}
.map-node-row.L{justify-content:flex-start}
.map-node-row.R{justify-content:flex-end}
.map-node{width:calc(50% - 34px);display:flex;align-items:center;gap:14px}
.map-node-row.R .map-node{flex-direction:row-reverse;text-align:right}
.node-dot{position:relative;width:52px;height:52px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:#fff;border:3px solid #dfe9f1;color:#9aabbd;font:700 17px "Rajdhani",sans-serif;box-shadow:0 4px 12px rgba(5,43,81,.06)}
.node-dot .msy{font-size:21px}
.map-node.done .node-dot{background:linear-gradient(145deg,#6bf0c6,#12b888);border-color:#0fb888;color:#003b2d}
.map-node.current .node-dot{border-color:var(--blue);color:var(--blue);animation:nodepulse 1.8s ease-in-out infinite}
.map-node.locked{opacity:.55}
.map-node.locked .node-dot{color:#b7c3cf}
@keyframes nodepulse{0%,100%{box-shadow:0 0 0 0 rgba(0,92,255,.28)}50%{box-shadow:0 0 0 9px rgba(0,92,255,0)}}
.node-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px 15px;flex:1;min-width:0}
.map-node.locked .node-card{background:#f8fbfd}
.node-card strong{display:block;font-size:14px;line-height:1.3;color:var(--ink);margin-bottom:2px}
.node-card small{font-size:11.5px;color:var(--muted);font-weight:600}
.map-node:not(.locked) .node-card{cursor:pointer}
.map-node:not(.locked) .node-card:hover{border-color:var(--blue)}

.path-complete-banner{max-width:720px;margin:20px auto 0;text-align:center;padding:26px;border-radius:20px;color:#fff;
  background:radial-gradient(circle at 50% 0,rgba(0,207,255,.3),transparent 45%),linear-gradient(140deg,#020b18,#083a5a 60%,#075845)}
.path-complete-banner .msy{font-size:34px;color:#ffd76b}
.path-complete-banner h3{margin:8px 0 4px;font-size:24px}
.path-complete-banner p{margin:0;color:#b9d9e8;font-size:13.5px}

/* ===== agent build board (flagship only) ===== */
.abb{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:20px;padding:20px 22px 18px;background:#fff;margin-bottom:8px}
.abb::before{content:"";position:absolute;inset:auto -70px -90px auto;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(0,188,255,.1),transparent 70%)}
.abb-head{position:relative;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.abb-title{display:flex;align-items:center;gap:13px}
.abb-avatar{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#7df2ff,#00bceb);color:#032d53;flex:0 0 auto}
.abb-title small{font:700 10px/1.2 "Rajdhani",sans-serif;letter-spacing:.1em;color:#0070ca}
.abb-title h2{margin:3px 0 2px;font-size:22px;color:#092a45}
.abb-title p{margin:0;font-size:12.5px;color:#698093}
.abb-pct{text-align:right;line-height:1;color:#092a45}
.abb-pct strong{font:700 26px/1 "Rajdhani",sans-serif}
.abb-chain{position:relative;display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:20px}
.abb-rail{position:absolute;top:19px;left:7.14%;right:7.14%;height:3px;border-radius:99px;background:#dfe9f1;z-index:0}
.abb-rail>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .7s cubic-bezier(.2,.8,.25,1)}
.abb-node{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.abb-icon{position:relative;display:grid;width:38px;height:38px;place-items:center;border-radius:12px;border:1px solid #d7e3ee;color:#9aabbd;background:#f3f8fc;transition:all .35s}
.abb-icon .msy{font-size:17px}
.abb-node small{color:#8296a9;font:700 10px/1.2 "Rajdhani",sans-serif}
.abb-node.done .abb-icon{border-color:transparent;color:#003b2d;background:linear-gradient(145deg,#6bf0c6,#12b888);box-shadow:0 5px 12px rgba(18,184,136,.28)}
.abb-node.done small{color:#0c7a56}
.abb-node.next .abb-icon{border-color:rgba(0,92,255,.35);color:var(--blue);background:#eaf2ff;animation:nodepulse 1.8s ease-in-out infinite}
.abb-node.next small{color:var(--blue)}
.abb-node.justdone .abb-icon{animation:pop .55s cubic-bezier(.3,1.4,.4,1) both}
.abb-spark{position:absolute;inset:-9px;display:grid;place-items:center;color:#ffca4b;animation:spark 1.1s ease-out both}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes spark{0%{opacity:0;transform:scale(.5)}35%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1.5)}}
.abb-summary{display:flex;align-items:center;gap:7px;margin:16px 0 0;padding-top:12px;border-top:1px dashed #dfe9f1;color:#45607a;font-size:12.5px}
.abb-summary strong{color:#092a45}

/* ===== mission workspace ===== */
.mission-topbar{position:sticky;top:64px;z-index:20;background:rgba(243,248,252,.92);backdrop-filter:blur(8px);
  padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:22px}
.mission-topbar .inner{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:14px}
.mission-topbar strong{font-size:12.5px;white-space:nowrap}
.bar-track{flex:1;height:6px;border-radius:99px;background:#e2ecf3;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:99px;transition:width .4s}
.mission-body{max-width:820px;margin:0 auto}
.stake-panel{display:flex;gap:12px;background:#fff2e0;border:1px solid #ffdca6;border-radius:16px;padding:16px 18px;margin-bottom:18px}
.stake-panel .msy{color:#c9791b;flex:0 0 auto}
.stake-panel small{font:700 10.5px/1 "Rajdhani",sans-serif;letter-spacing:.1em;color:#a8630f}
.stake-panel p{margin:6px 0 0;font-size:13.5px;line-height:1.55;color:#5a3c0e}
.stake-panel .trythis{margin-top:10px;padding-top:10px;border-top:1px solid #ffe3b5;font-size:13px;color:#5a3c0e}
.mission-title{font-size:clamp(24px,3vw,32px);margin:4px 0 10px;line-height:1.12}
.mission-obj{color:var(--muted);font-size:14.5px;line-height:1.6;max-width:640px;margin:0 0 22px}
.before-box{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.before-box span{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--navy);
  background:#eaf2ff;border:1px solid #cfe1ff;border-radius:99px;padding:6px 12px}
.before-box span .msy{font-size:14px}
.section-h{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.section-h .msy{color:var(--blue)}
.section-h h3{margin:0;font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink)}
.action-list{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.action-row{display:flex;gap:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px 17px;position:relative;overflow:hidden}
.action-row::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:linear-gradient(180deg,var(--blue),var(--cyan))}
.action-num{width:26px;height:26px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;font:700 12px "Rajdhani",sans-serif;
  background:linear-gradient(145deg,#7df2ff,#b5f7ff);color:#00162d}
.action-row h4{margin:0 0 4px;font-size:14.5px}
.action-row p{margin:0;font-size:13.2px;color:var(--muted);line-height:1.55}
.action-note{margin-top:8px;padding:9px 11px;border-radius:10px;background:#fff7e0;color:#8a5f06;font-size:12px;display:flex;gap:6px}
.action-res{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:8px 13px;border-radius:99px;
  background:#eaf2ff;color:var(--blue);font-size:12.5px;font-weight:700}
.action-res:hover{background:#dbeaff}
.mistake-box{display:flex;gap:12px;background:#fdeceb;border:1px solid #f4c2be;border-radius:16px;padding:15px 17px;margin-bottom:22px}
.mistake-box .msy{color:#c23b2e;flex:0 0 auto}
.mistake-box strong{display:block;font-size:13px;margin-bottom:3px}
.mistake-box p{margin:0;font-size:12.8px;color:#7a2c24;line-height:1.5}
.capability-card{display:flex;align-items:center;gap:16px;border-radius:18px;padding:24px 26px;color:#fff;margin-bottom:22px;
  background:radial-gradient(circle at 90% 0,rgba(76,255,204,.24),transparent 32%),linear-gradient(120deg,#062e2a,#075845);
  animation:cardin .5s cubic-bezier(.25,.9,.3,1.15) both}

.capability-card .ic{width:50px;height:50px;border-radius:16px;background:#58e6b9;color:#003b2d;display:grid;place-items:center;flex:0 0 auto;
  animation:iconpulse 1.7s ease-out .1s 1}
@keyframes iconpulse{0%{box-shadow:0 0 0 0 rgba(88,230,185,.55)}70%{box-shadow:0 0 0 18px rgba(88,230,185,0)}100%{box-shadow:0 0 0 0 rgba(88,230,185,0)}}

.capability-card .btn{margin-left:auto;flex:0 0 auto}

.troubleshoot-block{background:#fff;border:1px solid var(--line);border-radius:16px;padding:4px 6px;margin-bottom:30px}
.ts-item summary{list-style:none;cursor:pointer;padding:12px 14px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.ts-item summary::-webkit-details-marker{display:none}
.ts-item summary .msy{color:var(--amber)}
.ts-item p{margin:0 12px 12px 34px;font-size:13px;color:var(--muted);line-height:1.55}

/* ===== quiz ===== */
.quiz-wrap{max-width:660px;margin:0 auto}
.quiz-progress{display:flex;gap:5px;margin-bottom:22px}
.quiz-progress span{flex:1;height:5px;border-radius:99px;background:#e2ecf3}
.quiz-progress span.done{background:var(--green)}
.quiz-progress span.cur{background:var(--blue)}
.quiz-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px}
.quiz-q{font-size:19px;margin:0 0 18px;line-height:1.4}
.quiz-opt{display:block;width:100%;text-align:left;padding:13px 16px;border-radius:13px;border:1.5px solid var(--line);
  margin-bottom:9px;font-size:14px;background:#fff;transition:all .15s}
.quiz-opt:hover{border-color:var(--blue)}
.quiz-opt.correct{background:#e9fbf3;border-color:var(--green);color:#0c6b4c;font-weight:700}
.quiz-opt.wrong{background:#fdeceb;border-color:#e0503f;color:#a3291b;font-weight:700}
.quiz-opt:disabled{cursor:default}
.quiz-explain{margin-top:16px;padding:14px 16px;border-radius:13px;background:#f3f8fc;font-size:13px;line-height:1.6;color:#3a5266}
.quiz-explain a{color:var(--blue);font-weight:700}
.quiz-foot{display:flex;justify-content:flex-end;margin-top:18px}
.quiz-result{text-align:center;padding:40px 20px}
.quiz-result .msy{font-size:54px;color:var(--amber)}
.quiz-result h2{font-size:32px;margin:10px 0}

/* ===== troubleshooting ===== */
.ts-search{position:relative;margin-bottom:16px}
.ts-search .msy{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.ts-search input{width:100%;padding:13px 16px 13px 42px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:14.5px}
.ts-count{font-size:12.5px;color:var(--muted);font-weight:600;margin:0 0 14px}
.ts-card{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.ts-card summary{list-style:none;cursor:pointer;padding:15px 18px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.ts-card summary::-webkit-details-marker{display:none}
.ts-card .lft{display:flex;align-items:center;gap:10px;min-width:0}
.ts-card .sec{font-size:10px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:99px;background:#eaf2ff;color:var(--blue);flex:0 0 auto}
.ts-card strong{font-size:14px}
.ts-card .msy.chev{transition:transform .2s;color:var(--muted)}
.ts-card[open] .msy.chev{transform:rotate(90deg)}
.ts-body{padding:0 18px 18px}
.ts-row{margin-top:10px}
.ts-row small{display:block;font:700 10px/1 "Rajdhani",sans-serif;letter-spacing:.08em;color:var(--muted);margin-bottom:5px}
.ts-row p,.ts-row li{font-size:13px;color:var(--ink);line-height:1.55;margin:0}
.ts-row ul{margin:0;padding-left:18px}

/* ===== badges ===== */
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.badge-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center}
.badge-card .medal{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center}
.badge-card.earned .medal{background:linear-gradient(145deg,#fff0a5,#f4b93e);color:#3f2500;box-shadow:0 10px 20px rgba(244,185,62,.35)}
.badge-card:not(.earned) .medal{background:#eef2f5;color:#b7c3cf}
.badge-card strong{display:block;font-size:14px;margin-bottom:3px}
.badge-card span{font-size:11.5px;color:var(--muted)}

/* ===== toast / confetti ===== */
#toast-wrap{position:fixed;top:78px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;align-items:center;gap:10px;background:#0d1b30;color:#fff;padding:12px 16px;border-radius:14px;
  font-size:13px;font-weight:700;box-shadow:0 14px 30px rgba(0,0,0,.25);animation:toastin .3s ease both}
.toast .msy{color:#ffd76b}
@keyframes toastin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
#confetti-canvas{position:fixed;inset:0;z-index:150;pointer-events:none}

.ag-rail{display:flex;align-items:flex-start;margin:26px auto 26px;max-width:760px}
.ag-node{display:grid;justify-items:center;gap:6px;width:90px;flex:0 0 auto;text-align:center;font-size:12px;font-weight:700;color:var(--ag-muted)}
.ag-node b{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2.5px solid var(--ag-line);color:#9aabbe;transition:all .3s}
.ag-node b .msy{font-size:26px}
.ag-node.done b{background:var(--ag-green);border-color:var(--ag-green);color:#fff}
.ag-node.now b{background:var(--ag-blue);border-color:var(--ag-blue);color:#fff;box-shadow:0 0 0 7px rgba(0,92,255,.14)}
.ag-node.rt b{border-color:#f0a6cd;color:var(--ag-pink)}
.ag-node.rt.now b{background:var(--ag-pink);border-color:var(--ag-pink);color:#fff;box-shadow:0 0 0 7px rgba(214,51,143,.15)}
.ag-node.rt.done b{background:var(--ag-green);border-color:var(--ag-green);color:#fff}
.ag-node.now span{color:var(--ag-ink)}
.ag-wire{flex:1;height:4px;margin-top:24px;border-radius:4px;background:var(--ag-line);position:relative;overflow:hidden}
.ag-wire.done{background:var(--ag-green)}
.ag-wire.done::after{content:"";position:absolute;top:0;left:-30%;width:30%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);animation:agflow 1.6s linear infinite}
@keyframes agflow{to{left:100%}}
@media(max-width:620px){.ag-node{width:58px;font-size:10.5px}.ag-node b{width:40px;height:40px}.ag-node b .msy{font-size:20px}.ag-wire{margin-top:18px}}
/* step */
.ag-step{background:#fff;border:1px solid var(--ag-line);border-radius:26px;overflow:hidden;box-shadow:0 18px 40px rgba(10,35,80,.06);animation:agin .35s ease}
@keyframes agin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ag-shead{padding:26px 30px 6px}
.ag-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.ag-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;font-size:12.5px;font-weight:700;background:#eaf1fb;color:#24476f}
.ag-chip .msy{font-size:16px}.ag-chip.rt{background:#fde8f3;color:#a3246f}.ag-chip.ok{background:#e3f8f0;color:#0b6b4f}
.ag-shead h1{font-size:clamp(32px,4.4vw,46px)}
.ag-lead{margin:10px 0 0;font-size:17px;color:#33465c;max-width:62ch}
.ag-hints{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0 0}
.ag-hints>span{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:#a77400}
.ag-hints>span .msy{font-size:17px}
.ag-hintchip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:#fff7e1;border:1px solid #f1dc9f;color:#6d4d00;font-size:13px;font-weight:600;transition:background .15s,transform .15s}
.ag-hintchip:hover{background:#ffefbf;transform:translateY(-1px)}
.ag-hintchip .msy{font-size:16px;color:#a77400}
.ag-aha{margin:16px 30px 0;display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:16px;background:#fff3fa;border:1px solid #f6c4df;font-size:15px}
.ag-aha>.msy{color:var(--ag-pink);font-size:24px}
.ag-aha b{color:#8a1d5c}
.ag-link{color:var(--ag-blue)!important;font-weight:700!important;text-decoration:underline;text-underline-offset:3px;padding:0!important}
.ag-body{display:grid;grid-template-columns:1.45fr 1fr;gap:26px;padding:22px 30px 8px;align-items:start}
@media(max-width:860px){.ag-body{grid-template-columns:1fr}}
.ag-path{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font:500 12px/1 var(--ag-mono);color:#24476f;margin:0 0 10px}
.ag-path span{background:#eef4fa;border:1px solid var(--ag-line);padding:6px 8px;border-radius:7px}
.ag-path i{font-style:normal;color:#9db0c4}
.ag-fig{margin:0;position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--ag-line);box-shadow:0 10px 26px rgba(10,35,80,.1);background:#fff}
.ag-fig img{display:block;width:100%;height:auto}
.ag-fig figcaption{font-size:12px;color:var(--ag-muted);padding:7px 12px;border-top:1px solid var(--ag-line);background:#fafcfe}
.ag-pin{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--ag-blue)!important;color:#fff!important;font:700 14px/1 Rajdhani,sans-serif!important;box-shadow:0 0 0 4px rgba(0,92,255,.25),0 3px 8px rgba(0,0,0,.25);transition:transform .15s}
.rtstep .ag-pin{background:var(--ag-pink)!important;box-shadow:0 0 0 4px rgba(214,51,143,.25),0 3px 8px rgba(0,0,0,.25)}
.ag-pin.on{transform:translate(-50%,-50%) scale(1.35);background:var(--ag-ink)!important}
.ag-todo{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ag-todo li{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:10px 12px;border-radius:14px;border:1px solid transparent;transition:background .15s,border-color .15s}
.ag-todo li.on{background:#f5f9ff;border-color:#cfe0f7}
.ag-todo li>span{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:#e6f0fb;color:var(--ag-blue);font:700 15px/1 Rajdhani,sans-serif}
.ag-todo li.pinned>span{background:var(--ag-blue);color:#fff}
.rtstep .ag-todo li.pinned>span{background:var(--ag-pink)}
.ag-todo b{display:block;font-size:15px;line-height:1.35}
.ag-todo p{margin:2px 0 0;font-size:14px;color:#3a4c62}
.ag-option{border:1px solid var(--ag-line);border-radius:16px;padding:14px 16px;margin-bottom:12px;background:#f8fbff}
.ag-option b{display:flex;align-items:center;gap:8px;font-size:15px}
.ag-option .msy{color:var(--ag-blue)}
.ag-option p{margin:4px 0 0;font-size:14px;color:#3a4c62}
.ag-sub{margin:0 0 8px;font-weight:700;font-size:14px;color:var(--ag-muted)}
.ag-note{display:flex;gap:10px;align-items:flex-start;margin:14px 0 0;font-size:14px;color:#3a4c62;padding:11px 14px;border-radius:14px;background:#fff8e6;border:1px solid #f1dfaa}
.ag-note .msy{color:#b07d00}
.ag-check{margin:18px 30px 0;padding:18px 20px;border-radius:18px;background:#f3faf7;border:1px solid #c9ecdf}
.ag-check h3{font-size:22px;display:flex;align-items:center;gap:8px;color:#0b6b4f}
.ag-check p{margin:6px 0 12px;font-size:15px}
.ag-row{display:flex;flex-wrap:wrap;gap:10px}
.ag-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:99px;font-weight:700!important;font-size:15px;transition:transform .15s}
.ag-btn:hover{transform:translateY(-1px)}
.ag-btn.go{background:var(--ag-green)!important;color:#fff!important;box-shadow:0 8px 20px rgba(18,184,136,.3)}
.ag-btn.ghost{background:#fff!important;border:1.5px solid var(--ag-line)!important;color:var(--ag-ink)!important}
.ag-btn.small{padding:8px 14px;font-size:13.5px}
.ag-help{margin-top:14px;display:none}
.ag-help.on{display:grid;gap:8px;animation:agin .25s ease}
.ag-help>div{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 12px;border-radius:12px;background:#fff;border:1px solid var(--ag-line);font-size:14px}
.ag-help .msy{color:var(--ag-amber)}
.ag-nav{display:flex;justify-content:space-between;gap:10px;padding:20px 30px 26px}
.ag-more{margin:14px 0 0;border:1px solid var(--ag-line);border-radius:14px;background:#fff}
.ag-more summary{list-style:none;cursor:pointer;padding:12px 16px;font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px}
.ag-more summary::-webkit-details-marker{display:none}
.ag-more summary>.msy:first-child{color:var(--ag-blue)}
.ag-chev{margin-left:auto;transition:transform .2s;color:var(--ag-muted)}
.ag-more[open] .ag-chev{transform:rotate(180deg)}
.ag-in{padding:0 16px 14px;font-size:14.5px;color:#3a4c62}
.ag pre{margin:8px 0 0;background:#06142b;color:#d2e6ff;border-radius:12px;padding:13px 15px;overflow-x:auto;font:500 12.5px/1.55 var(--ag-mono);white-space:pre}
.ag-copy{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700!important;color:var(--ag-blue)!important;padding:4px 8px!important;border-radius:8px}
.ag-copy:hover{background:#e8f0fe}
.ag-copy .msy{font-size:16px}
.ag-pl{margin:12px 0 0;font-weight:700}
/* live */
.ag-live{text-align:center;padding:40px 24px 28px;background:radial-gradient(600px 300px at 50% 0%,rgba(0,188,255,.18),transparent 70%),#fff}
.ag-ring{width:110px;height:110px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:var(--ag-green);color:#fff;position:relative}
.ag-ring .msy{font-size:54px;animation:agshake 1.2s ease-in-out infinite}
.ag-ring::before,.ag-ring::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--ag-green);animation:agwave 2s ease-out infinite}
.ag-ring::after{animation-delay:1s}
@keyframes agwave{from{transform:scale(1);opacity:.7}to{transform:scale(1.8);opacity:0}}
@keyframes agshake{0%,50%,100%{transform:rotate(0)}10%,30%{transform:rotate(-14deg)}20%,40%{transform:rotate(14deg)}}
.ag-live h1{font-size:clamp(40px,6vw,64px)}
.ag-live p{color:var(--ag-muted);font-size:17px;margin:12px auto 0;max-width:52ch}
.ag-built{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:760px;margin:24px auto 0}
@media(max-width:640px){.ag-built{grid-template-columns:1fr 1fr}}
.ag-built div{padding:14px 10px;border-radius:16px;background:#f3faf7;border:1px solid #c9ecdf;font-size:13px;font-weight:600}
.ag-built .msy{display:block;margin:0 auto 6px;color:var(--ag-green);font-size:26px}
/* solve */
#ag-open{max-width:820px;margin:24px auto 0;scroll-margin-top:140px}
.ag-issue{background:#fff;border:1.5px solid #cfe0f7;border-radius:22px;padding:24px 26px;box-shadow:0 16px 36px rgba(10,35,80,.08);animation:agin .3s ease;scroll-margin-top:130px}
.ag-area{font:700 12px/1 Rajdhani,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--ag-blue)}
.ag-issue h2{font-size:clamp(28px,3.6vw,38px);margin:8px 0 10px}
.ag-big{font-size:18px;font-weight:600;line-height:1.5;color:#1b2c42;margin:0 0 14px}
.ag-issue h4{margin:16px 0 6px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ag-muted)}
.ag-issue ol,.ag-issue ul{margin:0;padding-left:22px;display:grid;gap:6px;font-size:15px}
.ag-esc{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:16px;padding:12px 14px;border-radius:14px;background:#f2f6fb;border:1px solid var(--ag-line);font-size:14px}
.ag-esc .msy{color:var(--ag-blue)}
.ag-issue-foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;align-items:center}
.ag-doclink{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#123a66;text-decoration:none;padding:7px 12px;border-radius:99px;border:1px solid var(--ag-line);background:#fff}
.ag-doclink .msy{font-size:16px;color:var(--ag-blue)}
.ag-areas{max-width:1000px;margin:34px auto 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.ag-areas h3{font-size:21px;margin:0 0 8px}
.ag-ilist{display:grid;gap:4px}
.ag-iline{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;padding:9px 12px;border-radius:12px;background:#fff;border:1px solid var(--ag-line);font-size:14px;font-weight:600}
.ag-iline:hover,.ag-iline.on{border-color:var(--ag-blue);color:var(--ag-blue)}
.ag-iline .msy{color:#b3c1d0}
/* overlays */
.ag-veil{position:fixed;inset:0;z-index:90;background:rgba(6,20,43,.55);backdrop-filter:blur(3px);display:none}
.ag-veil.on{display:block}
.ag-sheet{position:fixed;z-index:91;left:50%;top:50%;transform:translate(-50%,-48%);width:min(680px,calc(100% - 24px));max-height:calc(100vh - 40px);overflow:auto;background:#fff;border-radius:28px;padding:34px 36px 28px;box-shadow:0 30px 80px rgba(6,20,43,.4);display:none;font-family:Poppins,ui-sans-serif,system-ui,sans-serif;color:#06142b}
.ag-sheet.on{display:block;animation:agpop .25s ease forwards}
@keyframes agpop{from{opacity:0;transform:translate(-50%,-44%)}to{opacity:1;transform:translate(-50%,-50%)}}

.ag-sheet .ag-x{position:absolute;right:16px;top:16px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#eef3f8!important}
.ag-sheet-ic{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,#ffd76a,#f4a93e);color:#5a3b00;margin-bottom:16px}
.ag-sheet-ic .msy{font-size:34px}
.ag-sheet-ic.warn{background:linear-gradient(135deg,#ffb4a8,#f06b5b);color:#fff}
.ag-sheet .ag-kick{color:#a77400}
.ag-sheet h2{font-size:clamp(30px,4vw,40px);margin:8px 0 12px}
.ag-sheet .ag-big{font-size:21px;font-weight:700;line-height:1.4;margin:0 0 16px;padding:14px 16px;border-radius:16px;background:#fff7e1;border-left:5px solid #f4b93e}
.ag-sheet p{font-size:15.5px;line-height:1.65;margin:0 0 12px;color:#2a3d54}
.ag-sheet .ag-path{margin:6px 0 14px}
.ag-dia{display:flex;align-items:center;gap:0;margin:0 0 16px;padding:14px;border-radius:16px;background:#f4f8fc;overflow-x:auto}
.ag-dia-n{display:grid;justify-items:center;gap:4px;min-width:84px;text-align:center}
.ag-dia-n .msy{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid #cfe0f7;color:#005cff;font-size:24px}
.ag-dia-n small{font-size:12px;font-weight:700;color:#33465c}
.ag-dia-w{flex:1;min-width:16px;height:3px;background:#9fc0ef;margin-bottom:20px;border-radius:3px}
.ag-sheet-foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid #dbe5ef}
.ag-confirm{max-width:480px;text-align:left}
/* ===== New Academy home ===== */
.hm{--hm-ink:#06142b;--hm-blue:#005cff;--hm-cyan:#00bcff;--hm-pink:#d6338f;--hm-green:#12b888;--hm-line:#dbe5ef;--hm-muted:#5a6b7f;background:#f4f8fc;color:var(--hm-ink);font-family:Poppins,ui-sans-serif,system-ui,sans-serif}
.hm *{box-sizing:border-box}
.hm h1,.hm h2,.hm h3{font-family:Rajdhani,"Arial Narrow",sans-serif;font-weight:700;line-height:1.05;margin:0;text-wrap:balance}
:where(.hm) button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.hm :focus-visible{outline:3px solid var(--hm-cyan);outline-offset:3px;border-radius:10px}
.hm-kick{font:700 12px/1 Rajdhani,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#7fdcff}
/* hero */
.hm-hero{background:radial-gradient(900px 420px at 85% -10%,rgba(0,188,255,.25),transparent 60%),radial-gradient(700px 380px at 0% 110%,rgba(186,76,246,.22),transparent 60%),linear-gradient(160deg,#050b18,#0a2350 70%,#0b2f66);color:#fff;padding:44px 20px 30px}
.hm-hero-in{max-width:1120px;margin:0 auto}
.hm-intro{text-align:center;max-width:820px;margin:0 auto}
.hm-intro h1{font-size:clamp(40px,6.2vw,70px);margin:12px 0 12px;color:#fff}
.hm-intro h1 em{font-style:normal;background:linear-gradient(90deg,#45e5ff,#7aa8ff 55%,#e08bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hm-intro p{font-size:17px;color:#c8d8ee;margin:0 auto;max-width:60ch}
.hm-ask{display:grid;justify-items:center;gap:10px;margin:26px 0 10px}
.hm-ask>span{font:700 13px/1 Rajdhani,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#9fb6d3}
.hm-tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.hm-tab{padding:9px 16px;border-radius:99px;background:rgba(255,255,255,.08)!important;border:1px solid rgba(255,255,255,.2)!important;color:#dbe8f7!important;font-size:14px;font-weight:600!important;transition:background .15s,transform .15s}
.hm-tab:hover{background:rgba(255,255,255,.16)!important}
.hm-tab[aria-pressed="true"]{background:linear-gradient(135deg,#0a6dfb,#00bceb)!important;border-color:transparent!important;color:#fff!important;box-shadow:0 8px 22px rgba(0,140,255,.35)}
.hm-scene{position:relative;display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(30px,9vw,130px);align-items:center;margin:16px auto 0;max-width:1000px;padding:18px 8px}
.hm-wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.hm-w{fill:none;stroke:rgba(255,255,255,.1);stroke-width:2}
.hm-w.on{stroke:url(#none);stroke:#45e5ff;stroke-width:3;filter:drop-shadow(0 0 6px rgba(69,229,255,.6))}
.hm-dot{fill:#fff;filter:drop-shadow(0 0 6px #45e5ff)}
.hm-col{display:grid;gap:9px;position:relative;z-index:1}
.hm-col.src{justify-items:end}.hm-col.dst{justify-items:start}
.hm-n{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#8ea6c6;font-size:13.5px;font-weight:600;transition:all .35s}
.hm-n .msy{font-size:19px}
.hm-n.on{background:#fff;color:#06142b;border-color:#fff;box-shadow:0 0 0 4px rgba(69,229,255,.25),0 10px 24px rgba(0,0,0,.25);transform:scale(1.06)}
.hm-n.on .msy{color:#005cff}
.hm-core{position:relative;z-index:1}
.hm-orb{position:relative;width:170px;height:170px;border-radius:50%;display:grid;place-content:center;text-align:center;background:radial-gradient(circle at 35% 30%,#2b8cff,#0a3f9e 60%,#06204f);box-shadow:0 0 0 10px rgba(0,188,255,.1),0 0 60px rgba(0,160,255,.45)}
.hm-orb b{font:700 30px/1 Rajdhani,sans-serif;color:#fff}
.hm-orb small{display:block;max-width:130px;margin:6px auto 0;font-size:12px;font-weight:600;color:#bfe7ff;line-height:1.3}
.hm-orb-ring{position:absolute;inset:-12px;border-radius:50%;border:2px dashed rgba(69,229,255,.35);animation:hmspin 22s linear infinite}
@keyframes hmspin{to{transform:rotate(360deg)}}
.hm-cap{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px;max-width:860px;margin:6px auto 0;min-height:52px;text-align:center}
.hm-cap p{margin:0;font-size:16.5px;color:#e9f2ff;max-width:56ch}
.hm-capgo{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:99px;background:#fff!important;color:#06142b!important;font-weight:700!important;font-size:14px;white-space:nowrap}
.hm-capgo:hover{transform:translateY(-1px)}
.hm-facts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 26px;margin:22px auto 0;padding-top:18px;border-top:1px solid rgba(255,255,255,.1);font-size:13.5px;color:#a9bfdb}
.hm-facts span{display:inline-flex;align-items:center;gap:7px}
.hm-facts .msy{color:#45e5ff;font-size:19px}
@media(max-width:760px){.hm-scene{grid-template-columns:1fr 1fr;gap:16px}.hm-core{grid-column:1/-1;order:-1;justify-self:center}.hm-orb{width:120px;height:120px}.hm-orb b{font-size:22px}.hm-wires{display:none}.hm-col.src,.hm-col.dst{justify-items:stretch}.hm-n{font-size:12.5px}}
/* main */
.hm-main{max-width:1120px;margin:0 auto;padding:26px 20px 60px}
.hm-conts{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.hm-cont{flex:1 1 300px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;padding:14px 18px;border-radius:18px;background:#fff!important;border:1.5px solid #cfe0f7!important}
.hm-cont>.msy:first-child{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#e8f0fe;color:var(--hm-blue)}
.hm-cont small{display:block;font:700 11px/1 Rajdhani,sans-serif;letter-spacing:.14em;color:var(--hm-blue)}
.hm-cont b{font-size:15px}
.hm-cont.done>.msy:first-child{background:#e3f8f0;color:var(--hm-green)}
.hm-searchrow{margin:4px 0 34px}
.hm-ptitle{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:16px}
.hm-ptitle h2{font-size:clamp(30px,4vw,42px)}
.hm-ptitle p{margin:4px 0 0;color:var(--hm-muted)}
.hm-persona{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.hm-persona>span{font-size:13px;font-weight:700;color:var(--hm-muted);margin-right:2px}
.hm-persona button{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:#fff!important;border:1px solid var(--hm-line)!important;font-size:13px;font-weight:600!important;color:#33465c!important}
.hm-persona button .msy{font-size:17px;color:var(--hm-muted)}
.hm-persona button[aria-pressed="true"]{background:var(--hm-ink)!important;border-color:var(--hm-ink)!important;color:#fff!important}
.hm-persona button[aria-pressed="true"] .msy{color:#7fdcff}
.hm-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.hm-subj{grid-column:span 3;background:#fff;border:1px solid var(--hm-line);border-radius:24px;padding:20px;box-shadow:0 10px 26px rgba(10,35,80,.05)}
.hm-subj.wide{grid-column:span 4}
.hm-subj.hot{grid-column:span 2;background:linear-gradient(180deg,#fff5fb,#fff);border-color:#f3c3dd}
@media(max-width:980px){.hm-grid{grid-template-columns:1fr 1fr}.hm-subj,.hm-subj.wide,.hm-subj.hot{grid-column:span 2}}
.hm-subj header{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin-bottom:14px}
.hm-si{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#0a6dfb,#00bceb);color:#fff}
.hm-si .msy{font-size:28px}
.hm-subj.hot .hm-si{background:linear-gradient(135deg,#ba4cf6,#e64ca6)}
.hm-subj.soft .hm-si{background:#e8f0fe;color:var(--hm-blue)}
.hm-subj h3{font-size:27px}
.hm-subj header p{margin:2px 0 0;font-size:14px;color:var(--hm-muted)}
.hm-paths{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.hm-subj.hot .hm-paths,.hm-paths.two{grid-template-columns:1fr}
.hm-path{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;padding:11px 12px;border-radius:14px;background:#f6f9fd!important;border:1px solid #e3ebf3!important;text-decoration:none;color:var(--hm-ink)!important;transition:transform .15s,border-color .15s,background .15s,opacity .2s;overflow:hidden}
.hm-path:hover{transform:translateY(-2px);border-color:var(--hm-blue)!important;background:#fff!important}
.hm-pi{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:#fff;color:var(--hm-blue);border:1px solid #e3ebf3}
.hm-pi .msy{font-size:20px}
.hm-pt b{display:block;font-size:14px;line-height:1.3}
.hm-pt small{display:block;font-size:12px;color:var(--hm-muted);margin-top:1px}
.hm-path.feat{grid-column:1/-1;background:linear-gradient(135deg,#0a4fd6,#00a6e8)!important;border-color:transparent!important;color:#fff!important;padding:14px 16px}
.hm-path.feat .hm-pi{background:rgba(255,255,255,.18);border-color:transparent;color:#fff}
.hm-path.feat b{font-size:16px}.hm-path.feat small{color:#e3f1ff}
.hm-subj.hot .hm-pi{color:var(--hm-pink)}
.hm-for{font:700 10.5px/1 Rajdhani,sans-serif;letter-spacing:.1em;padding:4px 7px;border-radius:99px;background:#e3f8f0;color:#0b6b4f;white-space:nowrap}
.hm-path.feat .hm-for{background:rgba(255,255,255,.22);color:#fff}
.hm-path.mine{border-color:#9fdcc5!important;box-shadow:0 0 0 3px rgba(18,184,136,.12)}
.hm-path.dim{opacity:.38}
.hm-path.dim:hover{opacity:1}
.hm-bar{position:absolute;left:12px;right:12px;bottom:5px;height:3px;border-radius:3px;background:#e3ebf3}
.hm-bar i{display:block;height:100%;border-radius:3px;background:var(--hm-green)}
.hm-bottom{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px}
.hm-paths.two{grid-template-columns:1fr 1fr}@media(max-width:600px){.hm-paths.two{grid-template-columns:1fr}}
@media(max-width:760px){.hm-bottom{grid-template-columns:1fr}}
.hm-videos{margin-top:30px}

ll%20call%20back.%0A-%20If%20the%20situation%20may%20be%20an%20emergency%2C%20advise%20the%20caller%20to%20contact%20the%20appropriate%20local%20emergency%20service.%0A%0AVOICE%20STYLE%0A-%20Use%20short%20sentences.%0A-%20Ask%20one%20question%20at%20a%20time.%0A-%20If%20a%20clinic%20fact%20is%20not%20in%20this%20FAQ%2C%20say%20you%20do%20not%20have%20that%20information%20and%20offer%20a%20staff%20callback.%0A","download":true}},{"title":"Create the document","instruction":"Open AI Agents → Documents → Add document, upload the FAQ, and wait until processing is complete. Use a name you will recognise: Bright Smile FAQ."},{"title":"Attach it to the same agent","instruction":"Edit Bright Smile Receptionist and attach Bright Smile FAQ in its knowledge configuration. Add one rule: answer clinic facts only from this source; if the answer is absent, offer a callback instead of guessing."},{"title":"Repeat the exact question","instruction":"Ask “What time are you open on Friday?” again. Then ask “Are you open on Sunday?” and “Can you diagnose my tooth pain?” Compare the results with the FAQ and the safety rule."}],"success":["Friday hours match the sample FAQ exactly","The agent says the clinic is closed on Sunday","The agent does not diagnose pain and offers the defined callback path"],"troubleshooting":[{"problem":"The old answer does not change","fix":"Confirm document processing completed, the FAQ is attached to Bright Smile Receptionist, and the instructions tell this agent when to use it."},{"problem":"The agent invents a medical answer","fix":"Make the medical boundary explicit, save, and repeat the exact same question. Do not try to solve this with more documents."}],"commonMistake":"Uploading a large document library before one small FAQ works with three repeatable questions.","skipForNow":["Website crawling","Multiple collections","Tool calls","Voice","Phone numbers","Routing"],"opening":{"label":"SEE THE GAP FIRST","problem":"The new agent knows its role, but it does not know Bright Smile's actual hours. If it guesses, callers receive confident misinformation.","tryThis":"Ask: “What time are you open on Friday?” before attaching any document.","expectedGap":"You should see either a guess or an unhelpful refusal. Save that answer—the Mission succeeds only when the same question produces a grounded result."},"capabilityGained":"Bright Smile Receptionist now answers clinic hours from one trusted FAQ and refuses unsafe medical advice.","docUrl":"https://techdocs.audiocodes.com/livehub/#AI-Agents/Add%20an%20AI%20Agent.htm?TocPath=AI%2520Agents%257CAgents%257C_____1"},{"id":"bright-smile-availability","title":"Let it check an appointment slot","objective":"Add one read-only availability tool to the same agent and prove the tool result appears in the answer and logs.","duration":"11 min","path":["AI Agents","Tools","Add tool","Test","Agents","Bright Smile Receptionist"],"requires":["bright-smile-ground"],"before":["The grounded Friday-hours test passes","The public Academy mock endpoint opens and returns fictional slots","The test request: Do you have a hygiene appointment on Tuesday morning?"],"actions":[{"title":"Expose the missing live data","instruction":"Ask the agent: “Do you have a hygiene appointment on Tuesday morning?” The FAQ cannot know changing availability, so the agent should decline or offer a callback—not invent a time."},{"title":"Open the read-only mock endpoint","instruction":"Use the Academy endpoint for this exercise. It contains fictional appointment slots and performs no booking or write action.","resource":{"label":"Open the mock availability data","href":"https://tyzworks200.github.io/Live-Hub-Academy/bright-smile-availability.json"}},{"title":"Create one focused lookup tool","instruction":"In AI Agents → Tools → Add tool, create Bright Smile Availability. Configure a read-only GET request to https://tyzworks200.github.io/Live-Hub-Academy/bright-smile-availability.json. Describe it as a lookup used only when a caller asks for available appointment times."},{"title":"Test the tool before attaching it","instruction":"Run the built-in tool test. Confirm the response contains the Tuesday 10:00 hygiene slot. If the request fails, fix the URL or response handling here—not in the agent prompt."},{"title":"Attach it and define its boundary","instruction":"Attach Bright Smile Availability to Bright Smile Receptionist. Tell the agent to read available slots, never claim a booking is confirmed, and offer staff follow-up after the caller chooses a slot."},{"title":"Repeat the exact request and inspect the log","instruction":"Ask for a Tuesday-morning hygiene appointment again. Confirm the answer offers 10:00, then open AI Agents logs and find the tool request, response, and final answer."}],"success":["The built-in tool test returns the fictional availability data","The agent offers Tuesday at 10:00 without claiming it is booked","AI Agents logs show the tool request, response, and final answer"],"troubleshooting":[{"problem":"The tool returns 4xx, 5xx, or no data","fix":"Open the endpoint directly, verify the exact GET URL, then rerun the built-in test before touching the agent."},{"problem":"The agent answers from memory instead of calling the tool","fix":"Make the tool description specific to appointment availability and state when it must be used."}],"commonMistake":"Attaching an untested endpoint, then changing the prompt when the real fault is the request or response.","skipForNow":["Real scheduling systems","Write or booking actions","Production authentication","Multiple tools","Transfers"],"opening":{"label":"SEE THE GAP FIRST","problem":"The FAQ can answer stable facts, but appointment availability changes. Without a tool, the agent must either guess or send every caller to staff.","tryThis":"Ask: “Do you have a hygiene appointment on Tuesday morning?” before adding the tool.","expectedGap":"A safe agent cannot answer from the FAQ. The tool is the missing bridge between conversation and changing business data."},"capabilityGained":"Bright Smile Receptionist can read a safe availability source and offer a real slot without pretending to book it.","docUrl":"https://techdocs.audiocodes.com/livehub/#AI-Agents/Tools.htm?TocPath=AI%2520Agents%257CTools%257C_____0"},{"id":"bright-smile-voice","title":"Rehearse the patient call by voice","objective":"Give the same agent speech, then complete one realistic patient conversation in the browser before telephony is involved.","duration":"10 min","path":["AI Agents","Agents","Bright Smile Receptionist","Speech and Telephony"],"requires":["bright-smile-availability"],"before":["FAQ and availability tests pass in chat","A target language and matching voice are selected","Browser microphone and speaker permission are available"],"actions":[{"title":"Enable the correct audio path","instruction":"Edit Bright Smile Receptionist → Speech and Telephony and enable voice. Use STT and TTS for a standard model; use voice streaming only with a compatible real-time audio model."},{"title":"Choose matching speech settings","instruction":"Select provider, model, language, and a TTS voice for the same locale. Save the agent and confirm the associated Bot connection exists."},{"title":"Open the direct browser call","instruction":"Go to Bot connections, find the connection created for Bright Smile Receptionist, select its phone icon, and choose the correct microphone and speaker."},{"title":"Play Maya's complete scenario","instruction":"Say: “What time are you open on Friday?” Then ask: “Do you have a hygiene appointment Tuesday morning?” Choose the offered slot and ask what happens next."},{"title":"Test one natural interruption","instruction":"Interrupt one long answer. The agent should stop, listen, and continue naturally. Record what it heard and whether the call ended normally."}],"success":["You hear the Bright Smile greeting in the browser call","The Friday answer matches the FAQ and the Tuesday slot comes from the tool","The agent handles one interruption and the call ends normally"],"troubleshooting":[{"problem":"You hear nothing","fix":"Check browser media permission and the selected microphone/speaker before editing Live Hub."},{"problem":"The words are wrong but chat was correct","fix":"Inspect recognized text and the STT locale. This is now a speech problem, not a grounding problem."}],"commonMistake":"Adding a phone number and route before the exact conversation passes in a direct browser call.","skipForNow":["Phone numbers","Routing","Recording","DTMF","Background music","Voice tuning beyond one locale"],"opening":{"label":"THE STAKE","problem":"A correct chat answer is not yet a good phone experience. Speech recognition, voice locale, turn-taking, and silence can break an otherwise good agent."},"capabilityGained":"Bright Smile Receptionist can complete the clinic-hours and availability scenario in a direct browser voice call.","docUrl":"https://techdocs.audiocodes.com/livehub/#AI-Agents/Add%20an%20AI%20Agent.htm?TocPath=AI%2520Agents%257CAgents%257C_____1"},{"id":"bright-smile-outcomes","title":"Make every call leave a useful outcome","objective":"Extract three business results from the conversation so staff can tell what happened without replaying the call.","duration":"8 min","path":["AI Agents","Post Call Analysis","Add new post call analysis"],"requires":["bright-smile-voice"],"before":["The browser voice scenario completed once","Three outcome values: booked, needs_callback, escalated","A definition for each value that staff would understand"],"actions":[{"title":"Create one post-call analysis","instruction":"Open AI Agents → Post Call Analysis → Add new post call analysis. Name it Bright Smile Outcome, choose Extract variables, and leave WebHook URL empty for this first local proof."},{"title":"Define the outcome and summary","instruction":"Add appointment_outcome with three allowed meanings: booked, needs_callback, and escalated. In the extract prompt, also request a compact summary of what the caller wanted, which slot was offered, and the next action. Unknown information must stay empty."},{"title":"Attach it to the same agent","instruction":"Save the analysis. Edit Bright Smile Receptionist, open its Post Call Analysis tab, add Bright Smile Outcome, and update the agent."},{"title":"Repeat Maya's browser call","instruction":"Run the same hours-and-availability conversation. Choose Tuesday at 10:00, but remember the mock tool cannot confirm a booking, so the expected outcome is needs_callback."},{"title":"Inspect the evidence","instruction":"Open AI Agents logs, find the completed call, and compare appointment_outcome and the summary with what was actually said."}],"success":["Bright Smile Outcome is attached to Bright Smile Receptionist","appointment_outcome is needs_callback for the mock availability call","The summary contains the caller's request, offered slot, and next action","No confirmation or patient detail is invented"],"troubleshooting":[{"problem":"The outcome changes between identical calls","fix":"Tighten the field definition and allowed meanings, then repeat the exact conversation before adding more fields."},{"problem":"The summary claims the appointment is booked","fix":"State explicitly that the availability tool is read-only and that only a real booking confirmation may produce booked."}],"commonMistake":"Extracting dozens of fields before proving the three results that drive a real staff action.","skipForNow":["Webhooks","CRM updates","Sentiment","Large extraction schemas","Production patient data"],"opening":{"label":"THE STAKE","problem":"The call can now help a patient, but staff still need to know whether anything was booked, requires a callback, or was escalated."},"capabilityGained":"Bright Smile Receptionist now produces a reliable outcome and summary after a useful voice conversation.","docUrl":"https://techdocs.audiocodes.com/livehub/#AI-Agents/Add%20an%20AI%20Agent.htm?TocPath=AI%2520Agents%257CAgents%257C_____1"},{"id":"bright-smile-number","title":"Request the clinic's public number","objective":"Submit one US or UK phone-number request and wait for provisioning without pretending that purchase is instant.","duration":"7 min + provisioning","path":["Voice channels","Phone numbers","Add new phone number"],"requires":["bright-smile-outcomes"],"before":["United States or United Kingdom selected for this Academy run","The billing owner knows the displayed monthly fee","Required business information and documents are ready","The target Live Hub region matches the Bright Smile agent connection"],"actions":[{"title":"Open the number request","instruction":"Go to Voice channels → Phone numbers → Add new phone number. For this first run, choose only United States or United Kingdom."},{"title":"Choose the number and region","instruction":"Review the monthly fee. For a US number, select state and city when available, then choose the Live Hub region used by the agent connection."},{"title":"Complete the request form","instruction":"Provide every business field and document requested. Submit the form, then record the request status."},{"title":"Pause for real provisioning","instruction":"Return to Phone numbers until the number is provisioned and visible for use. Record its exact E.164 form and region. Do not create a route around a pending number."}],"success":["The request form and required documents were submitted","The number is provisioned and visible in Phone numbers","Its exact E.164 number and region are recorded"],"troubleshooting":[{"problem":"The country you need is not offered","fix":"Stop this Academy run and contact support for that country. Do not substitute a random country just to continue."},{"problem":"The request remains pending","fix":"Resolve missing form information or wait for review. A routing rule cannot make a pending number callable."}],"commonMistake":"Treating Add new phone number as instant self-service. The form, documents, and provisioning delay are part of the real process.","skipForNow":["Countries outside the US and UK","Several numbers","Number patterns","Production capacity","Advanced number formatting"],"opening":{"label":"THE STAKE","problem":"The agent works in a controlled browser test. A real patient still has no public number to call, and number provisioning may require review."},"capabilityGained":"Bright Smile now has one provisioned public number, in the correct region, ready to become the call origin.","docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Purchasing%20Phone%20Numbers.htm"},{"id":"bright-smile-route-proof","title":"Route the number and call it from your phone","objective":"Connect the provisioned number to Bright Smile Receptionist, complete the whole patient story, and prove the result in Calls and AI Agents logs.","duration":"10 min","path":["Routing","Routing Rules","Add new routing rule"],"requires":["bright-smile-number"],"before":["The Bright Smile number is provisioned","The Bright Smile Bot connection passes the browser voice test","The number, Bot connection, and route use the same Live Hub region","A mobile phone is available for the final call"],"actions":[{"title":"Create one exact inbound route","instruction":"Set Type to Call. Select the Bright Smile Live Hub number as Call origin, then select the Bot connection created for Bright Smile Receptionist under Route To."},{"title":"Keep the baseline clean","instruction":"Use the exact called number. Leave recording, translation, Agent Assist, number customization, and broad patterns off until the baseline works. Save the rule."},{"title":"Call as Maya from a real phone","instruction":"Call the provisioned number. Ask Friday hours, ask for a Tuesday-morning hygiene slot, choose 10:00, confirm that staff will call back, then hang up normally."},{"title":"Prove the telephony path","instruction":"Open Calls and find the newest Call ID. Confirm completion status, the selected routing rule, destination, duration, and transcript where enabled."},{"title":"Prove the agent behavior","instruction":"Open AI Agents logs for the same interaction. Confirm the document answer, availability tool call, final response, summary, and appointment_outcome = needs_callback."},{"title":"Say what you built","instruction":"Use the completion statement on the next screen. If any clause is not proven by evidence, reopen that Mission instead of marking this Path complete."}],"success":["A mobile call reaches Bright Smile Receptionist through the intended routing rule","Calls contains the matching Call ID and successful route evidence","AI Agents logs show grounded hours, the tool result, and needs_callback","You can repeat the call and explain every layer using evidence"],"troubleshooting":[{"problem":"The call never appears in Calls","fix":"The failure occurred before Live Hub. Check the dialed number, provisioning state, carrier, and origin."},{"problem":"The call appears but misses the agent","fix":"Check the exact called number, rule order, region, and selected Bot connection."},{"problem":"Telephony works but the answer is wrong","fix":"The route is healthy. Use AI Agents logs to inspect document retrieval, the tool response, and the agent instructions."}],"commonMistake":"Changing routing, speech, and agent behavior together. Calls proves the path; AI Agents logs explains the behavior.","skipForNow":["Recording","Voice translation","Agent Assist","Transfers","Failover","Number customization","Broad wildcard rules"],"opening":{"label":"THE STAKE","problem":"Everything works in isolation. This final Mission proves that a real public call crosses the route, reaches the same agent, and leaves evidence a colleague can investigate."},"capabilityGained":"A real caller can reach Bright Smile Receptionist, receive grounded and tool-backed help, and leave a verifiable call outcome.","docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/Defining%20Routing.htm"}],"agent-builder":[{"id":"ground-with-documents","title":"Ground answers with documents","objective":"Give the agent a small, trusted knowledge source and prove it uses the source instead of guessing.","duration":"7 min","path":["AI Agents","Documents","Add document","Agents","Attach document"],"architecture":["Trusted content","Document collection","AI agent","Grounded answer"],"before":["One focused file or approved web page","Two questions answered by the source","One question not answered by it"],"actions":[{"title":"Choose a focused source","instruction":"Start with a small product guide, FAQ, or approved page. Avoid a mixed archive for the first test."},{"title":"Create the document","instruction":"Add the file or configure the supported web crawler, then wait until processing is complete."},{"title":"Attach it to the agent","instruction":"Open the agent and select the new document or collection in its knowledge configuration."},{"title":"Test known answers","instruction":"Ask the two prepared questions and compare the answer with the source."},{"title":"Test the boundary","instruction":"Ask the unsupported question and confirm the agent says it does not know or follows your escalation rule."}],"success":["Both known answers match the source","The unsupported answer is not invented","The agent’s response is concise enough for voice"],"troubleshooting":[{"problem":"The document seems ignored","fix":"Confirm processing completed, the document is attached to this agent, and the prompt tells the agent when to consult it."}],"commonMistake":"Uploading a large mixed library before proving one document with three repeatable questions.","docUrl":"https://techdocs.audiocodes.com/livehub/#AI-Agents/Add%20an%20AI%20Agent.htm?TocPath=AI%2520Agents%257CAgents%257C_____1"},{"id":"add-a-tool","title":"Add and verify one tool","objective":"Let the agent perform one external action and prove the request and response in logs.","duration":"8 min","path":["AI Agents","Tools","Add tool","Test","Agents","Attach tool"],"architecture":["Agent intent","Tool request","External endpoint","Tool response","Agent reply"],"before":["One safe action","Endpoint and authentication details","A known test input and expected output"],"actions":[{"title":"Create one focused tool","instruction":"Define a single job such as look up an order or create a ticket. Keep the description explicit about when to use it."},{"title":"Configure the request","instruction":"Add method, URL, authentication, headers, parameters, and response mapping without exposing secrets in descriptions."},{"title":"Run the built-in test","instruction":"Use known input and confirm the tool returns the expected output before attaching it to an agent."},{"title":"Attach it to the agent","instruction":"Open the agent, add the tool, and tell the agent what information it must collect before calling it."},{"title":"Prove it in logs","instruction":"Run a conversation and inspect the tool request, returned data, elapsed time, and final response in AI Agents logs."}],"success":["The tool test succeeds","The agent calls it only when appropriate","The request contains correct values","The final answer reflects the response"],"troubleshooting":[{"problem":"4xx or 5xx response","fix":"Check request shape, authentication, endpoint behavior, and response mapping before changing the prompt."},{"problem":"Status 700 or timeout","fix":"Inspect endpoint reachability and latency, then simplify the call or increase the supported timeout."}],"commonMistake":"Attaching an untested tool and then blaming the prompt when the endpoint fails.","docUrl":"https://techdocs.audiocodes.com/livehub/#AI-Agents/Tools.htm?TocPath=AI%2520Agents%257CTools%257C_____0"},{"id":"post-call-analysis","title":"Capture post-call outcomes","objective":"Turn each completed conversation into consistent variables, summaries, and workflow-ready evidence.","duration":"7 min","path":["AI Agents","Agents","Edit agent","Post-call analysis"],"architecture":["Conversation","Post-call analysis","Variables + summary","Logs or webhook"],"before":["Two or three business fields to extract","A clear definition of success","A webhook endpoint only if downstream delivery is needed"],"actions":[{"title":"Define the outcome","instruction":"Choose a few useful fields such as intent, resolution, case number, sentiment, or handoff reason."},{"title":"Add extraction rules","instruction":"Describe the expected value and format for each variable so results are consistent."},{"title":"Add a short summary","instruction":"Request a compact wrap-up that states what the caller wanted, what happened, and the next action."},{"title":"Configure delivery if needed","instruction":"Add the supported webhook or downstream step and test it with non-sensitive data."},{"title":"Verify after a call","instruction":"Open AI Agents logs and compare extracted fields with what was actually said."}],"success":["Expected variables are present","The summary is accurate","Missing information stays empty instead of being invented","Webhook delivery succeeds when configured"],"troubleshooting":[{"problem":"Extracted values are inconsistent","fix":"Tighten the field definition and format, then repeat the same conversation. Check the log before changing any integration."}],"commonMistake":"Extracting dozens of fields before proving the two or three that drive a real business action.","docUrl":"https://techdocs.audiocodes.com/livehub/#AI-Agents/Add%20an%20AI%20Agent.htm?TocPath=AI%2520Agents%257CAgents%257C_____1"},{"id":"tests-and-logs","title":"Build a repeatable test suite","objective":"Replace one-off demos with scenarios that reveal regressions after every change.","duration":"7 min","path":["AI Agents","Tests","Create test","Run","Logs"],"architecture":["Fixed scenario","Agent run","Expected checks","Log evidence","Pass or fix"],"before":["A happy path","An unclear request","A refusal or handoff case","One tool or document case if used"],"actions":[{"title":"Create the scenarios","instruction":"Use realistic wording and one explicit expected outcome for each case."},{"title":"Run a baseline","instruction":"Execute the suite before changing the agent and save the result."},{"title":"Inspect every failure","instruction":"Use logs to decide whether the failure came from prompt, model, document retrieval, tool, variable, or test expectation."},{"title":"Change one layer","instruction":"Make one focused change, rerun the same suite, and compare the result with the baseline."},{"title":"Keep production gates","instruction":"Require all critical scenarios to pass before publishing or changing routing."}],"success":["Every critical behavior has a named scenario","Failures point to a layer","The same suite can be rerun after a change"],"troubleshooting":[{"problem":"A test passes but callers still fail","fix":"Add the real caller wording and conditions as a new regression scenario instead of weakening the existing expected result."}],"commonMistake":"Changing the agent until one demo works without preserving the scenario as a regression test.","docUrl":"https://techdocs.audiocodes.com/livehub/#AI-Agents/Add%20an%20AI%20Agent.htm?TocPath=AI%2520Agents%257CAgents%257C_____1"},{"id":"agent-or-flow","title":"Choose an agent or controlled flow","objective":"Use a flexible agent for judgment and a flow when the business path must be explicit.","duration":"8 min","path":["AI Agents","Agents or Flows"],"architecture":["Conversation start","Agent judgment or flow node","Tool / knowledge / transition","Outcome"],"before":["The conversation’s required checkpoints","Which decisions may be flexible","Which steps must never be skipped"],"actions":[{"title":"Choose an agent","instruction":"Use an agent when the job is conversational, the order can vary, and judgment matters more than a fixed sequence."},{"title":"Choose a flow","instruction":"Use a flow when required steps, approvals, data collection, or handoffs must be explicit and auditable."},{"title":"Set global behavior","instruction":"Keep tone, safety, language, and universal rules in the shared or global instructions."},{"title":"Design small nodes","instruction":"Give each flow node one goal and make transition conditions specific. Avoid loops with no exit condition."},{"title":"Test every exit","instruction":"Run the happy path, every branch, a missing-value case, and the handoff or failure path."}],"success":["The chosen structure matches the business constraint","Every flow node has one purpose","Every branch and exit has been tested"],"troubleshooting":[{"problem":"The flow repeats or gets stuck","fix":"Inspect transition conditions, variable updates, and exit paths. Make each condition mutually understandable and give loops a stop condition."}],"commonMistake":"Building a complex flow for a flexible conversation—or relying on a free-form agent where mandatory checkpoints exist.","docUrl":"https://techdocs.audiocodes.com/livehub/#AI-Agents/Add%20an%20AI%20Agent.htm?TocPath=AI%2520Agents%257CAgents%257C_____1"}],"sip-trunk":[{"id":"sip-choose-path","title":"Choose the correct SIP connection type","objective":"Select the matching provider profile or the correct generic connection family before touching technical fields.","duration":"4 min","path":["Voice channels","SIP Connections","Add new SIP connection"],"decision":{"question":"What are you connecting, and is its provider listed?","options":[{"title":"Yes — use the listed provider","chooseWhen":"Your carrier, PBX, or contact-center provider appears by name.","next":"Select its provider profile. Live Hub will show the settings that apply to that integration."},{"title":"No — use Generic SIP Trunk","chooseWhen":"A carrier, PBX, or custom SIP trunk is not listed by name.","next":"Set Provider type to SIP Trunk and Provider to Generic SIP Trunk, then follow the complete SIP path in this mission."},{"title":"No — use another Generic type","chooseWhen":"You are connecting an unlisted contact center or unified communications platform.","next":"Choose Contact Center or UC as the Provider type, then select its Generic provider option. Do not label every SIP connection as a SIP Trunk."}]},"architecture":["Your SIP provider","SIP connection","Routing rule","Live Hub destination"],"before":["Provider or platform name","Live Hub region","Whether calls are inbound, outbound, or both"],"actions":[{"title":"Open SIP Connections","instruction":"From Voice channels, open SIP Connections and select Add new SIP connection."},{"title":"Choose the provider type","instruction":"Use SIP Trunk for a carrier or PBX trunk, Contact Center for a contact-center platform, and UC for a unified communications platform. Do not choose Client Applications unless you are configuring a supported client channel such as WebRTC."},{"title":"Check the Provider list","instruction":"If your provider appears, select it. If it does not, choose the Generic option inside the correct provider type. Generic does not mean limited—it means you supply the standard SIP details yourself."},{"title":"Use a clear name and region","instruction":"Name the connection after the provider and environment, such as Provider-SIP-QA, and select the same region used by the services this trunk will reach."}],"skipForNow":["Routing rules","Transfer mode","Custom codecs","Number rewriting"],"success":["Provider type matches SIP Trunk, Contact Center, or UC","You selected exactly one listed or generic path","The connection name identifies provider and environment","The Live Hub region is correct"],"troubleshooting":[{"problem":"The provider is not listed","fix":"Choose Generic SIP Trunk and collect the hostname, addresses, protocols, authentication, and number format from the provider."},{"problem":"You are unsure whether it is SIP","fix":"Ask the provider whether it supports a standard SIP trunk and whether it supplies a hostname or signaling IP addresses."}],"commonMistake":"Mixing a listed-provider guide with Generic SIP fields. Choose one path and stay with it for the first connection.","docUrl":"https://techdocs.audiocodes.com/livehub/Content/LiveHub/adding-generic-sip-connection.htm"},{"id":"sip-provider-checklist","title":"Collect the provider checklist","objective":"Get the seven answers that prevent most trial-and-error during SIP setup.","duration":"5 min","path":["Provider documentation or support","Connection worksheet"],"architecture":["Provider requirements","Live Hub fields","One agreed call format"],"before":["A technical contact at the provider","The countries and numbers you will test"],"actions":[{"title":"Get the destination","instruction":"Collect the provider hostname or signaling IP addresses, ports, and the supported transport: UDP, TCP, or TLS."},{"title":"Confirm authentication","instruction":"Ask whether the provider uses registration, username and password, source IP, Request-URI FQDN, incoming DIDs, or a combination."},{"title":"Confirm security","instruction":"Ask whether TLS is required and whether the provider must trust the Live Hub certificate. Also confirm which Live Hub signaling and media addresses they must allowlist."},{"title":"Confirm number format","instruction":"Agree whether calling and called numbers use E.164 with +, without +, 00, 0, or a national format."},{"title":"Confirm optional behavior","instruction":"Ask whether the provider supports SIP OPTIONS keep-alive, DTMF method, REFER or INVITE transfer, and any required codecs."}],"skipForNow":["Provider options that are not explicitly required","Production capacity increases","Advanced header manipulation"],"success":["Hostname or IP, port, and transport are known","Authentication method is known","Number format is agreed","Optional provider requirements are recorded"],"troubleshooting":[{"problem":"The provider only sent an IP address","fix":"Ask for port, transport, authentication method, number format, and whether they expect Live Hub IPs to be allowlisted."},{"proble
