/* ============ sound (synth, no external audio) ============ */
let audioCtx = null;
function ctx(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function chime(kind){
  if(!STATE.soundOn) return;
  try{
    const c = ctx();
    const notes = kind === "path" ? [523.25,659.25,783.99,1046.5] : [659.25,987.77];
    notes.forEach((f,i)=>{
      const o = c.createOscillator(), g = c.createGain();
      o.type = "sine"; o.frequency.value = f;
      const t0 = c.currentTime + i*0.09;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.13, t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+0.32);
      o.connect(g); g.connect(c.destination);
      o.start(t0); o.stop(t0+0.34);
    });
  }catch(e){}
}

/* ============ confetti ============ */
function confettiBurst(big){
  try{
    const canvas = document.getElementById("confetti-canvas");
    const cctx = canvas.getContext && canvas.getContext("2d");
    if(!cctx) return;
    canvas.width = innerWidth; canvas.height = innerHeight;
    const colors = ["#00bcff","#005cff","#ba4cf6","#12b888","#f4b93e","#00ffff"];
    const n = big ? 160 : 70;
    const parts = Array.from({length:n},()=>({
      x: innerWidth/2 + (Math.random()-0.5)*(big?innerWidth*0.5:260),
      y: innerHeight*0.28 + (Math.random()-0.5)*40,
      vx:(Math.random()-0.5)*9, vy:-Math.random()*9-3, g:0.28+Math.random()*0.15,
      s:4+Math.random()*5, c:colors[(Math.random()*colors.length)|0], r:Math.random()*Math.PI, vr:(Math.random()-0.5)*0.3
    }));
    let frame=0;
    function tick(){
      frame++;
      cctx.clearRect(0,0,canvas.width,canvas.height);
      let alive=false;
      parts.forEach(p=>{
        p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        if(p.y < canvas.height+20) alive=true;
        cctx.save(); cctx.translate(p.x,p.y); cctx.rotate(p.r);
        cctx.fillStyle = p.c; cctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6);
        cctx.restore();
      });
      if(alive && frame < 220) requestAnimationFrame(tick);
      else cctx.clearRect(0,0,canvas.width,canvas.height);
    }
    tick();
  }catch(e){ /* decorative only - never block completion flow */ }
}

/* ============ ring svg ============ */
function ringSvg(pct, size, stroke){
  size = size||38; stroke = stroke||4;
  const r = (size-stroke)/2, c = 2*Math.PI*r, off = c - (pct/100)*c;
  return `<div class="ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}"><circle class="bg" cx="${size/2}" cy="${size/2}" r="${r}"/>
    <circle class="fg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>
    <div class="rlabel">${pct}%</div></div>`;
}

function missionMatches(query){
  const clean = query.toLowerCase().replace(/[^a-z0-9\s-]/g," ").trim();
  if(!clean) return [];
  const aliases = {
    failed:["fail","error","troubleshoot","diagnose"], call:["call","phone","voice"], number:["number","did","phone"],
    sip:["sip","trunk","provider"], teams:["teams","microsoft"], agent:["agent","ai","bot","receptionist"],
    route:["route","routing","origin","destination"], transfer:["transfer","transferred","handoff"],
    billing:["billing","usage","payment","balance","invoice"], alarm:["alarm","monitor","threshold","quality"],
    user:["user","invite","iam","access","group"], account:["account","parent","subaccount","standalone"],
    record:["record","recording","transcript"], translation:["translation","translate","language","hub+"]
  };
  const rawTokens = clean.split(/\s+/).filter(t=>t.length>2);
  const tokens = [...new Set(rawTokens.flatMap(token=>[token,...(aliases[token]||[])]))];
  const results=[];
  D.tracks.forEach(track=>lessonsFor(track.id).forEach((lesson,lessonIndex)=>{
    const title=(lesson.title||"").toLowerCase();
    const path=(lesson.path||[]).join(" ").toLowerCase();
    const hay=[track.title,track.description,track.scenario,lesson.title,lesson.objective,path,lesson.commonMistake].filter(Boolean).join(" ").toLowerCase();
    let score=0;
    if(title.includes(clean)) score+=30;
    if((track.title||"").toLowerCase().includes(clean)) score+=22;
    tokens.forEach(token=>{ if(title.includes(token)) score+=7; else if(path.includes(token)) score+=5; else if(hay.includes(token)) score+=2; });
    if(score) results.push({track,lesson,lessonIndex,score});
  }));
  return results.sort((a,b)=>b.score-a.score).slice(0,3);
}
function showGuideResult(query){
  const result=document.getElementById("guide-result");
  const matches=missionMatches(query);
  if(!matches.length){
    result.className="guide-result show";
    result.innerHTML=`${msy("search_off")}<div><small>TRY A PRODUCT GOAL</small><strong>No exact Mission yet</strong><span>Try routing, SIP, Teams, AI Agent, billing, alarms, or failed call.</span></div>`;
    return;
  }
  const match=matches[0];
  const targetIndex=trackIsComplete(match.track.id)?match.lessonIndex:firstIncompleteIndex(match.track.id);
  const targetLesson=lessonsFor(match.track.id)[targetIndex]||match.lesson;
  const redirected=targetLesson.id!==match.lesson.id;

}

  const lessons = lessonsFor(trackId);
  if(!t){ renderHome(); return; }
  const complete = trackIsComplete(trackId);
  const nextIdx = firstIncompleteIndex(trackId);

  app.innerHTML = `
  <div class="page">
    <a class="back-btn" onclick="go('#/')">${msy("arrow_back")} All paths</a>
    <div class="track-head">
      <div class="track-head-main">
        <span class="kicker">${t.eyebrow}</span>
        <h1>${t.title}</h1>
        <p>${t.description}</p>
        <div class="chip-row" style="margin-top:14px">
          <span class="chip">${msy("schedule",'style="font-size:14px"')} ${t.time}</span>
          <span class="chip">${msy("signal_cellular_alt",'style="font-size:14px"')} ${t.level}</span>
          <span class="chip">${msy("military_tech",'style="font-size:14px"')} ${t.reward}</span>
        </div>
      </div>
      <div class="stake-card">
        <small>THE SCENARIO</small>
        <div class="stake-row">${msy("chat_bubble")}<p>${t.scenario}</p></div>
        <div class="stake-row">${msy("flag")}<p><strong>Outcome:</strong> ${t.outcome}</p></div>
        <div class="stake-row">${msy("fact_check")}<p><strong>Evidence:</strong> ${t.evidence}</p></div>
      </div>
    </div>

    ${trackId === "voice-agent" ? agentBuildBoardHtml(trackId) : ""}

    <div class="map-wrap">
      <div class="map-track" id="map-track">
        <div class="map-fill" id="map-fill" style="height:0"></div>
        ${lessons.map((l,i)=>mapNodeHtml(t, l, i, nextIdx)).join("")}
      </div>
      ${complete ? `<div class="path-complete-banner">${msy("military_tech")}<h3>${t.reward} earned</h3><p>Every mission in this path is proven and saved on this device.</p></div>` : ""}
    </div>
  </div>`;

  requestAnimationFrame(()=>{
    const rows = document.querySelectorAll(".map-node-row");
    const doneCount = trackDoneCount(trackId);
    if(rows.length > 1){
      const trackEl = document.getElementById("map-track");
      const fillPct = doneCount / (lessons.length - 1 || 1);
      document.getElementById("map-fill").style.height = Math.min(100, fillPct*100) + "%";
    }
  });
}

function mapNodeHtml(track, lesson, index, nextIdx){
  const done = isDone(track.id, lesson.id);
  const unlocked = track.id !== "voice-agent" || index === 0 || done || isDone(track.id, lessonsFor(track.id)[index-1].id);
  const isCurrent = !done && unlocked && index === nextIdx;
  const side = index % 2 === 0 ? "L" : "R";
  const cls = done ? "done" : !unlocked ? "locked" : isCurrent ? "current" : "";
  const onclick = unlocked ? `onclick="go('#/track/${track.id}/mission/${index}')"` : "";
  return `<div class="map-node-row ${side}">
    <div class="map-node ${cls}">
      <div class="node-dot">${done ? msy("check") : !unlocked ? msy("lock") : (index+1)}</div>
      <div class="node-card" ${onclick}><strong>${lesson.title}</strong><small>${lesson.duration}</small></div>
    </div>
  </div>`;
}

function agentBuildBoardHtml(trackId){
  const lessons = lessonsFor(trackId);
  const flagIcons = ["person","description","bolt","volume_up","checklist","call","alt_route"];
  const doneCount = trackDoneCount(trackId);
  const pct = trackPercent(trackId);
  const last = doneCount > 0 ? lessons[doneCount-1] : null;
  return `<section class="abb">
    <div class="abb-head">
      <div class="abb-title">
        <div class="abb-avatar">${msy("smart_toy",'style="font-size:22px"')}</div>
        <div><small>ONE PROJECT · SAME AGENT IN EVERY MISSION</small><h2>${D.FLAGSHIP_SCENARIO.agent}</h2>
        <p>${D.FLAGSHIP_SCENARIO.business} · Caller: ${D.FLAGSHIP_SCENARIO.caller}</p></div>
      </div>
      <div class="abb-pct"><strong>${pct}%</strong><br/><small style="font-weight:700;color:#698093">BUILT</small></div>
    </div>
    <div class="abb-chain">
      <div class="abb-rail"><span style="width:${lessons.length>1 ? (doneCount/(lessons.length-1))*100 : (doneCount?100:0)}%"></span></div>
      ${lessons.map((l,i)=>{
        const done = i < doneCount;
        const isNext = i === doneCount;
        const cls = done ? "done" : isNext ? "next" : "";
        return `<div class="abb-node ${cls}"><div class="abb-icon">${msy(done?"check":(flagIcons[i]||"circle"))}</div><small>${l.title.split(" ").slice(0,2).join(" ")}</small></div>`;
      }).join("")}
    </div>
    <p class="abb-summary">${last ? `${msy("auto_awesome")} <strong>Now it can:</strong> ${last.capabilityGained||last.objective}` : "Nothing yet. Mission 1 creates the agent every later Mission improves."}</p>
  </section>`;
}

/* ============ MISSION WORKSPACE ============ */

/* ============ QUIZ ============ */
let quizIndex = 0, quizScore = 0, quizAnswered = false;
function renderQuiz(){
  quizIndex = 0; quizScore = 0;
  renderQuizQuestion();
}
function renderQuizQuestion(){
  const qs = D.knowledgeQuestions;
  if(quizIndex >= qs.length){ renderQuizResult(); return; }
  const q = qs[quizIndex];
  quizAnswered = false;
  app.innerHTML = `<div class="page quiz-wrap">
    <a class="back-btn" onclick="go('#/')">${msy("arrow_back")} Home</a>
    <div class="quiz-progress">${qs.map((_,i)=>`<span class="${i<quizIndex?'done':i===quizIndex?'cur':''}"></span>`).join("")}</div>
    <div class="quiz-card">
      <p class="quiz-q">${q.question}</p>
      <div id="quiz-opts">${q.options.map((o,i)=>`<button class="quiz-opt" data-i="${i}">${o}</button>`).join("")}</div>
      <div id="quiz-explain"></div>
      <div class="quiz-foot"><button class="btn btn-primary" id="quiz-next" style="display:none">${quizIndex===qs.length-1?"See results":"Next question"} ${msy("arrow_forward")}</button></div>
    </div>
  </div>`;
  document.querySelectorAll(".quiz-opt").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(quizAnswered) return;
      quizAnswered = true;
      const i = parseInt(btn.dataset.i,10);
      document.querySelectorAll(".quiz-opt").forEach(b=>b.disabled=true);
      if(i === q.correctIndex){ btn.classList.add("correct"); quizScore++; chime("mission"); }
      else { btn.classList.add("wrong"); document.querySelector(`.quiz-opt[data-i="${q.correctIndex}"]`).classList.add("correct"); }
      document.getElementById("quiz-explain").innerHTML = `<div class="quiz-explain">${q.explanation}${q.sourceUrl?` <a href="${q.sourceUrl}" target="_blank" rel="noreferrer">Read the doc ${msy("open_in_new",'style="font-size:13px"')}</a>`:""}</div>`;
      document.getElementById("quiz-next").style.display = "inline-flex";
    });
  });
  document.getElementById("quiz-next").addEventListener("click", ()=>{ quizIndex++; renderQuizQuestion(); });
}
function renderQuizResult(){
  const qs = D.knowledgeQuestions;
  if(quizScore > (STATE.quizBest||0)){ STATE.quizBest = quizScore; STATE.xp += 20; saveState(); }
  confettiBurst(quizScore === qs.length);
  app.innerHTML = `<div class="page quiz-wrap">
    <div class="quiz-card quiz-result">
      ${msy("military_tech")}
      <h2>${quizScore} / ${qs.length}</h2>
      <p style="color:var(--muted)">Best score saved on this device: ${STATE.quizBest}/${qs.length}</p>
      <div class="hero-ctas" style="justify-content:center;margin-top:18px">
        <button class="btn btn-primary" onclick="go('#/quiz')">${msy("refresh")} Retake quiz</button>
        <button class="btn btn-ghost" onclick="go('#/')" style="color:var(--ink);border-color:var(--line)">Back home</button>
      </div>
    </div>
  </div>`;
  syncTopbar();
}

/* ============ V22 COMMUNITY ============ */
const CKEY="lha_community_v22";
function loadCommunity(){try{return JSON.parse(localStorage.getItem(CKEY))||{ideas:[],posts:[]}}catch(e){return {ideas:[],posts:[]}}}
function saveCommunity(c){try{localStorage.setItem(CKEY,JSON.stringify(c))}catch(e){}}
function seedIdeas(){let c=loadCommunity();if(!c.ideas.length){c.ideas=[{id:1,type:"Product idea",title:"Show why a routing rule did not match",votes:18,status:"New"},{id:2,type:"Academy improvement",title:"Add more guided monitoring labs with screenshots",votes:12,status:"Under discussion"},{id:3,type:"Friction",title:"Make the path from a failed metric to its underlying calls more obvious",votes:9,status:"New"}];saveCommunity(c)}return c}
function communityIdeas(){return seedIdeas().ideas}
function escCommunity(x){return String(x||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function renderCommunity(){const c=seedIdeas();app.innerHTML=`<div class="page"><a class="back-btn" onclick="go('#/')">${msy("arrow_back")} Home</a><div class="community-head"><div><span class="kicker">${msy("groups")} LIVE HUB COMMUNITY</span><h1>Built by people who build with Live Hub.</h1><p class="lead" style="font-size:16px">Learn from verified guidance, share field experience, and help shape what gets easier next.</p></div><button class="btn btn-primary" onclick="openFeedback('idea')">${msy("add")} Share an idea</button></div><div class="community-grid"><div class="community-card"><small>LEARN TOGETHER</small><h3>Tips from the field</h3><p><span class="verified">✓ Verified by AudioCodes</span> stays distinct from <span class="community-tip">◆ Community tip</span>.</p></div><div class="community-card"><small>KEEP THE REAL ACADEMY</small><h3>Screenshots, walkthroughs & evidence</h3><p>The community layer sits on top of the full V20 learning engine. It does not replace the visual guides, resources, troubleshooting data, or proof missions.</p></div><div class="community-card"><small>YOUR VOICE</small><h3>Feedback should go somewhere.</h3><p>Product ideas, Academy improvements and friction reports live in one visible loop with votes and status.</p></div></div><h2 style="margin-top:34px">Ideas & feedback</h2><div class="idea-form"><select id="idea-type"><option>Product idea</option><option>Academy improvement</option><option>Friction</option></select><input id="idea-title" placeholder="What should be better?"/><button class="btn btn-primary" onclick="quickIdea()">Post idea</button></div><div class="idea-list">${c.ideas.sort((a,b)=>b.votes-a.votes).map(i=>`<div class="idea-row"><button class="vote-btn" onclick="voteIdea(${i.id})">▲<br>${i.votes}</button><div><small>${i.type}</small><h3>${escCommunity(i.title)}</h3></div><span class="idea-status">${i.status}</span></div>`).join("")||'<div class="community-empty">Be the first to share an idea.</div>'}</div></div>`}
function quickIdea(){const title=document.getElementById("idea-title").value.trim();if(!title)return toast("Give the idea a short title","edit");const c=seedIdeas();c.ideas.push({id:Date.now(),type:document.getElementById("idea-type").value,title,votes:1,status:"New"});saveCommunity(c);toast("Idea posted to this prototype","lightbulb");renderCommunity()}
function voteIdea(id){const c=seedIdeas(),i=c.ideas.find(x=>x.id===id);if(i)i.votes++;saveCommunity(c);renderCommunity()}
function openFeedback(kind,trackId,lessonId){const labels={tip:"Share a community tip",question:"Ask the community",idea:"Suggest an improvement"};const el=document.createElement("div");el.className="feedback-modal";el.id="feedback-modal";el.innerHTML=`<div class="feedback-panel"><span class="kicker">${msy("forum")} COMMUNITY</span><h2>${labels[kind]||"Share feedback"}</h2><p style="color:var(--muted)">Prototype note: contributions are saved in this browser. A production community would connect this UI to a shared backend.</p><textarea id="feedback-text" placeholder="Write something useful to the next Live Hub builder…"></textarea><div class="row"><button class="btn btn-ghost" style="color:var(--ink);border-color:var(--line)" onclick="document.getElementById('feedback-modal').remove()">Cancel</button><button class="btn btn-primary" onclick="submitFeedback('${kind}','${trackId||""}','${lessonId||""}')">Post</button></div></div>`;document.body.appendChild(el);setTimeout(()=>document.getElementById("feedback-text").focus(),0)}
function submitFeedback(kind,trackId,lessonId){const text=document.getElementById("feedback-text").value.trim();if(!text)return;const c=seedIdeas();if(kind==="idea")c.ideas.push({id:Date.now(),type:"Product idea",title:text,votes:1,status:"New"});else c.posts.push({id:Date.now(),kind,trackId,lessonId,text});saveCommunity(c);document.getElementById("feedback-modal").remove();toast(kind==="idea"?"Idea added · thank you":"Shared with the community prototype",kind==="tip"?"lightbulb":"forum")}

/* ============ TROUBLESHOOTING ============ */
let tsQuery = "", tsSection = "All";
function renderTroubleshoot(){
  tsQuery=""; tsSection="All";
  const sections = ["All", ...new Set(D.troubleshooting.map(x=>x.section))];
  app.innerHTML = `<div class="page">
    <a class="back-btn" onclick="go('#/')">${msy("arrow_back")} Home</a>
    <span class="kicker">${msy("menu_book")} TROUBLESHOOTING BOOK</span>
    <h1 style="margin:8px 0 16px">${D.troubleshooting.length} real Live Hub issue patterns</h1>
    <div class="ts-search">${msy("search")}<input id="ts-search-input" placeholder="Search by status, code, or keyword…"/></div>
    <div class="chip-row" id="ts-chip-row">${sections.map(s=>`<button class="chip ${s==='All'?'on':''}" data-s="${s}">${s}</button>`).join("")}</div>
    <p class="ts-count" id="ts-count"></p>
    <div id="ts-list"></div>
  </div>`;
  document.getElementById("ts-search-input").addEventListener("input", e=>{ tsQuery = e.target.value; renderTsList(); });
  document.querySelectorAll("#ts-chip-row .chip").forEach(c=>{
    c.addEventListener("click", ()=>{ tsSection = c.dataset.s; document.querySelectorAll("#ts-chip-row .chip").forEach(x=>x.classList.remove("on")); c.classList.add("on"); renderTsList(); });
  });
  renderTsList();
}
function renderTsList(){
  const q = tsQuery.trim().toLowerCase();
  const list = D.troubleshooting.filter(x=>{
    const okSec = tsSection==="All" || x.section===tsSection;
    const hay = (x.title+" "+x.meaning+" "+(x.status||[]).join(" ")).toLowerCase();
    return okSec && (!q || hay.includes(q));
  });
  document.getElementById("ts-count").textContent = `${list.length} matching entries`;
  document.getElementById("ts-list").innerHTML = list.slice(0,60).map(x=>`
    <details class="ts-card">
      <summary><div class="lft"><span class="sec">${x.section}</span><strong>${x.title}</strong></div>${msy("chevron_right","class=\"chev\"")}</summary>
      <div class="ts-body">
        <div class="ts-row"><small>MEANING</small><p>${x.meaning}</p></div>
        ${x.causes&&x.causes.length?`<div class="ts-row"><small>LIKELY CAUSES</small><ul>${x.causes.map(c=>`<li>${c}</li>`).join("")}</ul></div>`:""}
        ${x.actions&&x.actions.length?`<div class="ts-row"><small>SELF-SERVICE ACTIONS</small><ul>${x.actions.map(c=>`<li>${c}</li>`).join("")}</ul></div>`:""}
        ${x.escalate?`<div class="ts-row"><small>ESCALATE WHEN</small><p>${x.escalate}</p></div>`:""}
        ${x.evidence&&x.evidence.length?`<div class="ts-row"><small>EVIDENCE TO COLLECT</small><ul>${x.evidence.map(c=>`<li>${c}</li>`).join("")}</ul></div>`:""}
      </div>
    </details>`).join("") || `<p style="color:var(--muted)">No matches. Try a different keyword.</p>`;
}

/* ============ BADGES ============ */
function renderBadges(){
  app.innerHTML = `<div class="page">
    <a class="back-btn" onclick="go('#/')">${msy("arrow_back")} Home</a>
    <span class="kicker">${msy("military_tech")} MY BADGES</span>
    <h1 style="margin:8px 0 20px">${earnedBadges().length} of ${D.tracks.length} earned</h1>
    <div class="badge-grid">
      ${D.tracks.map(t=>{
        const complete = trackIsComplete(t.id);
        return `<div class="badge-card ${complete?'earned':''}" onclick="go('#/track/${t.id}')">
          <div class="medal">${msy(complete?"military_tech":"lock",'style="font-size:28px"')}</div>
          <strong>${t.reward}</strong><span>${t.title}</span>
        </div>`;
      }).join("")}
    </div>
  </div>`;
}

/* ============ top-level controls ============ */
document.addEventListener("DOMContentLoaded", ()=>{
  document.getElementById("soundbtn").addEventListener("click", ()=>{
    STATE.soundOn = !STATE.soundOn; saveState(); syncTopbar();
    if(STATE.soundOn) chime("mission");
  });
  document.querySelectorAll("#topnav button[data-nav]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const nav = b.dataset.nav;
      go(nav==="home" ? "#/" : "#/"+nav);
    });
  });
  document.getElementById("burger").addEventListener("click", ()=>{
    const nav = document.getElementById("topnav");
    nav.style.display = nav.style.display === "flex" ? "none" : "flex";
  });
});
</script>
</body>
